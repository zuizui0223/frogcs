<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
<rect width="1500" height="760" fill="white"/>
<text x="50" y="52" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="bold">Figure 2. Rainfall-associated incidence growth is more boundary-biased than uniform activation predicts</text>

<!-- Panel A -->
<text x="55" y="105" font-family="Arial" font-size="24" font-weight="bold">A  Observed incidence allocation</text>
<text x="55" y="142" font-family="Arial" font-size="18">Rows: route-new vs route-existing species · Columns: newly active vs already-active stops</text>
<rect x="70" y="190" width="250" height="170" rx="8" fill="#e6e6e6" stroke="#222"/>
<rect x="320" y="190" width="250" height="170" rx="8" fill="#f0f0f0" stroke="#222"/>
<rect x="70" y="360" width="250" height="170" rx="8" fill="#f0f0f0" stroke="#222"/>
<rect x="320" y="360" width="250" height="170" rx="8" fill="#f7f7f7" stroke="#222"/>
<text x="195" y="225" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Corner expansion</text>
<text x="195" y="292" text-anchor="middle" font-family="Arial" font-size="40" font-weight="bold">36.9%</text>
<text x="445" y="225" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Taxonomic deepening</text>
<text x="445" y="292" text-anchor="middle" font-family="Arial" font-size="40" font-weight="bold">39.9%</text>
<text x="195" y="395" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Spatial spread</text>
<text x="195" y="462" text-anchor="middle" font-family="Arial" font-size="40" font-weight="bold">15.2%</text>
<text x="445" y="395" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">Within-core</text>
<text x="445" y="462" text-anchor="middle" font-family="Arial" font-size="40" font-weight="bold">8.0%</text>
<text x="70" y="565" font-family="Arial" font-size="20" font-weight="bold">Boundary crossing = 92.0%</text>
<text x="70" y="594" font-family="Arial" font-size="17">Four exact components sum to the total incidence slope.</text>

<!-- Panel B -->
<text x="620" y="105" font-family="Arial" font-size="24" font-weight="bold">B  Observed vs uniform-activation null</text>
<text x="620" y="142" font-family="Arial" font-size="18">Primary κ = 2 · 1,000 simulations · magnitude matched in expectation</text>
<line x1="820" y1="180" x2="820" y2="560" stroke="#bbb" stroke-width="1"/>
<line x1="620" y1="560" x2="1060" y2="560" stroke="#222" stroke-width="2"/>
<text x="620" y="590" font-family="Arial" font-size="15">0%</text>
<text x="810" y="590" font-family="Arial" font-size="15">25%</text>
<text x="1000" y="590" font-family="Arial" font-size="15">50%</text>
<text x="620" y="625" font-family="Arial" font-size="16">Share of total rainfall-associated incidence slope</text>

<text x="620" y="210" font-family="Arial" font-size="17">Corner</text>
<rect x="720" y="190" width="280" height="18" fill="#222"/>
<rect x="720" y="214" width="208" height="14" fill="#aaa"/>
<line x1="897" y1="221" x2="960" y2="221" stroke="#555" stroke-width="3"/>
<text x="1010" y="205" font-family="Arial" font-size="15">Obs 36.9%</text>
<text x="1010" y="226" font-family="Arial" font-size="15">Null 27.4%</text>

<text x="620" y="295" font-family="Arial" font-size="17">Spatial spread</text>
<rect x="720" y="275" width="116" height="18" fill="#222"/>
<rect x="720" y="299" width="174" height="14" fill="#aaa"/>
<line x1="852" y1="306" x2="936" y2="306" stroke="#555" stroke-width="3"/>
<text x="1010" y="290" font-family="Arial" font-size="15">Obs 15.2%</text>
<text x="1010" y="311" font-family="Arial" font-size="15">Null 22.9%</text>

<text x="620" y="380" font-family="Arial" font-size="17">Taxonomic deepening</text>
<rect x="720" y="360" width="303" height="18" fill="#222"/>
<rect x="720" y="384" width="232" height="14" fill="#aaa"/>
<line x1="913" y1="391" x2="995" y2="391" stroke="#555" stroke-width="3"/>
<text x="1030" y="375" font-family="Arial" font-size="15">Obs 39.9%</text>
<text x="1030" y="396" font-family="Arial" font-size="15">Null 30.5%</text>

<text x="620" y="465" font-family="Arial" font-size="17">Within-core</text>
<rect x="720" y="445" width="61" height="18" fill="#222"/>
<rect x="720" y="469" width="145" height="14" fill="#aaa"/>
<line x1="815" y1="476" x2="916" y2="476" stroke="#555" stroke-width="3"/>
<text x="930" y="460" font-family="Arial" font-size="15">Obs 8.0%</text>
<text x="930" y="481" font-family="Arial" font-size="15">Null 19.1%</text>

<text x="620" y="535" font-family="Arial" font-size="17" font-weight="bold">4-component omnibus Monte Carlo P = 0.001</text>
<text x="620" y="660" font-family="Arial" font-size="16">Black = observed · grey = null mean · line = null 95% interval</text>

<!-- Panel C -->
<text x="1110" y="105" font-family="Arial" font-size="24" font-weight="bold">C  Pairwise Sørensen</text>
<text x="1110" y="142" font-family="Arial" font-size="18">Practical-equivalence test</text>
<rect x="1130" y="240" width="300" height="90" fill="#efefef" stroke="#999"/>
<text x="1280" y="225" text-anchor="middle" font-family="Arial" font-size="15">Frozen post hoc margin ±0.025</text>
<line x1="1280" y1="220" x2="1280" y2="360" stroke="#222" stroke-width="1"/>
<line x1="1216" y1="285" x2="1305" y2="285" stroke="#111" stroke-width="5"/>
<circle cx="1274" cy="285" r="8" fill="#111"/>
<text x="1280" y="390" text-anchor="middle" font-family="Arial" font-size="17">β = -0.00049</text>
<text x="1280" y="418" text-anchor="middle" font-family="Arial" font-size="17">90% CI: -0.0107 to +0.00968</text>
<text x="1280" y="456" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">PASS</text>
<text x="1280" y="490" text-anchor="middle" font-family="Arial" font-size="15">Exact-year also passes</text>
<text x="1110" y="565" font-family="Arial" font-size="16">Uniform-null Sørensen:</text>
<text x="1110" y="593" font-family="Arial" font-size="16">mean -0.00615</text>
<text x="1110" y="621" font-family="Arial" font-size="16">95% null: -0.0130 to +0.00178</text>
<text x="1110" y="657" font-family="Arial" font-size="15">Null rejection comes from incidence allocation,</text>
<text x="1110" y="680" font-family="Arial" font-size="15">not from an exceptional beta-diversity slope.</text>

<text x="55" y="725" font-family="Arial" font-size="15">Uniform activation preserves dry-side acoustic propensities and applies one common log-odds shift; it is an acoustic observation-process null, not a demographic model.</text>
</svg>