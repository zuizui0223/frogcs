name: NAAMP future-rain negative control

on:
  push:
    branches: [exploration/public-scale-transferability-v1]
    paths:
      - exploration/NAAMP_FUTURE_RAIN_NEGATIVE_CONTROL_CONTRACT_V0_1.json
      - exploration/run_naamp_future_rain_negative_control.py
      - .github/workflows/naamp_future_rain_negative_control.yml
      - .github/run_requests/naamp_future_rain_negative_control.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naamp-future-rain-negative-control
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exploration/public-scale-transferability-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q icechunk xarray zarr numpy pandas scipy statsmodels patsy timezonefinder 'numcodecs[pcodec]'
      - name: Run frozen future-rain negative control
        run: python exploration/run_naamp_future_rain_negative_control.py
      - name: Validate receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("exploration/NAAMP_FUTURE_RAIN_NEGATIVE_CONTROL_RECEIPT_V0_1.json")
          x=json.loads(p.read_text())
          assert x["coverage"]["gate_pass"] is True
          assert x["status"]=="complete"
          assert x["classification"] in {"future_placebo_rejected","future_placebo_sufficient"}
          print(json.dumps({
              "coverage":x["coverage"],
              "linear":x["same_sample_linear_comparator"],
              "antecedent":x["antecedent_72h_amount_model"],
              "future":x["future_72h_placebo_model"],
              "comparison":x["residual_comparison"],
              "classification":x["classification"],
          },indent=2))
          PY
      - name: Commit receipt to exploration branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exploration/NAAMP_FUTURE_RAIN_NEGATIVE_CONTROL_RECEIPT_V0_1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record future-rain negative-control result"
          git pull --rebase origin exploration/public-scale-transferability-v1
          git push origin HEAD:exploration/public-scale-transferability-v1
