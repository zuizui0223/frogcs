name: build pulse-template figures
# RC3 renderer: within-taxon multi-site concentration terminology
on:
  push:
    branches: [revision/pulse-template-synthesis-v1]
    paths:
      - revision/PULSE_TEMPLATE_FIGURE_DATA_V0_1.json
      - revision/build_pulse_template_figures.py
      - .github/workflows/build_pulse_template_figures.yml
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q matplotlib numpy
      - run: python revision/build_pulse_template_figures.py
      - name: Commit generated figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures_pulse_template
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build integrated pulse-template figures"
          git push
