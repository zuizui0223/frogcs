name: Nap Nap public asset-link inventory (no observations)
on:
  push:
    branches: [audit/iowa-station-waterstate-source-gate-v31]
    paths: [.github/workflows/napnap_public_asset_inventory.yml]
permissions: {}
jobs:
  public-linked-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect source-pinned application data references without executing JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from urllib.request import Request,build_opener,HTTPRedirectHandler
          from urllib.error import HTTPError,URLError
          from html.parser import HTMLParser
          from hashlib import sha256
          from pathlib import Path
          from datetime import datetime,timezone
          import json,re
          ROOT='https://media.flow-mer.org.au/napnap/'
          PINS={ROOT:'fb3b0ec7b20b42fbf13e3fc330c385b68a2b9e4a48f84420bdb8113e44aa9a92',ROOT+'scrolly-audio-unload.js':'b7a6e78fbb8cdbc44d96acc94767e3843be292f3e258b54c0f3aa6c5a205914b'}
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          def read(u):
              if u not in PINS: raise ValueError('UNAPPROVED_URL')
              with build_opener(NoRedirect).open(Request(u,headers={'User-Agent':'frogcs-public-asset-inventory/1.0'}),timeout=25) as r:
                  b=r.read(200001)
                  if r.status!=200 or len(b)>200000: raise ValueError('SIZE_OR_STATUS')
              if sha256(b).hexdigest()!=PINS[u]: raise ValueError('SOURCE_CHANGED')
              return b.decode('utf-8-sig')
          class InlineScripts(HTMLParser):
              def __init__(self): super().__init__(); self.active=False; self.parts=[]; self.entries=[]
              def handle_starttag(self,t,a):
                  if t=='script': self.active='src' not in dict(a); self.parts=[]
              def handle_data(self,x):
                  if self.active: self.parts.append(x)
              def handle_endtag(self,t):
                  if t=='script' and self.active: self.entries.append(''.join(self.parts)); self.active=False
          def excerpt(line):
              if re.search(r'latitude|longitude|coordinate|api_key|password|token|statcounter',line,re.I): return '[OMITTED]'
              if len(line)>350: return '[LONG_LINE_OMITTED]'
              return re.sub(r'(?<!\w)[+-]?\d+\.\d{3,}', '[DECIMAL]',line.strip())[:300]
          result={'status':'NOT_FETCHED','checked_utc':datetime.now(timezone.utc).isoformat(),'source_pins':PINS,'javascript_executed':False,'audio_or_separate_data_tables_requested':False,'numeric_source_rows_parsed':False}
          try:
              html=read(ROOT); script=read(ROOT+'scrolly-audio-unload.js')
              ip=InlineScripts();ip.feed(html)
              result['inline_script_metadata']=[{'characters':len(x),'assignment_names':sorted(set(re.findall(r'(?:var\s+|let\s+|const\s+)([A-Za-z_$][\w$]*)\s*=',x))),'object_key_names':sorted(set(re.findall(r'["\x27]([A-Za-z_][\w-]{0,50})["\x27]\s*:',x)))[:40]} for x in ip.entries]
              result['application_reference_lines']=[{'line':i,'text':excerpt(x)} for i,x in enumerate(script.splitlines(),1) if re.search(r'\$http|fetch\(|\.txt|\.json|\.csv|depth|data\s*=|days\s*=|audios\s*=|sound\s*=|\.mp3|\.wav|date\s*=|date:',x,re.I)][:80]
              result['html_data_elements']=[excerpt(x) for x in html.splitlines() if re.search(r'text/(?:csv|plain)|application/json|id=["\x27](?:data|days|depth)|\.csv|\.json|\.txt',x,re.I)][:30]
              result['status']='PINNED_PUBLIC_CODE_REFERENCES_INSPECTED'
          except HTTPError as e: result.update(status='HTTP_STOP',http_status=e.code)
          except (URLError,TimeoutError) as e: result.update(status='NETWORK_STOP',error_type=type(e).__name__)
          except (ValueError,UnicodeError) as e: result.update(status='CONTENT_STOP',error_code=str(e) if str(e)=='SOURCE_CHANGED' else type(e).__name__)
          Path('napnap_public_asset_links.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: napnap-public-asset-links-no-observations
          path: napnap_public_asset_links.json
          if-no-files-found: error
