name: Nap Nap public asset-link inventory (no observations)
on:
  push:
    branches: [audit/iowa-station-waterstate-source-gate-v31]
    paths: [.github/workflows/napnap_public_asset_inventory.yml]
permissions: {}
jobs:
  public-linked-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test URL boundaries and inspect only public HTML plus linked scripts
        shell: bash
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from hashlib import sha256
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit, unquote
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError, URLError
          import json
          import re
          ROOT = 'https://media.flow-mer.org.au/napnap/'
          CAP = 1_500_000
          MAX_SCRIPTS = 10
          def allowed(url):
              try:
                  p=urlsplit(url); path=unquote(p.path)
                  return (p.scheme=='https' and p.hostname=='media.flow-mer.org.au'
                      and p.port in (None,443) and p.username is None and p.password is None
                      and not p.query and not p.fragment and path.startswith('/napnap/')
                      and not any(x in path for x in ('..','\\','\x00')))
              except (ValueError,TypeError): return False
          class Scripts(HTMLParser):
              def __init__(self): super().__init__(); self.urls=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='script' and a.get('src'):
                      u=urljoin(ROOT,a['src'])
                      if allowed(u) and urlsplit(u).path.lower().endswith('.js'): self.urls.append(u)
          def script_links(text):
              p=Scripts(); p.feed(text); return list(dict.fromkeys(p.urls))
          def data_links(text):
              links=[]
              for m in re.finditer(r'''["']([^"'\s<>]{1,220}\.(?:json|csv|tsv))["']''',text,re.I):
                  literal=m.group(1)
                  if any(c in literal for c in ('${','{{','\\','..')): continue
                  u=urljoin(ROOT,literal)
                  if allowed(u): links.append(u)
              return list(dict.fromkeys(links))
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          def fetch(url):
              if not allowed(url): raise ValueError('URL_OUTSIDE_FROZEN_SCOPE')
              with build_opener(NoRedirect).open(Request(url,headers={
                  'Accept':'text/html, application/javascript, text/javascript',
                  'User-Agent':'frogcs-public-asset-inventory/1.0'}),timeout=25) as r:
                  raw=r.read(CAP+1)
                  if r.status!=200 or len(raw)>CAP: raise ValueError('RESPONSE_STATUS_OR_SIZE')
                  text=raw.decode('utf-8-sig')
              return text,{'url':url,'bytes':len(raw),'sha256':sha256(raw).hexdigest()}
          assert allowed(ROOT)
          assert script_links('<script src="js/app.js"></script><script src="https://cdn.example/a.js"></script>')==[ROOT+'js/app.js']
          assert data_links("$http.get('data/day.json'); let x='x.csv';")==[ROOT+'data/day.json',ROOT+'x.csv']
          assert data_links("'calls.wav'; 'calls.mp3'; '../hidden.json'; 'https://bad.test/a.json'")==[]
          for bad in ['http://media.flow-mer.org.au/napnap/a.js',ROOT+'../secret.js','https://other.test/napnap/a.js','https://user:pwd@media.flow-mer.org.au/napnap/a.js',ROOT+'a.js?token=secret',ROOT+'%2e%2e/private.js']:
              assert not allowed(bad)
          print('PASS: local fixture tests; these are parser tests, not frog simulations')
          receipt={'source':ROOT,'checked_utc':datetime.now(timezone.utc).isoformat(),
              'status':'NOT_FETCHED','source_documents':[],
              'literal_manifest_links_not_fetched':[],
              'no_audio_downloaded':True,'no_animal_or_depth_rows_fetched':True,
              'javascript_executed':False,'redirects_followed':False}
          try:
              html,proof=fetch(ROOT); receipt['source_documents'].append(proof)
              urls=script_links(html)
              receipt['explicit_same_site_scripts']=urls
              receipt['scripts_over_limit_not_fetched']=max(0,len(urls)-MAX_SCRIPTS)
              found=[{'referenced_from':ROOT,'url':u} for u in data_links(html)]
              for u in urls[:MAX_SCRIPTS]:
                  body,proof=fetch(u)
                  proof['field_name_token_counts']={k:len(re.findall(r'\b'+k+r'\b',body,re.I)) for k in ('depth','date','time','timezone','filename')}
                  receipt['source_documents'].append(proof)
                  found.extend({'referenced_from':u,'url':v} for v in data_links(body))
              receipt['literal_manifest_links_not_fetched']=found
              receipt['status']='PUBLIC_HTML_AND_EXPLICIT_SCRIPTS_READ_ONLY'
          except HTTPError as e: receipt.update(status='HTTP_STOP',http_status=e.code)
          except (URLError,TimeoutError) as e: receipt.update(status='NETWORK_STOP',error_type=type(e).__name__)
          except (ValueError,UnicodeError) as e: receipt.update(status='CONTENT_STOP',error_type=type(e).__name__)
          Path('napnap_public_asset_links.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: napnap-public-asset-links-no-observations
          path: napnap_public_asset_links.json
          if-no-files-found: error
