name: sync ecological JAE v0.5 figures

on:
  push:
    branches:
      - revision/rainfall-community-filter-v1
    paths:
      - ".github/workflows/sync_ecological_figures.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revision/rainfall-community-filter-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild figures
        run: python scripts/build_ecological_figures.py
      - name: Verify exact hashes
        run: python scripts/verify_ecological_figure_hashes.py
      - name: Commit deterministic figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures_ecology_v0_5/*.svg
          if git diff --cached --quiet; then
            echo "Figures already synchronized"
            exit 0
          fi
          git commit -m "Sync deterministic ecological JAE v0.5 figures"
          git push origin HEAD:revision/rainfall-community-filter-v1
