name: frogcs adjusted species pulse robustness

on:
  push:
    branches:
      - revision/rainfall-community-filter-v1
    paths:
      - "NAAMP_SPECIES_PULSE_ADJUSTED_ROBUSTNESS_CONTRACT_V0_1.json"
      - "scripts/run_naamp_species_pulse_adjusted_robustness.py"
      - ".github/workflows/species_pulse_adjusted_robustness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adjusted-species:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - name: Recompute full species-response receipt
        run: python scripts/run_naamp_species_pulse_heterogeneity.py
      - name: Run adjusted species robustness
        run: python scripts/run_naamp_species_pulse_adjusted_robustness.py
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-adjusted-species-pulse-v0-1
          path: NAAMP_SPECIES_PULSE_ADJUSTED_ROBUSTNESS_RECEIPT_V0_1.json
          if-no-files-found: error
