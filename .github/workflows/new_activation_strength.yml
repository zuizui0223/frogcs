name: new activation strength diagnostic
on:
  push:
    branches:
      - exploration/calling-strength-v1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - run: python -m compileall -q exploration scripts
      - run: python exploration/run_naamp_new_activation_strength.py
      - run: python exploration/run_naamp_strong_new_activation_route_split.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-new-activation-strength-v0-1
          path: |
            exploration/NAAMP_NEW_ACTIVATION_STRENGTH_CONTRACT_V0_1.json
            exploration/NAAMP_NEW_ACTIVATION_STRENGTH_RECEIPT_V0_1.json
            exploration/NAAMP_STRONG_NEW_ACTIVATION_ROUTE_SPLIT_CONTRACT_V0_1.json
            exploration/NAAMP_STRONG_NEW_ACTIVATION_ROUTE_SPLIT_RECEIPT_V0_1.json
          if-no-files-found: error
