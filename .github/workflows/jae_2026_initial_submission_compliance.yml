name: JAE 2026 initial-submission compliance audit

on:
  push:
    branches:
      - main
      - release/jae-v1-rc8
      - submission/jae-v1
    paths:
      - "MANUSCRIPT_JAE_V1_0.md"
      - "SUPPORTING_INFORMATION_JAE_RC8_V0_1.md"
      - "submission/COVER_LETTER_JAE_V0_10.md"
      - "JAE_TITLE_PAGE_V0_6.template.md"
      - "submission/JAE_INITIAL_SUBMISSION_AUDIT_2026_09_28.md"
      - "scripts/audit_jae_initial_submission_2026.py"
      - ".github/workflows/jae_2026_initial_submission_compliance.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/audit_jae_initial_submission_2026.py
