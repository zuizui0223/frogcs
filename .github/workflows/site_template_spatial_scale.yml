name: site template spatial scale
on:
  push:
    branches: [exploration/site-template-spatial-scale-v1]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - run: python -m compileall -q exploration scripts
      - run: python exploration/run_naamp_site_template_spatial_scale.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-site-template-spatial-scale-v0-1
          path: |
            exploration/NAAMP_SITE_TEMPLATE_SPATIAL_SCALE_CONTRACT_V0_1.json
            exploration/NAAMP_SITE_TEMPLATE_SPATIAL_SCALE_RECEIPT_V0_1.json
          if-no-files-found: error
