name: Annual NLCD C1V0 full Iowa 360417 source-only raster extraction
on:
  push:
    branches:
      - study/climate-landscape-acoustic-sites-v0
    paths:
      - '.github/workflows/climate_nlcd_arcgis_full_aoi_c1v0_v17.yml'
      - 'studies/climate_landscape/scripts/arcgis_c1v0_full_aoi.py'
      - 'studies/climate_landscape/tests/test_arcgis_c1v0_full_aoi.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  environmental-pixel-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r studies/climate_landscape/requirements.txt
      - name: Synthetic fail-closed categorical raster checks
        run: python -m pytest -q studies/climate_landscape/tests/test_arcgis_c1v0_full_aoi.py
      - name: Extract 2004 2009 2014 actual full-AOI source rasters with fixed dataset version
        run: |
          python studies/climate_landscape/scripts/arcgis_c1v0_full_aoi.py \
            --stations studies/climate_landscape/reference_routes/iowa_dnr_360417_source_only_stops_v16.csv \
            --out "$RUNNER_TEMP/annual_NLCD_iowa360417_C1V0"
      - name: Preserve exact source-only rasters and conditional-site summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iowa360417-annual-nlcd-original-c1v0-raw-full-aoi-v17
          path: ${{ runner.temp }}/annual_NLCD_iowa360417_C1V0/
          if-no-files-found: error
          retention-days: 30
