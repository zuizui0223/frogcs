name: prior site memory within species
on:
  push:
    branches: [exploration/site-memory-within-species-v1]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - run: python exploration/run_naamp_prior_site_memory_within_species.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-prior-site-memory-within-species-v0-1
          path: |
            exploration/NAAMP_PRIOR_SITE_MEMORY_WITHIN_SPECIES_CONTRACT_V0_1.json
            exploration/NAAMP_PRIOR_SITE_MEMORY_WITHIN_SPECIES_RECEIPT_V0_1.json
          if-no-files-found: error
