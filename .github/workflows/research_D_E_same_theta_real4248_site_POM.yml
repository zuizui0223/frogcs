name: Frogcs real 4248-site six-pattern POM for SAME true 80y biological network and theta

on:
  push:
    branches:
      - research/common-engine-D-E-nuisance-pom-20261101
    paths:
      - .github/workflows/research_D_E_same_theta_real4248_site_POM.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original-site-six-pattern-quantitative-adequacy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        background: ["uniform","target_group"]
    env:
      GH_TOKEN: ${{ github.token }}
      OLD_ENGINE_AUDIT: '41214798025'
      OLD_ENGINE_ARTIFACT: frogcs-D-E-same-source-true80y-q-mobility-prior-audited
      PYTHONPATH: source/research/scripts:paper/research/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          path: paper
      - uses: actions/checkout@v4
        with:
          ref: 19d45ffb833e2970aff8d88de101736aee289d26
          path: source
          sparse-checkout: |
            research/scripts
            research/results/literature_extension_20261029
            research/results/naamp_remote_vegetation_20261026
            research/results/naamp_three_guild_occurrence/full_naamp_history
            research/results/scale_comparison_20261029
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original real-site POM covariance and source dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2'
      - name: Verify true source 4248 sites, 63180 completed surveys and fixed trilinear field emission
        run: python -m unittest discover -s paper/research/scripts -p test_D_E_same_theta_site_proxy_POM.py -v
      - name: Download independently audited TRUE original80y same-theta process and demographic outcomes
        run: |
          mkdir -p paper/research/results/D_E_common_engine_20261101/full_80y_audited_source
          gh run download "$OLD_ENGINE_AUDIT" --repo "${{ github.repository }}" --name "$OLD_ENGINE_ARTIFACT" --dir paper/research/results/D_E_common_engine_20261101/full_80y_audited_source
      - name: Calculate actual-site all-SIX observed quantitative POM under frozen source emission and four seed blocks
        run: |
          python paper/research/scripts/D_E_same_theta_4248_site_proxy_POM.py --input paper/research/results/D_E_common_engine_20261101/full_80y_audited_source --output paper/research/results/D_E_common_engine_20261101/real_site_quantitative_POM --background ${{ matrix.background }}
      - name: Preserve all field-mapped model failures, source adequacy and same-run year80 outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-DE-same-theta-real4248-site-six-pattern-${{ matrix.background }}
          path: paper/research/results/D_E_common_engine_20261101/real_site_quantitative_POM/
          if-no-files-found: warn
          retention-days: 30
