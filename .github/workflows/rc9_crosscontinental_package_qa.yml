name: RC9 cross-continental submission candidate QA

on:
  push:
    branches:
      - revision/rc8-crosscontinental-depth-v1
    paths:
      - "MANUSCRIPT_JAE_V1_1.md"
      - "SUPPORTING_INFORMATION_JAE_RC9_V0_1.md"
      - "submission/COVER_LETTER_JAE_V0_12.md"
      - "submission/NOVELTY_AUDIT_V0_9.md"
      - "submission/REVIEWER_ATTACK_MATRIX_V0_9.md"
      - "CROSSCONTINENTAL_ACTIVE_DEPTH_SUMMARY_V0_1.json"
      - "CROSSCONTINENTAL_ACTIVE_DEPTH_CONTRACT_V0_1.json"
      - "submission/RC8_CROSSCONTINENTAL_DEPTH_DECISION_TREE_V0_1.json"
      - "submission/RC8_CROSSCONTINENTAL_DEPTH_UNFREEZE_V0_1.json"
      - "scripts/audit_rc9_crosscontinental_package.py"
      - ".github/workflows/rc9_crosscontinental_package_qa.yml"
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/audit_rc9_crosscontinental_package.py
