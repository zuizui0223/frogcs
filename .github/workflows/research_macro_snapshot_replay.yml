name: Research macro snapshot replay
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/**'
      - '.github/workflows/research_macro_snapshot_replay.yml'
  push:
    branches: [main]
    paths:
      - 'research/**'
      - '.github/workflows/research_macro_snapshot_replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-result-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: research/reproducibility/requirements-macro-replay.txt
      - run: python -m pip install -r research/reproducibility/requirements-macro-replay.txt
      - run: python research/scripts/verify_macro_snapshot.py
      - run: python -m unittest discover -s research/scripts -p 'test_*.py'
      - run: python research/scripts/verify_macro_snapshot.py --replay
      - run: git diff --exit-code
