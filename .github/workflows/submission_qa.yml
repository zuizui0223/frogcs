name: frogcs JAE submission QA

on:
  push:
    branches:
      - submission/jae-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frogcs-jae-submission-qa
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install submission QA dependencies
        run: python -m pip install --disable-pip-version-check -q PyYAML==6.0.2 python-docx==1.2.0

      - name: Audit canonical RC6 scientific package
        run: python scripts/audit_rc6_submission_package.py

      - name: Verify frozen metacommunity figures
        run: python scripts/verify_metacommunity_figure_hashes_v0_3.py

      - name: Strict-test canonical submission metadata pipeline
        run: |
          cat > /tmp/frogcs-submission-metadata.yml <<'YAML'
          manuscript:
            title: "Recent rainfall expands frog active communities across sites and species without detectable change in beta diversity"
            target_journal: "Journal of Animal Ecology"
            article_type: "Research Article"
          authors:
            - order: 1
              given_names: "Example"
              family_names: "Author"
              display_name: "Example Author"
              affiliation_ids: ["A1"]
              orcid: "0000-0002-1825-0097"
              credit_roles: ["Conceptualization", "Formal analysis", "Writing – original draft"]
          affiliations:
            A1:
              institution: "Example University"
              department: "Department of Ecology"
              city: "Example City"
              country: "Example Country"
          corresponding_author:
            author_order: 1
            email: "example@example.org"
            postal_address: "1 Example Street, Example City"
          funding:
            - funder: "None"
              grant_number: ""
          acknowledgements: "None"
          conflict_of_interest: "The author declares no conflict of interest."
          statement_on_inclusion: "This secondary-data analysis involved no new local field sampling; source programmes and regional literature are acknowledged and cited."
          ethics_and_permits:
            secondary_public_data_only: true
            statement: "Secondary analysis of publicly released acoustic-monitoring and trait data; no new animal handling."
          approvals:
            all_authors_approve_submission: true
            all_entitled_authors_included: true
            not_under_consideration_elsewhere: true
          repository:
            url: "https://github.com/zuizui0223/frogcs"
            license: "MIT"
            archive_year: 2026
            archive_doi: "10.9999/frogcs.test"
          source_data:
            - name: "North American Amphibian Monitoring Program (NAAMP)"
              doi: "10.5066/F7G44NG0"
            - name: "AmphiBIO v1"
              doi: "10.6084/m9.figshare.4644424.v5"
          YAML
          python scripts/render_submission_metadata.py --metadata /tmp/frogcs-submission-metadata.yml --strict --stage initial --outdir /tmp/rendered-initial
          python scripts/render_submission_metadata.py --metadata /tmp/frogcs-submission-metadata.yml --strict --stage archive --outdir /tmp/rendered-archive
          python - <<'PY'
          from pathlib import Path
          expected="Recent rainfall expands frog active communities across sites and species without detectable change in beta diversity"
          for p in [
              Path("/tmp/rendered-initial/JAE_TITLE_PAGE_FINAL.md"),
              Path("/tmp/rendered-archive/JAE_TITLE_PAGE_FINAL.md")
          ]:
              assert p.is_file() and expected in p.read_text(encoding="utf-8")
          for p in [
              "/tmp/rendered-archive/ZENODO_METADATA_FINAL.json",
              "/tmp/rendered-archive/CITATION.cff",
              "/tmp/rendered-archive/ARCHIVE_REFERENCE.txt",
              "/tmp/rendered-initial/JAE_PORTAL_FIELDS.json",
              "/tmp/rendered-initial/SUBMISSION_METADATA_VALIDATION.json"
          ]:
              assert Path(p).is_file() and Path(p).stat().st_size>0
          print("metadata pipeline PASS")
          PY

      - name: Dry-run archive DOI finalization
        run: |
          python scripts/finalize_archive_doi.py             --doi 10.9999/frogcs.test             --input MANUSCRIPT_JAE_V0_8.md             --output build/MANUSCRIPT_JAE_FINAL_TEST.md
          python scripts/audit_jae_v0_8_metacommunity.py             --manuscript build/MANUSCRIPT_JAE_FINAL_TEST.md

      - name: Build and inspect anonymous RC6 DOCX
        run: |
          python scripts/build_jae_anonymous_docx.py             --source MANUSCRIPT_JAE_V0_8.md             --output build/FROG_JAE_ANON_MAIN_V0_8_SUBMISSION_QA.docx
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          p=Path("build/FROG_JAE_ANON_MAIN_V0_8_SUBMISSION_QA.docx")
          assert p.is_file() and p.stat().st_size>10000
          with ZipFile(p) as z:
              core=z.read("docProps/core.xml").decode("utf-8")
              document=z.read("word/document.xml").decode("utf-8")
          expected="Recent rainfall expands frog active communities across sites and species without detectable change in beta diversity"
          assert expected in core
          assert "<w:lnNumType" in document
          print("anonymous DOCX PASS")
          PY

      - name: Upload RC6 review package
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-jae-rc6-review-package
          path: |
            MANUSCRIPT_JAE_V0_8.md
            JAE_TITLE_PAGE_V0_5.template.md
            figures_ecology_v0_8/*.svg
            ECOLOGICAL_FIGURE_HASHES_V0_3.json
            ECOLOGICAL_CLAIM_BOUNDARY_V0_3.json
            COMMUNITY_ECOLOGY_ARGUMENT_SPINE_V0_1.md
            SPECIES_RESPONSE_TRAIT_FRAMEWORK_V0_1.md
            submission/COVER_LETTER_JAE_V0_6.md
            submission/JAE_PORTAL_CHECKLIST_V0_5.md
            submission/SUBMISSION_HANDOFF_RC6.md
            submission/SUBMISSION_METADATA_TEMPLATE_V0_3.yml
            submission/CITATION_V0_2.cff.template
          if-no-files-found: error
