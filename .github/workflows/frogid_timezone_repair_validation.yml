name: frogcs FrogID timezone-aware validation repair

on:
  push:
    branches:
      - revision/activation-decomposition-v1
    paths:
      - "FROGID_TIMEZONE_REPAIR_CONTRACT_V0_1.json"
      - "scripts/run_frogid_rain_validation_timezone_repair.py"
      - ".github/workflows/frogid_timezone_repair_validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frogcs-frogid-timezone-repair
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -q icechunk xarray zarr numpy pandas scipy statsmodels patsy timezonefinder 'numcodecs[pcodec]'
      - name: Run timezone-aware FrogID validation repair
        run: python scripts/run_frogid_rain_validation_timezone_repair.py
      - uses: actions/upload-artifact@v4
        with:
          name: frogid-timezone-repair-v0-3
          path: frog_frogid_rain_validation_timezone_repair_v0_3.json
          if-no-files-found: error
