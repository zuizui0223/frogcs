name: NAAMP data-volume audit

on:
  push:
    branches: [main]
    paths:
      - "audit/NAAMP_DATA_VOLUME_AUDIT_CONTRACT_V0_1.json"
      - "audit/run_naamp_data_volume_audit.py"
      - ".github/workflows/naamp_data_volume_audit.yml"
  workflow_dispatch:

concurrency:
  group: naamp-data-volume-audit
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run frozen data-volume audit
        run: python audit/run_naamp_data_volume_audit.py
      - name: Validate receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("audit/NAAMP_DATA_VOLUME_AUDIT_RECEIPT_V0_1.json")
          x=json.loads(p.read_text())
          assert x["analysis"]=="naamp_data_volume_audit_v0_1"
          assert x["eligible_frog_analysis"]["eligible_runs"]==7848
          assert x["matched_pair_use"]["pairs"]==4236
          assert x["matched_pair_use"]["routes"]==585
          assert x["rain_data_volume"]["era5_72h_total_precipitation"]["weather_linked_runs"]==7559
          assert x["rain_data_volume"]["era5_72h_total_precipitation"]["weather_linked_principal_history_pairs"]==2835
          assert x["source"]["files"]["Runs.csv"]["existing_analysis_pin_verified"] is True
          assert x["source"]["files"]["Stops.csv"]["existing_analysis_pin_verified"] is True
          assert x["source"]["files"]["Counts.csv"]["existing_analysis_pin_verified"] is True
          print({
              "raw_rows": x["raw_frog_records"],
              "eligible": x["eligible_frog_analysis"],
              "pairs": x["matched_pair_use"],
              "rain": x["rain_data_volume"]
          })
          PY
      - name: Commit audit receipt
        run: |
          set -eu
          if [ -z "$(git status --porcelain -- audit/NAAMP_DATA_VOLUME_AUDIT_RECEIPT_V0_1.json)" ]; then
            echo "receipt unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/NAAMP_DATA_VOLUME_AUDIT_RECEIPT_V0_1.json
          git commit -m "Record NAAMP data-volume audit receipt"
          git pull --rebase origin main
          git push origin HEAD:main
