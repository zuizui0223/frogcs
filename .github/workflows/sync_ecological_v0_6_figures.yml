name: sync JAE v0.6 ecological figures

on:
  push:
    branches:
      - revision/rain-response-persistence-v1
    paths:
      - ".github/workflows/sync_ecological_v0_6_figures.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revision/rain-response-persistence-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build deterministic v0.6 figures
        run: python scripts/build_ecological_figures_v0_6.py
      - name: Freeze exact hashes
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          paths=sorted(Path("figures_ecology_v0_6").glob("*.svg"))
          assert len(paths)==3, paths
          obj={
            "project":"frog-chorus-synchrony",
            "figure_package":"JAE_v0_6_temporal_prediction",
            "source_workflow_run":int(os.environ["GITHUB_RUN_ID"]),
            "source_head_sha":os.environ["GITHUB_SHA"],
            "figures":{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths},
            "rule":"Regenerate from scripts/build_ecological_figures_v0_6.py and require exact SHA-256 identity before submission."
          }
          Path("ECOLOGICAL_FIGURE_HASHES_V0_2.json").write_text(json.dumps(obj,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(obj,indent=2))
          PY
      - name: Commit figures and frozen hashes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures_ecology_v0_6/*.svg ECOLOGICAL_FIGURE_HASHES_V0_2.json
          if git diff --cached --quiet; then
            echo "v0.6 figures already synchronized"
            exit 0
          fi
          git commit -m "Sync deterministic JAE v0.6 figures"
          git push origin HEAD:revision/rain-response-persistence-v1
