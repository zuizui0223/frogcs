name: frogcs context-dependent rainfall pulse

on:
  push:
    branches:
      - revision/context-dependent-pulse-v1
    paths:
      - "NAAMP_CONTEXT_DEPENDENT_PULSE_CONTRACT_V0_1.json"
      - "scripts/run_naamp_context_dependent_pulse.py"
      - ".github/workflows/context_dependent_pulse.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - name: Run frozen context-dependent pulse analysis
        run: python scripts/run_naamp_context_dependent_pulse.py
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-context-dependent-pulse-v0-1
          path: NAAMP_CONTEXT_DEPENDENT_PULSE_RECEIPT_V0_1.json
          if-no-files-found: error
