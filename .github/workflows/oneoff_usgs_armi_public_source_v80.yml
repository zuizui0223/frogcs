name: One-off USGS 2024/2003-08 ARMI public survey source metadata check
on:
  push:
    branches: [audit/iowa-station-waterstate-source-gate-v31]
    paths: [.github/workflows/oneoff_usgs_armi_public_source_v80.yml, studies/climate_landscape/scripts/audit_usgs_armi2024_public_survey_schema_v80.py, studies/climate_landscape/scripts/audit_armi2024_original_visit_observer_v80.py]
permissions:
  contents: read
jobs:
  audit-public-official-source:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read only official public USGS catalog metadata; no frog survey observations
        run: |
          python3 - <<'PY'
          from urllib.request import Request,build_opener,HTTPRedirectHandler
          from urllib.error import HTTPError,URLError
          from urllib.parse import urlsplit
          from datetime import datetime,timezone
          from pathlib import Path
          import json,re,hashlib
          class NoRedirect(HTTPRedirectHandler):
            def redirect_request(self,*a,**k): return None
          urls={
            'sciencebase_www_2024':'https://www.sciencebase.gov/catalog/item/68016413d4be0263cab109a8?format=json',
            'sciencebase_api_2024':'https://api.sciencebase.gov/catalog/item/68016413d4be0263cab109a8',
            'usgs_original_metadata_2024':'https://data.usgs.gov/datacatalog/metadata/USGS.68016413d4be0263cab109a8.xml',
          }
          res={'status':'OFFICIAL_PUBLIC_SOURCE_PREFLIGHT_ONLY','checked_utc':datetime.now(timezone.utc).isoformat(),
               'source_doi':'https://doi.org/10.5066/P19ZCGWM','official_2024_2026_rev':'1.1 April 2026',
               'no_animal_observations_requested':True,'no_coordinates_logged':True,'no_credential_bypass':True,'checks':{}}
          for key,url in urls.items():
            host=urlsplit(url).hostname
            if host not in {'www.sciencebase.gov','api.sciencebase.gov','data.usgs.gov'}: raise RuntimeError('host')
            record={'status':'UNTRIED'}
            try:
              with build_opener(NoRedirect).open(Request(url,headers={'User-Agent':'frogcs-source-index-public-metadata/8.0','Accept':'application/json,application/xml,text/xml'}),timeout=22) as rsp:
                record.update(http_status=rsp.status,content_type=rsp.headers.get('Content-Type',''),content_bytes_declared=rsp.headers.get('Content-Length'))
                content=rsp.read(1500001)
                if len(content)>1500000: raise ValueError('LARGE_PUBLIC_METADATA_STOP')
              record['metadata_sha256']=hashlib.sha256(content).hexdigest()
              if 'json' in record['content_type'] or content[:1]==b'{':
                obj=json.loads(content)
                record.update(status='PUBLIC_JSON_METADATA_ACCESSED',
                              item_id=obj.get('id'),item_title=(str(obj.get('title',''))[:150]),
                              item_browse_fields=sorted(obj.keys())[:50],
                              original_links=[{'name':str(f.get('name',''))[:160],
                                  'contentType':str(f.get('contentType',''))[:50],
                                  'size':f.get('size'),'download_url':str(f.get('downloadUri',''))[:300]}
                                  for f in (obj.get('files') or [])[:35]],
                              file_entry_count=len(obj.get('files') or []),
                              has_observation_schema=False)
              else:
                source=content.decode('utf-8',errors='replace')
                # Do not store raw XML: may contain source locations and contacts
                record.update(status='PUBLIC_XML_METADATA_ACCESSED',size_bytes=len(content),
                    xml_root=source.lstrip()[:70],
                    contains_distribution_element=bool(re.search(r'<(?:distinfo|distributionInfo|onlink|CI_OnlineResource)',source,re.I)),
                    contains_CSV_reference=bool(re.search(r'\.csv',source,re.I)),
                    contains_download_link=bool(re.search(r'download|\.zip',source,re.I)))
            except HTTPError as e: record.update(status='HTTP_STOP',http_status=e.code)
            except (URLError,TimeoutError) as e: record.update(status='NETWORK_STOP',error_type=type(e).__name__)
            except (ValueError,UnicodeError) as e:record.update(status='METADATA_PARSE_STOP',error_type=type(e).__name__)
            res['checks'][key]=record
          print('SOURCE_PREFLIGHT '+json.dumps(res,sort_keys=True),flush=True)
          Path('usgs_armi_source_metadata_receipt.json').write_text(json.dumps(res,indent=2)+'\n')
          PY
      - uses: actions/checkout@v4
      - name: Read public source survey CSV and output schema-only grain receipt
        run: python3 studies/climate_landscape/scripts/audit_usgs_armi2024_public_survey_schema_v80.py
      - name: Read official FGDC dictionary and original observer site-date-clock survey grain, no source response effect
        run: python3 studies/climate_landscape/scripts/audit_armi2024_original_visit_observer_v80.py
      - uses: actions/upload-artifact@v4
        with:
          name: official-usgs-armi-public-source-metadata-v80
          path: |
            usgs_armi_source_metadata_receipt.json
            studies/climate_landscape/receipts/USGS_ARMI2024_PUBLIC_ORIGINAL_CSV_GRAIN_V80.json
            studies/climate_landscape/receipts/USGS_ARMI2024_PUBLIC_OBSERVER_VISIT_GRAIN_V80.json
          if-no-files-found: error
