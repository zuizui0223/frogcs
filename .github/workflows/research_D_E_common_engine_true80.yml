name: Frogcs D-E genuine 80year source trophic and finite-N nuisance factorial

on:
  push:
    branches:
      - research/common-engine-D-E-nuisance-pom-20261101
    paths:
      - .github/workflows/research_D_E_common_engine_true80.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-locked-80year-trophic-network-and-longrun-demography:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        q: [3,12]
        mode: ["off","recruits","carryover","both"]
        seed_start: [101,103]
    env:
      PYTHONPATH: source/research/scripts:paper/research/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          path: paper
      - uses: actions/checkout@v4
        with:
          ref: 19d45ffb833e2970aff8d88de101736aee289d26
          path: source
          sparse-checkout: |
            research/scripts
            research/results/literature_extension_20261029
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact source biological simulation numerical dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2'
      - name: Run source-locked same F/S/D seasonal and finite-N 80year biological model
        run: |
          python paper/research/scripts/run_D_E_common_engine_nuisance_80y.py --run --scale ${{ matrix.q }} --mode ${{ matrix.mode }} --seed-start ${{ matrix.seed_start }} --years 80 --out paper/research/results/D_E_common_engine_20261101/current_true80
      - name: Preserve all original site-independent model-native signs, real year80 occupancy and reoccupation event records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-DE-80y-q${{ matrix.q }}-mode${{ matrix.mode }}-seed${{ matrix.seed_start }}
          path: paper/research/results/D_E_common_engine_20261101/current_true80/
          if-no-files-found: warn
          retention-days: 30
