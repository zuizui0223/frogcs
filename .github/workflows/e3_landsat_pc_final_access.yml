name: E3 final Landsat C2L2 access gate

on:
  push:
    branches:
      - remotesensing/e3-pc-final-access-v1
    paths:
      - '.github/workflows/e3_landsat_pc_final_access.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final_source_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public raster reader
        run: python -m pip install --disable-pip-version-check rasterio
      - name: Compile source-only preflight
        run: python -m py_compile scripts/remotesensing/preflight_e3_landsat_pc_access.py
      - name: Run final outcome-blind three-era gate
        run: python scripts/remotesensing/preflight_e3_landsat_pc_access.py
      - uses: actions/upload-artifact@v4
        with:
          name: e3-final-source-gate-v04
          path: remotesensing/E3_LANDSAT_C2L2_PC_ACCESS_PREFLIGHT_V0_4.json
          retention-days: 30