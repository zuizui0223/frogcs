name: pulse-template manuscript QA
on:
  push:
    branches: [integration/jae-multisite-rc4-clean, main]
    paths:
      - paper/manuscript.md
      - paper/supporting_information.md
      - revision/audit_current_endpoint_manuscript_v0_7.py
      - .github/workflows/pulse_template_manuscript_qa.yml
  pull_request:
    branches: [main]
concurrency:
  group: pulse-template-manuscript-qa-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python revision/audit_current_endpoint_manuscript_v0_7.py
