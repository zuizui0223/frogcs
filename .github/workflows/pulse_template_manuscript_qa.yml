name: pulse-template manuscript QA
on:
  push:
    branches: [revision/novelty-evidence-spine-v1]
    paths:
      - paper/manuscript_pulse_template_v0_5.md
      - paper/supporting_information_pulse_template_v0_3.md
      - revision/audit_pulse_template_manuscript_v0_5.py
      - .github/workflows/pulse_template_manuscript_qa.yml
  pull_request:
    branches: [main]
concurrency:
  group: pulse-template-manuscript-qa-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python revision/audit_pulse_template_manuscript.py
