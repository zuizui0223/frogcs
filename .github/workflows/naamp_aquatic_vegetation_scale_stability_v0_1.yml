name: NAAMP aquatic vegetation scale and geographic stability v0.1

on:
  push:
    branches: [exploration/naamp-aquatic-vegetation-2026-10-21]
    paths:
      - ".github/workflows/naamp_aquatic_vegetation_scale_stability_v0_1.yml"

permissions:
  contents: read
  actions: read

jobs:
  radius-and-state-block:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels
      - uses: actions/download-artifact@v4
        with:
          run-id: 39450277196
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: naamp-nwi-vegetation-sites-validated
          path: build/vegetation_context
      - uses: actions/download-artifact@v4
        with:
          run-id: 39436588431
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: naamp-checkerboard-exploratory-v0-1
          path: build/checkerboard_reference
      - name: Run frozen 100, 250, 500 m radius sensitivity and post-hoc State-block checks
        run: |
          python -m py_compile exploration/run_naamp_aquatic_vegetation_scale_stability_v0_1.py
          python -u exploration/run_naamp_aquatic_vegetation_scale_stability_v0_1.py \
            --nwi-sites build/vegetation_context/site_nwi_vegetation_context.csv \
            --nwi-audit build/vegetation_context/geometry_nwi_preflight.json \
            --checkerboard build/checkerboard_reference/primary_run_level.csv
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-nwi-aquatic-vegetation-scale-stability-v0-1
          path: build/aquatic_vegetation_ecology/scale_stability_v0_1.json
          if-no-files-found: error
