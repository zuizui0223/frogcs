name: Research - NAAMP prior community concentration diagnostic
on:
  push:
    branches: [research/naamp-prior-community-allocation-20261026]
    paths:
      - research/scripts/naamp_community_concentration.py
      - research/scripts/test_naamp_community_concentration.py
      - research/NAAMP_COMMUNITY_CONCENTRATION_CONTRACT_2026-10-26.md
      - .github/workflows/research_naamp_community_concentration.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  concentration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.3 statsmodels==0.14.6 patsy==1.0.2
      - run: |
          python research/scripts/test_naamp_prior_community_allocation.py
          python research/scripts/test_naamp_community_concentration.py
      - name: Original concentration endpoint on matched fold-heldout models
        run: python -u research/scripts/naamp_community_concentration.py --cache /tmp/naamp-source --out /tmp/concentration/observed_results.json
      - run: git diff --exit-code -- paper submission provenance scripts/naamp exploration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: naamp-community-concentration
          path: /tmp/concentration/
          if-no-files-found: warn
