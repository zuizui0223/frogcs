name: frogcs active-community trait coverage audit

on:
  push:
    branches:
      - revision/functional-response-diversity-audit-v1
    paths:
      - "NAAMP_ACTIVE_COMMUNITY_TRAIT_COVERAGE_AUDIT_CONTRACT_V0_1.json"
      - "scripts/audit_naamp_active_community_trait_coverage.py"
      - ".github/workflows/active_community_trait_coverage_audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - name: Run active-community trait coverage audit
        run: python scripts/audit_naamp_active_community_trait_coverage.py
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-active-community-trait-coverage-v0-1
          path: NAAMP_ACTIVE_COMMUNITY_TRAIT_COVERAGE_AUDIT_RECEIPT_V0_1.json
          if-no-files-found: error
