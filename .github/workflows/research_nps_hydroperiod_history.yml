name: NPS historical strong frog chorus by water permanence class
on:
  push:
    branches:
      - research/stage-structured-interactions-2026-10-25
    paths:
      - research/scripts/nps_hydroperiod_strict_history.py
      - .github/workflows/research_nps_hydroperiod_history.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historic-hydroperiod:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal numerical dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'pandas>=2.1,<3'
      - name: Test synthetic hydrology moderator identifiability and bootstrap shapes
        run: python research/scripts/nps_hydroperiod_strict_history.py --self-test
      - name: Download NPS source checksum and fit historical site association by recorded hydroperiod
        run: |
          python research/scripts/nps_hydroperiod_strict_history.py \
            --bootstrap 2000 \
            --output research/results/nps_hydroperiod_history
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nps-hydroperiod-strong-chorus-history-observed
          path: research/results/nps_hydroperiod_history
          if-no-files-found: error
