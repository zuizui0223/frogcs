name: NAAMP stop-clock source-only format audit
on:
  push:
    branches:
      - exploration/naamp-macro-plant-niche-network-2026-10-23
    paths:
      - '.github/workflows/naamp_source_stop_clock_schema.yml'
      - 'exploration/probe_naamp_stop_clock_schema_v0_1.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-clock-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q --disable-pip-version-check numpy pandas scipy statsmodels
      - run: python -u exploration/probe_naamp_stop_clock_schema_v0_1.py
