name: reproduce current results

on:
  workflow_dispatch:
    inputs:
      analysis:
        description: Current analysis to reproduce
        required: true
        default: all
        type: choice
        options:
          - all
          - source_manifest
          - ecological_pulse
          - metacommunity
          - spatial_taxonomic
          - uniform_null
          - persistence_null
          - same_observer
          - sorensen
          - geographic
          - protocol_window
          - detection_quality
          - within_active_depth
          - crossdataset_depth

permissions:
  contents: read

jobs:
  source-manifest:
    if: ${{ inputs.analysis == 'all' || inputs.analysis == 'source_manifest' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit NAAMP ScienceBase file manifest
        run: |
          mkdir -p provenance/receipts
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          item="https://www.sciencebase.gov/catalog/item/583dc314e4b0d1899f9dea8d?format=json"
          req=urllib.request.Request(item,headers={"User-Agent":"frogcs-source-manifest-audit/0.1","Accept":"application/json"})
          with urllib.request.urlopen(req,timeout=60) as r:
              obj=json.loads(r.read().decode("utf-8"))
          rows=[{
              "name":f.get("name"),
              "contentType":f.get("contentType"),
              "size":f.get("size"),
              "downloadUri":f.get("downloadUri")
          } for f in (obj.get("files") or [])]
          out={"analysis":"naamp_sciencebase_file_manifest_audit_v0_1","n_files":len(rows),"files":rows}
          Path("provenance/receipts/NAAMP_SCIENCEBASE_FILE_MANIFEST_AUDIT_V0_1.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: source-manifest-receipt
          path: provenance/receipts/NAAMP_SCIENCEBASE_FILE_MANIFEST_AUDIT_V0_1.json
          if-no-files-found: error

  naamp-py312:
    if: ${{ inputs.analysis == 'all' || inputs.analysis == 'ecological_pulse' || inputs.analysis == 'metacommunity' || inputs.analysis == 'spatial_taxonomic' || inputs.analysis == 'persistence_null' || inputs.analysis == 'same_observer' || inputs.analysis == 'detection_quality' || inputs.analysis == 'within_active_depth' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - run: mkdir -p provenance/receipts
      - if: ${{ inputs.analysis == 'all' || inputs.analysis == 'ecological_pulse' }}
        run: python scripts/naamp/run_naamp_ecological_pulse.py
      - if: ${{ inputs.analysis == 'all' || inputs.analysis == 'metacommunity' }}
        run: python scripts/naamp/run_naamp_metacommunity_alpha_beta_gamma.py
      - if: ${{ inputs.analysis == 'all' || inputs.analysis == 'spatial_taxonomic' }}
        run: python scripts/naamp/run_naamp_spatial_taxonomic_activation_decomposition.py
      - if: ${{ inputs.analysis == 'all' || inputs.analysis == 'persistence_null' }}
        run: python scripts/naamp/run_naamp_persistence_preserving_null.py
      - if: ${{ inputs.analysis == 'all' || inputs.analysis == 'same_observer' }}
        run: python scripts/naamp/run_naamp_same_observer_robustness.py
      - if: ${{ inputs.analysis == 'all' || inputs.analysis == 'detection_quality' }}
        run: python scripts/naamp/run_naamp_detection_quality_robustness.py
      - if: ${{ inputs.analysis == 'all' || inputs.analysis == 'within_active_depth' }}
        run: python scripts/naamp/run_naamp_within_active_depth_decomposition.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-py312-receipts
          path: provenance/receipts/*.json
          if-no-files-found: warn

  naamp-py311:
    if: ${{ inputs.analysis == 'all' || inputs.analysis == 'uniform_null' || inputs.analysis == 'sorensen' || inputs.analysis == 'geographic' || inputs.analysis == 'protocol_window' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -q numpy pandas statsmodels
      - run: mkdir -p provenance/receipts
      - if: ${{ inputs.analysis == 'all' || inputs.analysis == 'uniform_null' }}
        run: python scripts/naamp/run_naamp_uniform_activation_null.py
      - if: ${{ inputs.analysis == 'all' || inputs.analysis == 'sorensen' }}
        run: python scripts/naamp/run_naamp_sorensen_equivalence.py
      - if: ${{ inputs.analysis == 'all' || inputs.analysis == 'geographic' }}
        run: python scripts/naamp/run_naamp_geographic_generality_audit.py
      - if: ${{ inputs.analysis == 'all' || inputs.analysis == 'protocol_window' }}
        run: python scripts/naamp/run_naamp_protocol_window_sensitivity.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-py311-receipts
          path: provenance/receipts/*.json
          if-no-files-found: warn

  crossdataset:
    if: ${{ inputs.analysis == 'all' || inputs.analysis == 'crossdataset_depth' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q icechunk xarray zarr numpy pandas scipy statsmodels patsy timezonefinder 'numcodecs[pcodec]'
      - run: mkdir -p provenance/receipts
      - run: python scripts/frogid/run_crosscontinental_active_depth.py
      - name: Guard frozen cross-dataset boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("provenance/receipts/CROSSCONTINENTAL_ACTIVE_DEPTH_RECEIPT_V0_1.json").read_text())
          assert x["frozen_sample"]["recordings"]==40754
          assert x["north_america_frozen"]["support_positive_ci"] is True
          assert x["cross_system_decision"]["worldwide_universality_authorized"] is False
          assert x["cross_system_decision"]["pooled_effect_size_authorized"] is False
          print(x["cross_system_decision"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: crossdataset-depth-receipt
          path: provenance/receipts/CROSSCONTINENTAL_ACTIVE_DEPTH_RECEIPT_V0_1.json
          if-no-files-found: error
