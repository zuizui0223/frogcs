# Canonical RC11/v1.3 initial-submission bundle.
name: frogcs initial JAE submission bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -q python-docx==1.2.0 PyYAML==6.0.2

      - name: Audit RC11 scientific package
        run: |
          python scripts/qa/audit_rc11_submission_package.py
          python scripts/qa/audit_jae_initial_submission_rc11_2026.py

      - name: Materialize private submission metadata
        env:
          JAE_SUBMISSION_METADATA_YAML: ${{ secrets.JAE_SUBMISSION_METADATA_YAML }}
        run: |
          test -n "$JAE_SUBMISSION_METADATA_YAML" || {
            echo "Missing repository secret JAE_SUBMISSION_METADATA_YAML" >&2
            exit 2
          }
          printf '%s' "$JAE_SUBMISSION_METADATA_YAML" > /tmp/metadata-initial.yml

      - name: Validate and render initial metadata
        run: |
          python scripts/submission/render_submission_metadata.py             --metadata /tmp/metadata-initial.yml             --strict --stage initial             --outdir build/submission-metadata

      - name: Guard RC11 title
        run: |
          python - <<'PY'
          from pathlib import Path
          expected="Rainfall-associated expansion of frog active communities is more boundary-biased than uniform activation predicts"
          x=Path("build/submission-metadata/JAE_TITLE_PAGE_FINAL.md").read_text(encoding="utf-8")
          if expected not in x:
              raise SystemExit("JAE_SUBMISSION_METADATA_YAML contains a superseded title")
          print("RC11 metadata title PASS")
          PY

      - name: Build anonymous RC11 DOCX files
        run: |
          python scripts/submission/build_jae_anonymous_docx.py             --source MANUSCRIPT_JAE_V1_3.md             --output build/FROG_JAE_ANON_MAIN.docx
          python scripts/submission/build_jae_anonymous_docx.py             --source SUPPORTING_INFORMATION_JAE_RC11_V0_1.md             --output build/FROG_JAE_SUPPORTING_INFORMATION.docx

      - name: Verify RC11 DOCX
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import re
          p=Path("build/FROG_JAE_ANON_MAIN.docx")
          s=Path("build/FROG_JAE_SUPPORTING_INFORMATION.docx")
          with ZipFile(p) as z:
              document=z.read("word/document.xml").decode("utf-8")
              footer=z.read("word/footer1.xml").decode("utf-8")
              core=z.read("docProps/core.xml").decode("utf-8")
          with ZipFile(s) as z:
              sidoc=z.read("word/document.xml").decode("utf-8")
              sicore=z.read("docProps/core.xml").decode("utf-8")
          expected="Rainfall-associated expansion of frog active communities is more boundary-biased than uniform activation predicts"
          assert "<w:lnNumType" in document
          assert "PAGE" in footer
          assert expected in core
          assert "3,152 same-observer pairs" in document
          assert "a null allowing species-specific shifts" in document
          assert "Same-observer sensitivity".lower() in sidoc.lower()
          assert not re.search(r"\\bRC\\d+\\b",document+sidoc)
          assert "readback" not in (document+sidoc).lower()
          assert not re.search(r"<dc:creator>[^<]+</dc:creator>",core)
          assert not re.search(r"<dc:creator>[^<]+</dc:creator>",sicore)
          print("RC11 DOCX structure PASS")
          PY

      - name: Assemble initial submission bundle
        run: |
          set -eu
          out=build/initial-submission
          sub="$out/submission_files"
          audit="$out/audit"
          mkdir -p "$sub" "$audit"

          cp MANUSCRIPT_JAE_V1_3.md "$sub/Manuscript.md"
          cp build/FROG_JAE_ANON_MAIN.docx "$sub/Manuscript.docx"
          cp SUPPORTING_INFORMATION_JAE_RC11_V0_1.md "$sub/Supporting_Information.md"
          cp build/FROG_JAE_SUPPORTING_INFORMATION.docx "$sub/Supporting_Information.docx"
          cp build/submission-metadata/JAE_TITLE_PAGE_FINAL.md "$sub/Title_Page.md"
          cp figures_ecology_v1_0/FIGURE_1_METACOMMUNITY_EXPANSION_V0_1.svg "$sub/Figure1.svg"
          cp figures_ecology_v1_2/FIGURE_2_ALLOCATION_NULLS_V0_1.svg "$sub/Figure2.svg"
          cp figures_ecology_v1_2/FIGURE_3_CROSS_DATASET_DEPTH_V0_1.svg "$sub/Figure3.svg"
          cp submission/COVER_LETTER_JAE_V0_13.md "$sub/Cover_Letter.md"

          cp build/submission-metadata/JAE_PORTAL_FIELDS.json "$audit/"
          cp build/submission-metadata/SUBMISSION_METADATA_VALIDATION.json "$audit/"
          cp submission/NOVELTY_AUDIT_V0_11.md "$audit/"
          cp submission/REVIEWER_ATTACK_MATRIX_V0_11.md "$audit/"
          cp submission/JAE_PORTAL_CHECKLIST_V0_10.md "$audit/"
          cp submission/SUBMISSION_HANDOFF_RC11.md "$audit/"
          cp provenance/submission/RC11_STORY_FREEZE_V0_1.json "$audit/"
          cp submission/JAE_INITIAL_SUBMISSION_AUDIT_RC11_2026_09_28.md "$audit/"
          cp provenance/summaries/NAAMP_SAME_OBSERVER_ROBUSTNESS_SUMMARY_V0_1.json "$audit/"
          cp provenance/summaries/NAAMP_UNIFORM_ACTIVATION_NULL_SUMMARY_V0_1.json "$audit/"
          cp provenance/summaries/NAAMP_SORENSEN_EQUIVALENCE_SUMMARY_V0_1.json "$audit/"
          cp provenance/summaries/CROSSCONTINENTAL_ACTIVE_DEPTH_SUMMARY_V0_1.json "$audit/"
          cp provenance/summaries/NAAMP_PERSISTENCE_PRESERVING_NULL_SUMMARY_V0_1.json "$audit/"

          cat > "$out/README.txt" <<'TXT'
          Journal-facing upload files are under submission_files/ and use generic filenames.
          Internal provenance/portal validation is isolated under audit/ and should not be uploaded as manuscript content.
          Archive DOI is intentionally deferred during double-anonymized review.
          TXT

          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          out=Path("build/initial-submission")
          sub=out/"submission_files"
          for p in sub.iterdir():
              assert not re.search(r"(RC\d+|V\d+[_\.-]?\d*)",p.name,re.I),p.name
          rows={}
          for p in sorted(out.rglob("*")):
              if p.is_file():
                  rows[str(p.relative_to(out))]=hashlib.sha256(p.read_bytes()).hexdigest()
          (out/"SHA256SUMS.json").write_text(json.dumps(rows,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          required={
              "submission_files/Manuscript.docx",
              "submission_files/Supporting_Information.docx",
              "submission_files/Title_Page.md",
              "submission_files/Figure1.svg",
              "submission_files/Figure2.svg",
              "submission_files/Figure3.svg",
              "submission_files/Cover_Letter.md",
          }
          missing=required-set(rows)
          assert not missing,missing
          print({"bundle_files_before_manifest":len(rows),"status":"PASS"})
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: frogcs-jae-initial-submission-bundle
          path: build/initial-submission/
          if-no-files-found: error
