name: NAAMP route-topology compactness follow-up

on:
  push:
    branches: [landscape/naamp-behaviour-v1]
    paths:
      - landscape/NAAMP_ROUTE_TOPOLOGY_COMPACTNESS_FOLLOWUP_CONTRACT_V0_1.json
      - landscape/run_naamp_route_topology_compactness_followup_v0_1.py
      - .github/workflows/naamp_route_topology_compactness_followup.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naamp-route-topology-compactness-followup
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q icechunk xarray zarr numpy pandas scipy statsmodels patsy timezonefinder 'numcodecs[pcodec]'
      - name: Run compactness follow-up
        run: python landscape/run_naamp_route_topology_compactness_followup_v0_1.py
      - name: Validate receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("landscape/NAAMP_ROUTE_TOPOLOGY_COMPACTNESS_FOLLOWUP_RECEIPT_V0_1.json")
          x=json.loads(p.read_text())
          assert x["coverage"]["eligible_clusters_k2plus"]==1693
          assert x["interpretation_boundary"]["original_positive_dispersion_prediction_failed"] is True
          assert x["interpretation_boundary"]["post_readback_followup"] is True
          assert x["interpretation_boundary"]["can_upgrade_rc6"] is False
          print(json.dumps({
              "compactness":x["compactness_lower_tail"],
              "deep_vs_shallow":x["deep_vs_shallow_mean_pairwise_excess"]
          },indent=2))
          PY
      - name: Commit follow-up receipt to landscape branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add landscape/NAAMP_ROUTE_TOPOLOGY_COMPACTNESS_FOLLOWUP_RECEIPT_V0_1.json
          if git diff --cached --quiet; then
            echo "Receipt unchanged"
          else
            git commit -m "Record topology compactness follow-up"
            for attempt in 1 2 3; do
              git fetch origin landscape/naamp-behaviour-v1
              git rebase origin/landscape/naamp-behaviour-v1
              git push origin HEAD:landscape/naamp-behaviour-v1 && exit 0
              sleep 2
            done
            exit 1
          fi
