name: frogcs repository structure QA
on:
  push:
    branches:
      - cleanup/provenance-prune-v1
      - cleanup/deep-structure-v1
      - cleanup/repository-structure-v1
      - main
      - release/jae-v1-rc11
      - submission/jae-v1
    paths:
      - "README.md"
      - "archive/**"
      - "submission/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "MANUSCRIPT_JAE_*.md"
      - "SUPPORTING_INFORMATION_JAE_*.md"
      - "JAE_TITLE_PAGE_*.template.md"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/qa/audit_repository_structure.py
