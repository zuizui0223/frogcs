name: persistence-preserving uniform activation null

on:
  push:
    branches:
      - revision/rc10-persistence-null-title-v1
    paths:
      - "submission/RC10_SCOPE_UNFREEZE_V0_1.json"
      - "provenance/contracts/NAAMP_PERSISTENCE_PRESERVING_NULL_CONTRACT_V0_1.json"
      - "submission/RC10_STORY_DECISION_TREE_V0_1.json"
      - "scripts/naamp/run_naamp_persistence_preserving_null.py"
      - ".github/workflows/persistence_preserving_null.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frogcs-persistence-null
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - name: Run frozen persistence-preserving null
        run: python scripts/naamp/run_naamp_persistence_preserving_null.py
      - name: Guard frozen boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("NAAMP_PERSISTENCE_PRESERVING_NULL_RECEIPT_V0_1.json").read_text())
          assert x["n_pairs"]==4236
          assert x["simulation_replicates"]==1000
          assert x["primary_anchor_weight"]==0.75
          assert set(x["results_by_anchor"])=={"0.50","0.75","0.90"}
          assert x["interpretation_boundary"]["post_readback_retuning_authorized"] is False
          print(json.dumps({
            "decision":x["decision"],
            "title_support":x["title_support"],
            "primary":x["results_by_anchor"]["0.75"]["primary_omnibus"],
            "primary_boundary":x["results_by_anchor"]["0.75"]["boundary_crossing_share"]
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: persistence-preserving-null
          path: NAAMP_PERSISTENCE_PRESERVING_NULL_RECEIPT_V0_1.json
          if-no-files-found: error
