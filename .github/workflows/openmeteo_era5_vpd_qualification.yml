name: Open-Meteo ERA5 VPD qualification
on:
  push:
    branches: [exploration/openmeteo-era5-vpd-qualification-v1]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy icechunk xarray zarr timezonefinder 'numcodecs[pcodec]'
      - run: python -m compileall -q exploration scripts
      - run: python exploration/qualify_openmeteo_era5_vpd.py
      - uses: actions/upload-artifact@v4
        with:
          name: openmeteo-era5-vpd-qualification-v0-1
          path: |
            exploration/OPENMETEO_ERA5_VPD_QUALIFICATION_CONTRACT_V0_1.json
            exploration/OPENMETEO_ERA5_VPD_QUALIFICATION_RECEIPT_V0_1.json
          if-no-files-found: error
