name: Extract NAAMP JRC hydroperiod variability

on:
  push:
    branches:
      - remotesensing/naamp-dynamic-hydrology-v1
    paths:
      - ".github/workflows/extract_naamp_jrc_variability.yml"
      - "scripts/remotesensing/extract_naamp_jrc_v1_hydrology_variability.py"
      - "revision/NAAMP_DYNAMIC_HYDROLOGY_MECHANISM_EXTENSION_V0_3.md"
      - "revision/NAAMP_DYNAMIC_HYDROLOGY_MODEL_SPEC_V0_1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install extraction dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy statsmodels patsy rasterio
      - name: Extract response-blind hydroperiod metrics
        run: python scripts/remotesensing/extract_naamp_jrc_v1_hydrology_variability.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-jrc-hydroperiod-variability
          path: |
            remotesensing/NAAMP_JRC_V1_HYDROLOGY_VARIABILITY_V0_1.csv
            remotesensing/NAAMP_JRC_V1_HYDROLOGY_VARIABILITY_COVERAGE_V0_1.json
          retention-days: 30
