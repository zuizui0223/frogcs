name: species fixed-k conditional null
on:
  push:
    branches: [exploration/species-fixed-k-null-v1]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - run: python -m compileall -q exploration scripts
      - run: python exploration/run_naamp_species_fixed_k_conditional_null.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-species-fixed-k-conditional-null-v0-1
          path: |
            exploration/NAAMP_SPECIES_FIXED_K_CONDITIONAL_NULL_CONTRACT_V0_1.json
            exploration/NAAMP_SPECIES_FIXED_K_CONDITIONAL_NULL_RECEIPT_V0_1.json
          if-no-files-found: error
