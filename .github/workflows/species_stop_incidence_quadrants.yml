name: frogcs species-stop incidence quadrants

on:
  push:
    branches:
      - revision/species-stop-incidence-quadrants-v1
    paths:
      - "NAAMP_SPECIES_STOP_QUADRANTS_CONTRACT_V0_1.json"
      - "scripts/run_naamp_species_stop_incidence_quadrants.py"
      - ".github/workflows/species_stop_incidence_quadrants.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - name: Run frozen quadrant decomposition
        run: python scripts/run_naamp_species_stop_incidence_quadrants.py
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-species-stop-quadrants-v0-1
          path: NAAMP_SPECIES_STOP_QUADRANTS_RECEIPT_V0_1.json
          if-no-files-found: error
