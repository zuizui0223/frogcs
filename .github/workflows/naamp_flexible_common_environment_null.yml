name: NAAMP flexible common-environment null

on:
  push:
    branches: [main]
    paths:
      - exploration/NAAMP_FLEXIBLE_COMMON_ENVIRONMENT_NULL_CONTRACT_V0_1.json
      - exploration/run_naamp_flexible_common_environment_null.py
      - .github/workflows/naamp_flexible_common_environment_null.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naamp-flexible-common-environment-null
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - name: Run fixed post-hoc common-environment null
        run: python exploration/run_naamp_flexible_common_environment_null.py
      - name: Validate receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("exploration/NAAMP_FLEXIBLE_COMMON_ENVIRONMENT_NULL_RECEIPT_V0_1.json")
          x=json.loads(p.read_text())
          assert x["coverage"]["pairs"]==2916, x["coverage"]
          assert x["coverage"]["routes"]==439, x["coverage"]
          assert x["status"]=="posthoc_exploratory_after_explicit_2026_10_03_reopening"
          assert x["decision"] in {
              "measured_flexible_common_environment_sufficient",
              "residual_dependence_beyond_measured_flexible_common_environment"
          }
          print(json.dumps({
              "decision":x["decision"],
              "predicted":x["flexible_common_environment_null"]["predicted_concentration_beta"],
              "observed":x["flexible_common_environment_null"]["observed_concentration_beta"],
              "residual":x["flexible_common_environment_null"]["observed_conditional_residual"],
              "ci95":x["flexible_common_environment_null"]["null_residual_ci95"],
              "p":x["flexible_common_environment_null"]["conditional_upper_tail_p"],
              "fraction_removed":x["comparison_with_existing_principal_comparator"]["fraction_of_existing_residual_removed"]
          },indent=2))
          PY
      - name: Commit receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exploration/NAAMP_FLEXIBLE_COMMON_ENVIRONMENT_NULL_RECEIPT_V0_1.json
          if git diff --cached --quiet; then
            echo "Receipt unchanged"
          else
            git commit -m "Record flexible common-environment null result"
            git push origin HEAD:main
          fi
