name: Research - species occurrence receipt and RC6 freeze QA
on:
  push:
    branches: [integration/stage-legacy-unified-2026-10-25]
    paths:
      - research/results/species_occurrence_first/**
      - research/scripts/validate_species_occurrence_release.py
      - research/STAGE_LEGACY_INTEGRATION_MANIFEST_V1.json
      - .github/workflows/research_species_occurrence_receipt_qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-profile-and-rc6-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify no locked RC6 scientific/submission file changed
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --name-only origin/main...HEAD > /tmp/frogcs_changed.txt
          if grep -E '^(paper/|submission/|provenance/|figures_pulse_template/|scripts/naamp/)' /tmp/frogcs_changed.txt; then
            echo "::error::Locked RC6 paths changed"
            exit 1
          fi
          echo 'RC6_FROZEN_PATHS_UNMODIFIED'
      - name: Compile and validate source-only species-occurrence receipts
        run: |
          python3 -m py_compile research/scripts/validate_species_occurrence_release.py
          python3 research/scripts/validate_species_occurrence_release.py
