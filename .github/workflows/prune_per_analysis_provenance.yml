name: prune per-analysis provenance files

on:
  push:
    branches:
      - cleanup/provenance-registry-v1
    paths:
      - ".github/workflows/prune_per_analysis_provenance.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify registry and remove old files
        run: |
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          p=Path("provenance/current.json")
          x=json.loads(p.read_text(encoding="utf-8"))
          counts={k:len(x[k]) for k in ["contracts","summaries","repairs","story"]}
          assert counts=={"contracts":13,"summaries":6,"repairs":1,"story":4},counts
          for d in ["provenance/contracts","provenance/summaries","provenance/repairs","provenance/submission"]:
              shutil.rmtree(d)
          print({"status":"PASS","registry_counts":counts})
          PY
      - name: Validate registry-backed QA
        run: |
          python -m compileall -q scripts
          python scripts/qa/audit_rc11_submission_package.py
          python scripts/qa/audit_jae_initial_submission_rc11_2026.py
      - name: Commit prune
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A provenance scripts README.md
          git commit -m "consolidate current provenance into one registry"
          git push origin HEAD:cleanup/provenance-registry-v1
