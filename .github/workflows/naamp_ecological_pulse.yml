name: frogcs NAAMP ecological pulse analysis

on:
  push:
    branches:
      - revision/ecological-pulse-nested-recruitment-v1
    paths:
      - "NAAMP_ECOLOGICAL_PULSE_CONTRACT_V0_1.json"
      - "scripts/run_naamp_ecological_pulse.py"
      - ".github/workflows/naamp_ecological_pulse.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecological-pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - name: Run frozen ecological pulse analysis
        run: python scripts/run_naamp_ecological_pulse.py
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-naamp-ecological-pulse-v0-1
          path: NAAMP_ECOLOGICAL_PULSE_RECEIPT_V0_1.json
          if-no-files-found: error
