name: NAAMP hydrology variability request manifest

on:
  push:
    branches:
      - remotesensing/naamp-dynamic-hydrology-v1
    paths:
      - ".github/workflows/naamp_hydrology_variability_manifest.yml"
      - "scripts/remotesensing/build_hydrology_variability_request_manifest.py"
      - "revision/NAAMP_DYNAMIC_HYDROLOGY_MECHANISM_EXTENSION_V0_3.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy statsmodels patsy
      - name: Build response-blind variability request manifest
        run: python scripts/remotesensing/build_hydrology_variability_request_manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-hydrology-variability-request-manifest
          path: remotesensing/NAAMP_HYDROLOGY_VARIABILITY_REQUEST_MANIFEST_V0_1.json
