name: CEWH MDMS–FlowMER exact samplepoint source crosswalk v5.5
on:
  push:
    branches:
      - audit/iowa-station-waterstate-source-gate-v31
    paths:
      - "studies/climate_landscape/scripts/audit_mdms_flowmer_exact_site_labels_v55.py"
      - ".github/workflows/mdms_flowmer_exact_name_crosswalk_v55.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-name-only-source-join:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test exact MDMS NAME and SAMO_ID join with no individual site exposure
        run: python studies/climate_landscape/scripts/audit_mdms_flowmer_exact_site_labels_v55.py
      - name: Archive aggregate official samplepoint overlap only
        uses: actions/upload-artifact@v4
        with:
          name: mdms-flowmer-samplepoint-aggregate-crosswalk-v55
          path: studies/climate_landscape/receipts/MDMS_FROG_EXACT_NAME_CANDIDATE_MATCH_V55.json
          if-no-files-found: error
