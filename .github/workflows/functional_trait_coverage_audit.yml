name: frogcs functional trait coverage audit

on:
  push:
    branches:
      - revision/functional-response-diversity-audit-v1
    paths:
      - "AMPHIBIO_FUNCTIONAL_TRAIT_COVERAGE_AUDIT_CONTRACT_V0_1.json"
      - "scripts/audit_amphibio_functional_trait_coverage.py"
      - ".github/workflows/functional_trait_coverage_audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas
      - name: Run outcome-blind trait coverage audit
        run: python scripts/audit_amphibio_functional_trait_coverage.py
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-functional-trait-coverage-v0-1
          path: AMPHIBIO_FUNCTIONAL_TRAIT_COVERAGE_AUDIT_RECEIPT_V0_1.json
          if-no-files-found: error
