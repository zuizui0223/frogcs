name: strong activation species concentration
on:
  push:
    branches: [exploration/strong-activation-species-concentration-v1]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - run: python exploration/run_naamp_strong_activation_species_concentration.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-strong-activation-species-concentration-v0-1
          path: |
            exploration/NAAMP_STRONG_ACTIVATION_SPECIES_CONCENTRATION_CONTRACT_V0_1.json
            exploration/NAAMP_STRONG_ACTIVATION_SPECIES_CONCENTRATION_RECEIPT_V0_1.json
          if-no-files-found: error
