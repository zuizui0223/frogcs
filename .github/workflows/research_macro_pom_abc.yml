name: Frogcs macro pattern-oriented ABC pilot

on:
  push:
    branches:
      - research/multigeneration-reversal-abm-pde-20261031
    paths:
      - research/scripts/pattern_oriented_abc_pilot.py
      - research/scripts/test_pattern_oriented_abc_pilot.py
      - research/MACRO_POM_ABC_CONDITIONAL_PROTOCOL_2026-10-31.md
      - .github/workflows/research_macro_pom_abc.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pattern-oriented-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned computational dependencies
        run: python -m pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.3
      - name: Test common-empirical estimands and conditional ABC identifiability
        run: python -m unittest discover -s research/scripts -p 'test_pattern_oriented_abc_pilot.py' -v
      - name: Run full 4248-site multi-pattern and fixed-parameter ABC pilot
        run: python -u research/scripts/pattern_oriented_abc_pilot.py --run --reference-per-case 64 --pseudo-per-case 12
      - name: Check source coverage, exact equivalence and finite patterns
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd
          root=Path('research/results/macro_pom_abc_pilot_20261031')
          a=pd.read_csv(root/'scenario_pattern_distance.csv')
          b=pd.read_csv(root/'toy_conditional_abc_mass.csv')
          eq=pd.read_csv(root/'exact_surface_equivalence.csv')
          recovery=pd.read_csv(root/'pseudo_recovery_records.csv')
          boot=pd.read_csv(root/'observed_pattern_bootstrap.csv')
          assert len(a)==48 and a.background.nunique()==2
          assert a.groupby('background').case.nunique().eq(24).all()
          assert int(eq.n_cases.sum())==24 and len(eq)<=24
          assert len(recovery)==24*12*2 and len(boot)>=2*900
          assert b.groupby('background').toy_abc_mass.sum().between(.999999,1.000001).all()
          assert a.distance_mahalanobis.ge(0).all() and np.isfinite(a.distance_mahalanobis).all()
          assert set(['OS','OV','SV','OSV','O_with_S_low','O_with_S_high']).issubset(set(['OS','OV','SV','OSV','O_with_S_low','O_with_S_high']))
          print('POM_AUDIT_OK',len(a),'case-background pairs',len(eq),'exact-source groups',len(recovery),'pseudo-recovery replicates')
          PY
      - name: Print compact numerical evidence for permanent source audit
        run: |
          for f in \
            exact_surface_equivalence.csv \
            scenario_pattern_distance.csv \
            toy_conditional_abc_mass.csv \
            heldout_observed_patterns.csv; do
            echo "===== $f ====="
            cat "research/results/macro_pom_abc_pilot_20261031/$f"
          done
          echo '===== recovery matrix ====='
          python - <<'PY'
          import pandas as pd
          x=pd.read_csv('research/results/macro_pom_abc_pilot_20261031/pseudo_recovery_records.csv')
          print(x.groupby(['background','true_group','predicted_group']).size().to_csv())
          print('SOURCE GROUP RECOVERY:')
          print(x.groupby('background').recovered.agg(['sum','size','mean']).to_csv())
          PY
      - name: Retain all synthetic-reference and observed-pattern evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-macro-pom-conditional-abc-20261031
          path: research/results/macro_pom_abc_pilot_20261031/
          if-no-files-found: warn
          retention-days: 30
