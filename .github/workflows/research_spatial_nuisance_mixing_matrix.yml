name: Frogcs identify near-site mixing under uncertain local environmental persistence

on:
  push:
    branches:
      - research/spatial-dispersal-identifiability-pilot-20261031
    paths:
      - research/scripts/spatial_environment_nuisance_mixing_recovery.py
      - research/scripts/test_spatial_environment_nuisance_mixing_recovery.py
      - .github/workflows/research_spatial_nuisance_mixing_matrix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-matched-naamp-environment-versus-mixing-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: editorial
      - uses: actions/checkout@v4
        with:
          ref: c5ad81b1fb29a9bb92d742ee7004ae66a404dca9
          path: source
          sparse-checkout: |
            research/scripts
            research/results/naamp_remote_vegetation_20261026
            research/results/naamp_three_guild_occurrence/full_naamp_history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numeric source dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2'
      - name: Run all annual-site crosslag and environmental nuisance grid unit tests
        run: |
          python -m unittest discover -s editorial/research/scripts -p test_observed_neighbour_lag_dispersal_identifiability.py -v
          python -m unittest discover -s editorial/research/scripts -p test_recover_dispersal_vs_spatiotemporal_environment.py -v
          python -m unittest discover -s editorial/research/scripts -p test_spatial_environment_nuisance_mixing_recovery.py -v
      - name: Run true NAAMP observation mask with all source frozen environmental nuisance scenarios
        run: python editorial/research/scripts/spatial_environment_nuisance_mixing_recovery.py --source-root source --out editorial/research/results/naamp_spatial_environment_nuisance_grid_20261031 --reps 40
      - name: Preserve complete nuisance x mixing matrix and field-source receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-NAAMP-environment-nuisance-vs-stable-mixing-40seeds
          path: editorial/research/results/naamp_spatial_environment_nuisance_grid_20261031/
          retention-days: 30
          if-no-files-found: warn
