name: NAAMP near vs far dependence contrast

on:
  push:
    branches: [main]
    paths:
      - exploration/NAAMP_NEAR_VS_FAR_DEPENDENCE_CONTRAST_CONTRACT_V0_1.json
      - exploration/run_naamp_near_vs_far_dependence_contrast.py
      - .github/workflows/naamp_near_vs_far_dependence_contrast.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naamp-near-vs-far-dependence-contrast
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q icechunk xarray zarr numpy pandas scipy statsmodels patsy timezonefinder 'numcodecs[pcodec]'
      - name: Run fixed near-far route bootstrap
        run: python exploration/run_naamp_near_vs_far_dependence_contrast.py
      - name: Validate receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("exploration/NAAMP_NEAR_VS_FAR_DEPENDENCE_CONTRAST_RECEIPT_V0_1.json")
          x=json.loads(p.read_text())
          assert x["coverage"]["pairs"]==2835
          assert x["coverage"]["routes"]==428
          assert x["coverage"]["dry_route_silent_clusters"]==8343
          assert x["route_cluster_bootstrap"]["replicates"]==2000
          print(json.dumps({
              "observed":x["observed"],
              "bootstrap":x["route_cluster_bootstrap"],
              "decision":x["decision"]
          },indent=2))
          PY
      - name: Commit receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exploration/NAAMP_NEAR_VS_FAR_DEPENDENCE_CONTRAST_RECEIPT_V0_1.json
          if git diff --cached --quiet; then
            echo "Receipt unchanged"
          else
            git commit -m "Record near-versus-far dependence contrast"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main && exit 0
              sleep 2
            done
            exit 1
          fi
