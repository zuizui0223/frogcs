name: template release within pair
on:
  push:
    branches: [exploration/template-release-within-pair-v1]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - run: python -m compileall -q exploration scripts
      - run: python exploration/run_naamp_template_release_within_pair.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-template-release-within-pair-v0-1
          path: |
            exploration/NAAMP_TEMPLATE_RELEASE_WITHIN_PAIR_CONTRACT_V0_1.json
            exploration/NAAMP_TEMPLATE_RELEASE_WITHIN_PAIR_RECEIPT_V0_1.json
          if-no-files-found: error
