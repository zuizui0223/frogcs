name: NAAMP latent route-night numerical convergence

on:
  push:
    branches: [main]
    paths:
      - exploration/NAAMP_LOGISTIC_NORMAL_NUMERICAL_CONVERGENCE_CONTRACT_V0_1.json
      - exploration/run_naamp_logistic_normal_numerical_convergence.py
      - .github/workflows/naamp_logistic_normal_numerical_convergence.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naamp-logistic-normal-numerical-convergence
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q icechunk xarray zarr numpy pandas scipy statsmodels patsy timezonefinder 'numcodecs[pcodec]'
      - name: Run numerical convergence audit
        run: python exploration/run_naamp_logistic_normal_numerical_convergence.py
      - name: Validate receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("exploration/NAAMP_LOGISTIC_NORMAL_NUMERICAL_CONVERGENCE_RECEIPT_V0_1.json").read_text())
          assert x["coverage"]["pairs"]==2835
          for s in ("all","dry_route_silent"):
              assert set(x["results"][s])=={"10","20","40","60"}
          print(json.dumps({"checks":x["checks"],"overall_pass":x["overall_pass"]},indent=2))
          PY
      - name: Commit receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exploration/NAAMP_LOGISTIC_NORMAL_NUMERICAL_CONVERGENCE_RECEIPT_V0_1.json
          if git diff --cached --quiet; then
            echo "Receipt unchanged"
          else
            git commit -m "Record latent route-night numerical convergence"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main && exit 0
              sleep 2
            done
            exit 1
          fi
