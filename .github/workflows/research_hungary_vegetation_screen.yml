name: Hungary wetland vegetation real-data screen

on:
  push:
    branches:
      - research/stage-structured-interactions-2026-10-25
    paths:
      - 'research/external/zenodo_15044115/**'
      - research/scripts/hungary_vegetation_chorus.py
      - .github/workflows/research_hungary_vegetation_screen.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observed-data-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scikit-learn>=1.4,<2'
      - name: Verify open-data integrity and run true site held-out models
        run: |
          python research/scripts/hungary_vegetation_chorus.py \
            --source research/external/zenodo_15044115 \
            --output research/results/hungary_2024_screen \
            --bootstrap 2000
      - name: Archive derived audit only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hungary-vegetation-observed-results
          path: research/results/hungary_2024_screen/observed_results.json
          if-no-files-found: error
