name: Korea external fast audit
on:
  push:
    branches:
      - exploration/korea-external-fast-v1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pandas requests openpyxl
      - run: python exploration/audit_korea_external_eligibility.py
      - uses: actions/upload-artifact@v4
        with:
          name: korea-external-fast
          path: exploration/KOREA_EXTERNAL_ELIGIBILITY_RECEIPT_V0_1.json
