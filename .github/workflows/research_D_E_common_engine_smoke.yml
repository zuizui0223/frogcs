name: Frogcs D-E same-engine trophic and nuisance source smoke

on:
  push:
    branches:
      - research/common-engine-D-E-nuisance-pom-20261101
    paths:
      - research/scripts/run_D_E_common_engine_nuisance_80y.py
      - research/scripts/test_D_E_common_engine_nuisance_80y.py
      - .github/workflows/research_D_E_common_engine_smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-source-identity-and-4year-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: source/research/scripts:paper/research/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          path: paper
      - uses: actions/checkout@v4
        with:
          ref: 19d45ffb833e2970aff8d88de101736aee289d26
          path: source
          sparse-checkout: |
            research/scripts
            research/results/literature_extension_20261029
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original scientific-source dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2'
      - name: Prove original biological source identity and same network finite-N accounting
        run: python -m unittest discover -s paper/research/scripts -p test_D_E_common_engine_nuisance_80y.py -v
      - name: Run a genuine FOUR YEAR method smoke, not a biological outcome
        run: |
          python paper/research/scripts/run_D_E_common_engine_nuisance_80y.py --run --scale 3 --mode off --seed-start 101 --years 4 --out paper/research/results/D_E_common_engine_20261101/smoke
      - name: Save source receipt to verify short source setup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-D-E-common-engine-4year-methods-only
          path: paper/research/results/D_E_common_engine_20261101/smoke/
          if-no-files-found: warn
          retention-days: 30
