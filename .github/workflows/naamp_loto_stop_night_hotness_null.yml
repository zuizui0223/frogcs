name: NAAMP leave-one-taxon-out stop-night hotness

on:
  push:
    branches: [main]
    paths:
      - exploration/NAAMP_LOTO_STOP_NIGHT_HOTNESS_NULL_CONTRACT_V0_1.json
      - exploration/run_naamp_loto_stop_night_hotness_null.py
      - .github/workflows/naamp_loto_stop_night_hotness_null.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naamp-loto-stop-night-hotness-null
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q icechunk xarray zarr numpy pandas scipy statsmodels patsy timezonefinder 'numcodecs[pcodec]'
      - name: Run fixed stop-night hotness falsification
        run: python exploration/run_naamp_loto_stop_night_hotness_null.py
      - name: Validate receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("exploration/NAAMP_LOTO_STOP_NIGHT_HOTNESS_NULL_RECEIPT_V0_1.json")
          x=json.loads(p.read_text())
          assert x["coverage"]["pairs"]==2835
          assert x["coverage"]["routes"]==428
          assert x["coverage"]["dry_route_silent_clusters"]==8343
          assert x["decision"] in {
              "stop_night_hotness_sufficient",
              "residual_species_route_night_structure",
              "mixed"
          }
          assert x["interpretation_boundary"]["target_taxon_wet_outcome_used_to_estimate_own_stop_hotness"] is False
          print(json.dumps({
              "audit":x["hotness_audit"],
              "concentration":x["concentration"],
              "bounded":x["dry_route_silent_bounded_dependence"],
              "far":x["dry_route_silent_far_lag_7_9"],
              "decision":x["decision"]
          },indent=2))
          PY
      - name: Commit receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exploration/NAAMP_LOTO_STOP_NIGHT_HOTNESS_NULL_RECEIPT_V0_1.json
          if git diff --cached --quiet; then
            echo "Receipt unchanged"
          else
            git commit -m "Record leave-one-taxon-out stop-night hotness falsification"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main && exit 0
              sleep 2
            done
            exit 1
          fi
