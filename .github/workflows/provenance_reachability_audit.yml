name: provenance reachability audit
on:
  push:
    branches:
      - cleanup/provenance-prune-v1
    paths:
      - "scripts/qa/analyze_provenance_reachability.py"
      - ".github/workflows/provenance_reachability_audit.yml"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/qa/analyze_provenance_reachability.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add provenance/PROVENANCE_REACHABILITY_AUDIT.json
          git commit -m "audit current provenance reachability"
          git push origin HEAD:cleanup/provenance-prune-v1
