# retry after structure-QA temp-workflow exclusion
name: prune noncurrent provenance

on:
  push:
    branches:
      - cleanup/provenance-prune-v2
    paths:
      - ".github/workflows/prune_current_provenance.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install QA dependencies
        run: python -m pip install --disable-pip-version-check -q python-docx==1.2.0 PyYAML==6.0.2
      - name: Remove noncurrent provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          plan=Path("provenance/CURRENT_PROVENANCE_PRUNE_PLAN.json")
          x=json.loads(plan.read_text(encoding="utf-8"))
          for rel in x["candidates"]:
              p=Path(rel)
              if p.exists():
                  p.unlink()
          plan.unlink()
          print({"removed_candidates":len(x["candidates"])})
          PY
      - name: Validate minimal current package
        run: |
          python -m compileall -q scripts
          python scripts/qa/audit_repository_structure.py
          python scripts/qa/audit_rc11_submission_package.py
          python scripts/qa/audit_jae_initial_submission_rc11_2026.py
          python scripts/submission/build_jae_anonymous_docx.py --source MANUSCRIPT_JAE_V1_3.md --output /tmp/Manuscript.docx
          python scripts/submission/build_jae_anonymous_docx.py --source SUPPORTING_INFORMATION_JAE_RC11_V0_1.md --output /tmp/Supporting_Information.docx
      - name: Commit provenance prune
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "418982+github-actions[bot]@users.noreply.github.com"
          git add -A provenance
          git commit -m "prune noncurrent provenance"
          git push origin HEAD:cleanup/provenance-prune-v2
