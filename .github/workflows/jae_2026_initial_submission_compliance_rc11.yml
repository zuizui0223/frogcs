name: JAE 2026 initial-submission compliance audit RC11
on:
  push:
    branches:
      - revision/rc10-reviewer-defense-v1
    paths:
      - "MANUSCRIPT_JAE_V1_3.md"
      - "SUPPORTING_INFORMATION_JAE_RC11_V0_1.md"
      - "NAAMP_SAME_OBSERVER_ROBUSTNESS_SUMMARY_V0_1.json"
      - "submission/COVER_LETTER_JAE_V0_13.md"
      - "JAE_TITLE_PAGE_V0_8.template.md"
      - "scripts/audit_jae_initial_submission_rc11_2026.py"
      - ".github/workflows/jae_2026_initial_submission_compliance_rc11.yml"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/audit_jae_initial_submission_rc11_2026.py
