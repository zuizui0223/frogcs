name: site memory intensity localization
on:
  push:
    branches: [exploration/site-memory-intensity-localization-v1]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - run: python exploration/run_naamp_prior_site_memory_intensity_localization.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-prior-site-memory-intensity-localization-v0-1
          path: |
            exploration/NAAMP_PRIOR_SITE_MEMORY_INTENSITY_LOCALIZATION_CONTRACT_V0_1.json
            exploration/NAAMP_PRIOR_SITE_MEMORY_INTENSITY_LOCALIZATION_RECEIPT_V0_1.json
          if-no-files-found: error
