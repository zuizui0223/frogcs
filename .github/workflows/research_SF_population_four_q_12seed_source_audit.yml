name: Frogcs audit all four population count scales q3 q6 q9 q12 from source

on:
  push:
    branches:
      - research/SF-population-scale-intermediate-q6-q9-20261031
    paths:
      - .github/workflows/research_SF_population_four_q_12seed_source_audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-true-80year-original-biology-all-q-values:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      OLD_RUN: '41201411618'
      OLD_ARTIFACT: frogcs-80y-SF-predation-q3-vs-q12-12seed-audited
      EXTRA_RUN: '41201977583'
      OLD_DIR: research/results/SF_predation_intermediate_q6_q9_20261031/immutable_q3_q12
      NEW_DIR: research/results/SF_predation_intermediate_q6_q9_20261031/genuine_q6_q9
      OUT_DIR: research/results/SF_predation_intermediate_q6_q9_20261031/final_four_q_audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2' 'tabulate>=0.9,<1'
      - name: Fetch exact immutable verified q3/q12 12seed source trajectories
        run: |
          mkdir -p "$OLD_DIR"
          gh run download "$OLD_RUN" --repo "${{ github.repository }}" --name "$OLD_ARTIFACT" --dir "$OLD_DIR"
      - name: Fetch all 24 genuine q6/q9 original 80-year finite source shards
        run: |
          mkdir -p "$NEW_DIR"
          gh run download "$EXTRA_RUN" --repo "${{ github.repository }}" --pattern "frogcs-q69-source-*" --dir "$NEW_DIR"
      - name: Audit each source factorial, no missing seeds, integer cohort conservation and stage-growth sign
        run: python research/scripts/audit_SF_predation_four_population_scales_12seed.py --existing-q3-q12 "$OLD_DIR" --new-q6-q9 "$NEW_DIR" --out "$OUT_DIR"
      - name: Preserve original sources, four-q year80 occupancy saturation and source inference limits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-FSD-population-scales-q3-q6-q9-q12-source-audited
          path: research/results/SF_predation_intermediate_q6_q9_20261031/final_four_q_audit/
          if-no-files-found: warn
          retention-days: 30
