name: Frogcs trophic process-parameter prior predictive

on:
  push:
    branches:
      - research/multigeneration-reversal-abm-pde-20261031
    paths:
      - research/MACRO_POM_PROCESS_PRIOR_PREDICTIVE_PROTOCOL_2026-10-31.md
      - research/scripts/run_macro_process_prior_predictive.py
      - research/scripts/test_macro_process_prior_predictive.py
      - .github/workflows/research_macro_process_priors.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  true-simulator-prior-predictive:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic science dependencies
        run: python -m pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.3
      - name: Verify complete structural scenarios, source priors and actual recurrence
        run: python -m unittest discover -s research/scripts -p 'test_macro_process_prior_predictive.py' -v
      - name: Verify all original source data exist
        run: |
          python - <<'PY'
          from pathlib import Path
          names=[
            'research/results/naamp_remote_vegetation_20261026/primary_site_landscape_context.csv.gz',
            'research/results/naamp_three_guild_occurrence/full_naamp_history/naamp_completed_site_surveys.csv.gz',
            'research/results/literature_extension_20261029/design.csv',
            'research/results/literature_extension_20261029/primary_0_dynamic_cells.csv.gz',
            'research/results/literature_extension_20261029/primary_1_dynamic_cells.csv.gz',
          ]
          for name in names:
            p=Path(name)
            if not p.is_file() or p.stat().st_size<10:raise SystemExit('Missing source '+name)
            print(name,p.stat().st_size)
          PY
      - name: Replay original 80-year kernel and eight matched process uncertainty draws
        run: python -u research/scripts/run_macro_process_prior_predictive.py --run --draws 8
      - name: Audit 80-year source replay, 4,248-site pattern mapping and all 8 rate draws
        run: |
          python - <<'PY'
          import json
          import numpy as np
          import pandas as pd
          from pathlib import Path
          p=Path('research/results/macro_pom_process_prior_20261031')
          s=pd.read_csv(p/'process_prior_summary.csv')
          x=pd.read_csv(p/'process_prior_predictive_patterns.csv')
          c=pd.read_csv(p/'real_simulator_F_B_cells.csv.gz')
          d=pd.read_csv(p/'hypothetical_process_rate_draws.csv')
          r=pd.read_csv(p/'heldout_rate_draw_group_recovery.csv')
          m=pd.read_csv(p/'conditional_rate_prior_acceptance.csv')
          a=json.loads((p/'receipt.json').read_text())
          assert a['model_original_replayed'] and max(a['baseline_error'].values())<=1e-8
          assert len(s)==2 and len(x)==8*24*2 and len(c)==8*24*162
          assert len(d)==8 and len(r)==8*24*2 and len(m)==12*2
          assert x.groupby(['background','draw']).case.nunique().eq(24).all()
          assert m.groupby('background').illustrative_acceptance_share.sum().between(.999999,1.000001).all()
          assert np.isfinite(x.distance).all() and c.F_B.gt(0).all()
          assert d.f_delay.value_counts().to_dict()=={2:4,3:4}
          print('PROCESS_PRIOR_AUDIT_SUCCESS',len(x),'site-matched scenario/background/rate points',len(c),'genuine demographic source cells')
          PY
      - name: Print complete compact rate and selected-scenario evidence
        run: |
          for f in hypothetical_process_rate_draws.csv process_prior_summary.csv conditional_rate_prior_acceptance.csv; do
            echo "===== $f ====="
            cat "research/results/macro_pom_process_prior_20261031/$f"
          done
          python - <<'PY'
          import pandas as pd
          root='research/results/macro_pom_process_prior_20261031/'
          x=pd.read_csv(root+'process_prior_predictive_scores.csv')
          print('===== top 30 rate/structure configurations per background =====')
          print(x.sort_values(['background','distance']).groupby('background').head(30).to_csv(index=False))
          r=pd.read_csv(root+'heldout_rate_draw_group_recovery.csv')
          print('===== family-level leave-one-rate-draw-out recovery =====')
          print(r.groupby('background').group_recovered.agg(['mean','size']).to_csv())
          PY
      - name: Retain full demographic prior-predictive library and reproducibility receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-process-rate-POM-real-simulator-20261031
          path: research/results/macro_pom_process_prior_20261031/
          if-no-files-found: warn
          retention-days: 30
