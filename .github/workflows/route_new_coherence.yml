name: route-new conditional coherence
on:
  push:
    branches: [exploration/route-new-coherence-v1]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - run: python exploration/run_naamp_route_new_coherence_conditional.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-route-new-coherence-conditional-v0-1
          path: |
            exploration/NAAMP_ROUTE_NEW_COHERENCE_CONDITIONAL_CONTRACT_V0_1.json
            exploration/NAAMP_ROUTE_NEW_COHERENCE_CONDITIONAL_RECEIPT_V0_1.json
          if-no-files-found: error
