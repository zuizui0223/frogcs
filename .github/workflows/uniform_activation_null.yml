name: NAAMP uniform activation null
on:
  push:
    branches:
      - revision/rc8-uniform-null-equivalence-v1
    paths:
      - "provenance/contracts/NAAMP_UNIFORM_ACTIVATION_NULL_CONTRACT_V0_1.json"
      - "provenance/repairs/NAAMP_UNIFORM_ACTIVATION_NULL_REPAIR_V0_1_1.json"
      - "scripts/naamp/run_naamp_uniform_activation_null.py"
      - ".github/workflows/uniform_activation_null.yml"
  workflow_dispatch:

concurrency:
  group: uniform-activation-null
  cancel-in-progress: true
jobs:
  uniform_null:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas statsmodels
      - name: Run frozen uniform-activation null
        run: python scripts/naamp/run_naamp_uniform_activation_null.py
      - uses: actions/upload-artifact@v4
        with:
          name: uniform-activation-null
          path: provenance/receipts/NAAMP_UNIFORM_ACTIVATION_NULL_RECEIPT_V0_1.json
          if-no-files-found: error
