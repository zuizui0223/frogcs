name: frogcs activation-geometry placebo gate

on:
  push:
    branches:
      - revision/activation-geometry-placebo-gate-v1
    paths:
      - "provenance/contracts/NAAMP_ACTIVATION_GEOMETRY_PLACEBO_CONTRACT_V0_1.json"
      - "scripts/run_naamp_activation_geometry_placebo_gate.py"
      - ".github/workflows/activation_geometry_placebo_gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - name: Run frozen activation-geometry placebo gate
        run: python scripts/run_naamp_activation_geometry_placebo_gate.py
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-activation-geometry-placebo-v0-1
          path: NAAMP_ACTIVATION_GEOMETRY_PLACEBO_RECEIPT_V0_1.json
          if-no-files-found: error
