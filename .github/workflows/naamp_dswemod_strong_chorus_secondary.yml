name: NAAMP DSWEmod strong-chorus secondary

on:
  push:
    branches:
      - remotesensing/naamp-dynamic-hydrology-v1
    paths:
      - ".github/workflows/naamp_dswemod_strong_chorus_secondary.yml"
      - "scripts/remotesensing/run_naamp_dswemod_strong_chorus_secondary.py"
      - "revision/NAAMP_DSWEMOD_STRONG_CHORUS_SECONDARY_V0_1.md"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy pandas scipy statsmodels patsy
      - uses: actions/download-artifact@v4
        with:
          name: naamp-dswemod-v02-reuse-result
          path: frozen_dswemod
          github-token: ${{ github.token }}
          run-id: 37615425574
      - name: Run frozen DSWEmod strong-chorus secondary
        env:
          NAAMP_DSWEMOD_123_CSV: frozen_dswemod/NAAMP_DSWEMOD_RUN_SITE_METRICS_V0_1.csv
        run: python scripts/remotesensing/run_naamp_dswemod_strong_chorus_secondary.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-dswemod-strong-chorus-secondary
          path: remotesensing/NAAMP_DSWEMOD_STRONG_CHORUS_SECONDARY_RECEIPT_V0_1.json
          retention-days: 30
