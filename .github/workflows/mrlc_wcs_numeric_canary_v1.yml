name: Official MRLC WCS bounded numeric raster canary

on:
  push:
    branches:
      - research/state-history-hydric-synthesis-v1
    paths:
      - ".github/workflows/mrlc_wcs_numeric_canary_v1.yml"
      - "research/scripts/mrlc_wcs_numeric_canary_v0_1.py"
      - "research/tests/test_mrlc_wcs_numeric_canary.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent_unselected_location:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Numerical geographic support
        run: python -m pip install --disable-pip-version-check -q numpy pyproj rasterio
      - name: Synthetic TIFF and URL tests
        run: |
          python -m compileall -q research/scripts research/tests
          python -m unittest discover -s research/tests -p "test_mrlc_wcs_numeric_canary.py" -v
      - name: Fetch only fixed 64x64 nominal-pixel public USGS Iowa canary
        run: python research/scripts/mrlc_wcs_numeric_canary_v0_1.py
      - name: Preserve read-only true-numeric vs HTML result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrlc-wcs-2012-source-version-unknown-numeric-canary-v1
          path: research/output/MRLC_WCS_NUMERIC_CANARY_V0_1.json
          if-no-files-found: warn
          retention-days: 60
