name: NAAMP weather schema audit
on:
  push:
    branches: [exploration/naamp-weather-schema-v1]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - run: python exploration/audit_naamp_weather_schema.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-weather-schema-v0-1
          path: exploration/NAAMP_WEATHER_SCHEMA_AUDIT_V0_1.json
          if-no-files-found: error
