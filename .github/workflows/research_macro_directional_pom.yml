name: Frogcs direction-only three-state POM

on:
  push:
    branches:
      - research/multigeneration-reversal-abm-pde-20261031
    paths:
      - research/MACRO_DIRECTIONAL_POM_PROTOCOL_2026-10-31.md
      - research/scripts/directional_pom_132.py
      - research/scripts/test_directional_pom_132.py
      - .github/workflows/research_macro_directional_pom.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  directional-pom:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed dependencies
        run: python -m pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.3
      - name: Test observed 3-state logic, joint sign scores and exact-duplicate protection
        run: python -m unittest discover -s research/scripts -p 'test_directional_pom_132.py' -v
      - name: Evaluate every exact surface group with joint observed and simulated directional variation
        run: python -u research/scripts/directional_pom_132.py --run --model-reps 64 --recovery-reps 8
      - name: Verify all 132 case identities and both SDM backgrounds
        run: |
          python - <<'PY'
          import json
          import numpy as np
          import pandas as pd
          from pathlib import Path
          p=Path('research/results/macro_directional_pom_20261031')
          a=pd.read_csv(p/'case_scores.csv')
          s=pd.read_csv(p/'directional_groups.csv')
          o=pd.read_csv(p/'observed_sign_bootstrap.csv')
          r=pd.read_csv(p/'recovery.csv')
          confusion=pd.read_csv(p/'directional_recovery_confusion.csv')
          assert int(confusion.n.sum())==len(r)
          assert confusion.groupby(['background','true_direction_group']).fraction_of_true_group.sum().between(.99999,1.00001).all()
          summary=pd.read_csv(p/'summary.csv')
          h=pd.read_csv(p/'unselected_pattern_diagnostics.csv')
          audit=json.loads((p/'receipt.json').read_text())
          assert len(a)==264 and a.groupby('background').case.nunique().eq(132).all()
          assert int(s.n_case_labels.sum())==264
          assert len(o)==12 and len(summary)==2 and len(h)==8
          assert int(r.groupby('background').size().min())==104*8
          assert set(summary.background)=={'uniform','target_group'}
          assert s.n_exact_source_groups.ge(1).all()
          assert np.isfinite(a.joint_direction_soft_score).all()
          assert a.strict_joint_matching_probability.between(0,1).all()
          assert o.p_negative_bootstrap.between(0,1).all()
          assert (o[['p_negative_bootstrap','p_near_zero_bootstrap','p_positive_bootstrap']].sum(axis=1)-1).abs().max()<1e-8
          assert audit['n_cases']==132
          print('DIRECTION_ONLY_AUDIT_SUCCESS',len(a),'case/background records',
                len(s),'direction-groups across backgrounds',len(r),'independent synthetic recovery draws')
          PY
      - name: Print complete directional evidence for source-backed commit
        run: |
          for f in summary.csv observed_sign_bootstrap.csv directional_groups.csv unselected_pattern_diagnostics.csv; do
            echo "===== $f ====="
            cat "research/results/macro_directional_pom_20261031/$f"
          done
          echo '===== top 24 individual groups ====='
          python - <<'PY'
          import pandas as pd
          x=pd.read_csv('research/results/macro_directional_pom_20261031/case_scores.csv')
          print(x.sort_values(['background','joint_direction_soft_score'],
                     ascending=[True,False]).groupby('background').head(12).to_csv(index=False))
          PY
      - name: Preserve source-level and synthetic directional audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-direction-only-POM-20261031
          path: research/results/macro_directional_pom_20261031/
          if-no-files-found: warn
          retention-days: 30
