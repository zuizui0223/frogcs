name: frogcs functional community expansion

on:
  push:
    branches:
      - revision/functional-community-expansion-v1
    paths:
      - "NAAMP_FUNCTIONAL_COMMUNITY_EXPANSION_CONTRACT_V0_1.json"
      - "scripts/run_naamp_functional_community_expansion.py"
      - ".github/workflows/functional_community_expansion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - name: Run frozen functional-community analysis
        run: python scripts/run_naamp_functional_community_expansion.py
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-functional-community-expansion-v0-1
          path: NAAMP_FUNCTIONAL_COMMUNITY_EXPANSION_RECEIPT_V0_1.json
          if-no-files-found: error
