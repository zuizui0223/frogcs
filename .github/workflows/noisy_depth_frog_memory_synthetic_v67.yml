name: v6.7 synthetic noisy depth logger spurious acoustic history QA
on:
  push:
    branches:
      - audit/iowa-station-waterstate-source-gate-v31
    paths:
      - "studies/climate_landscape/V6_7_SENSOR_MEASUREMENT_ERROR_FALSE_ACOUSTIC_MEMORY_CONTRACT.md"
      - "studies/climate_landscape/scripts/test_noisy_hydro_logger_spurious_acoustic_history_v67.py"
      - ".github/workflows/noisy_depth_frog_memory_synthetic_v67.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-logger-measurement-confounding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install synthetic-only numeric dependencies
        run: python -m pip install "numpy>=1.26,<3" "scikit-learn>=1.5,<2"
      - name: Run measurement-error, multi-logger and gap counterexamples with held-out simulated frogs
        run: python studies/climate_landscape/scripts/test_noisy_hydro_logger_spurious_acoustic_history_v67.py
