name: migrate script layout
on:
  push:
    branches: [cleanup/deep-structure-v1]
    paths:
      - "scripts/migrate_script_layout.py"
      - ".github/workflows/migrate_script_layout.yml"
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/migrate_script_layout.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "organize scripts by domain"
          git push origin HEAD:cleanup/deep-structure-v1
