name: Frogcs 80y finite-N independent eight extra seeds source validation

on:
  push:
    branches:
      - research/finite-n-stage-bridge-20261031
    paths:
      - .github/workflows/research_finite_n_80year_extra8.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  true-source-80year-extra-seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        scale: [3, 12]
        immigration: ["off", "on"]
        seed_start: [105, 109]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2'
      - name: Require same biology, integer mass and maturation/censor unit tests
        run: python -m unittest discover -s research/scripts -p test_finite_n_source_cohort_bridge.py -v
      - name: Run true 80y source with only predeclared NEW seed labels
        run: python research/scripts/finite_n_source_cohort_bridge.py --run --years 80 --draws 1 --seeds 4 --seed-start ${{ matrix.seed_start }} --scales ${{ matrix.scale }} --immigration ${{ matrix.immigration }} --movement-modes off both
      - name: Save exact 80year new seed source ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-finite-n-extra8-source-q${{ matrix.scale }}-imm${{ matrix.immigration }}-seed${{ matrix.seed_start }}
          path: research/results/finite_n_stage_bridge_20261031/
          retention-days: 30
          if-no-files-found: warn
