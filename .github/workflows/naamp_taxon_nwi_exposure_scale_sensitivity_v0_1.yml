name: NAAMP frog taxa NWI PEM exposure-scale sensitivity

on:
  push:
    branches: [exploration/naamp-aquatic-vegetation-2026-10-21]
    paths:
      - ".github/workflows/naamp_taxon_nwi_exposure_scale_sensitivity_v0_1.yml"

permissions:
  contents: read
  actions: read

jobs:
  source-scaled-effect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels
      - uses: actions/download-artifact@v4
        with:
          run-id: 39450277196
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: naamp-nwi-vegetation-sites-validated
          path: build/vegetation_context
      - name: Audit absolute mapped cover magnitude and binary-presence sensitivity
        run: |
          python -m py_compile exploration/run_naamp_taxon_nwi_exposure_scale_sensitivity_v0_1.py
          python -u exploration/run_naamp_taxon_nwi_exposure_scale_sensitivity_v0_1.py \
            --nwi-sites build/vegetation_context/site_nwi_vegetation_context.csv \
            --nwi-audit build/vegetation_context/geometry_nwi_preflight.json
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-taxon-nwi-exposure-scale-sensitivity-v0-1
          path: build/aquatic_vegetation_ecology/taxon_nwi_exposure_sensitivity_v0_1.json
          if-no-files-found: error
