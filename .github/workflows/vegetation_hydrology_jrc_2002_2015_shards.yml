name: NAAMP 2002-2015 JRC source sharded environmental pixels
on:
  push:
    branches: [research/vegetation-hydrology-feasibility-2026-10]
    paths:
      - ".github/workflows/vegetation_hydrology_jrc_2002_2015_shards.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-jrc-water-by-source-shard:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        year: [2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015]
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: studies/vegetation_hydrology
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install geospatial only requirements
        run: python -m pip install -r requirements.txt
      - name: Verify source sharding and pixel no-observation semantics
        run: python -m unittest discover -s tests -p test_jrc_shard.py -v
      - name: Restore full NAAMP source-only physical site calendar (checksums verified in Python)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/qc
          gh run download 39960918335 --repo zuizui0223/frogcs --name public-NAAMP-outcome-blind-site-frame --dir data/qc
      - name: Extract year/source shard without reading acoustic data
        run: |
          python scripts/run_jrc_prior_month_shard.py \
            --year ${{ matrix.year }} \
            --shard-count 6 \
            --shard-index ${{ matrix.shard }} \
            --accepted-coordinates data/qc/accepted_coordinates.csv \
            --site-calendar data/qc/survey_site_calendar.csv \
            --out-dir data/qc/water_year_${{ matrix.year }}_shard_${{ matrix.shard }}
      - name: Save verified source/pixel receipts even if a source fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naamp-jrc-${{ matrix.year }}-shard${{ matrix.shard }}-of6-environment-only
          path: studies/vegetation_hydrology/data/qc/water_year_${{ matrix.year }}_shard_${{ matrix.shard }}/
          if-no-files-found: warn
