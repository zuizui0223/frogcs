name: Frogcs speculative S-facilitated predator amplification

on:
  push:
    branches:
      - research/multigeneration-reversal-abm-pde-20261031
    paths:
      - research/MACRO_DANGER_AMPLIFICATION_HYPOTHESIS_2026-10-31.md
      - research/scripts/stage_network_s_facilitated_danger_20261031.py
      - research/scripts/annual_s_facilitated_danger_20261031.py
      - research/scripts/run_s_facilitated_danger_pom.py
      - research/scripts/test_s_facilitated_danger_pom.py
      - .github/workflows/research_s_facilitated_danger_pom.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  danger-amplification-hypothesis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned scientific tools
        run: python -m pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.3
      - name: Verify original-kernel replay and safe hypothetical strength
        run: python -m unittest discover -s research/scripts -p 'test_s_facilitated_danger_pom.py' -v
      - name: Run original 80-year recurrence under neutral, moderate and strong S-facilitation
        run: python -u research/scripts/run_s_facilitated_danger_pom.py --run
      - name: Verify all scenario reports and exact original source baseline
        run: |
          python - <<'PY'
          import pandas as pd
          import json
          from pathlib import Path
          p=Path('research/results/macro_s_facilitated_danger_20261031')
          s=pd.read_csv(p/'hypothetical_directional_summary.csv')
          x=pd.read_csv(p/'hypothetical_directional_scores.csv')
          f=pd.read_csv(p/'hypothetical_80year_F_B_cells.csv.gz')
          a=json.loads((p/'receipt.json').read_text())
          assert len(s)==6 and len(x)==3*24*2 and len(f)==3*24*162
          assert a['original_baseline_verified']
          assert a['baseline_replay_errors']['F_B']<=1e-8
          assert a['baseline_replay_errors']['F_fraction']<=1e-8
          assert a['baseline_replay_errors']['F_B_sd']<=1e-7
          assert s.groupby('background').hypothesis.nunique().eq(3).all()
          assert f.groupby('hypothesis').case.nunique().eq(24).all()
          assert x.direction_soft.between(0,1).all()
          print('SPECULATIVE_DANGER_AUDIT_SUCCESS',len(x),'case comparisons')
          PY
      - name: Print fixed hypothetical model comparisons
        run: |
          echo '===== hypothetical_directional_summary.csv ====='
          cat research/results/macro_s_facilitated_danger_20261031/hypothetical_directional_summary.csv
          python - <<'PY'
          import pandas as pd
          p='research/results/macro_s_facilitated_danger_20261031/'
          x=pd.read_csv(p+'hypothetical_directional_scores.csv')
          for bg in ('uniform','target_group'):
              print('===== TOP '+bg+' =====')
              print(x[x.background==bg].sort_values(['hypothesis','direction_soft'],
                                                    ascending=[True,False]).groupby('hypothesis').head(5).to_csv(index=False))
          PY
      - name: Preserve complete hypothetical scenario and original baseline receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-S-facilitated-danger-POM-20261031
          path: research/results/macro_s_facilitated_danger_20261031/
          if-no-files-found: warn
          retention-days: 30
