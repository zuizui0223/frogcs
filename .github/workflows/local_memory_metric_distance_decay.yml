name: local memory metric distance decay
on:
  push:
    branches: [exploration/local-memory-distance-decay-v1]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - run: python -m compileall -q exploration scripts
      - run: python exploration/run_naamp_local_memory_metric_distance_decay.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-local-memory-metric-distance-decay-v0-1
          path: |
            exploration/NAAMP_LOCAL_MEMORY_METRIC_DISTANCE_DECAY_CONTRACT_V0_1.json
            exploration/NAAMP_LOCAL_MEMORY_METRIC_DISTANCE_DECAY_RECEIPT_V0_1.json
          if-no-files-found: error
