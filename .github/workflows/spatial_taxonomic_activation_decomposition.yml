name: frogcs spatial-taxonomic activation decomposition

on:
  push:
    branches:
      - revision/spatial-taxonomic-activation-decomposition-v1
    paths:
      - "NAAMP_SPATIAL_TAXONOMIC_ACTIVATION_CONTRACT_V0_1.json"
      - "scripts/run_naamp_spatial_taxonomic_activation_decomposition.py"
      - ".github/workflows/spatial_taxonomic_activation_decomposition.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - name: Run frozen decomposition
        run: python scripts/run_naamp_spatial_taxonomic_activation_decomposition.py
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-spatial-taxonomic-activation-v0-1
          path: NAAMP_SPATIAL_TAXONOMIC_ACTIVATION_RECEIPT_V0_1.json
          if-no-files-found: error
