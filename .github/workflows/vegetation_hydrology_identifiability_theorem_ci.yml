name: Frog chorus site-history structural identifiability negative controls
on:
  push:
    branches:
      - research/chorus-history-structural-identifiability-2026-10-24
    paths:
      - "studies/vegetation_hydrology/structural_identifiability/verify_structural_alias.py"
      - "studies/vegetation_hydrology/structural_identifiability/test_verify_structural_alias.py"
      - ".github/workflows/vegetation_hydrology_identifiability_theorem_ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-proof-only:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studies/vegetation_hydrology/structural_identifiability
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install NumPy only, no frog source downloads
        run: python -m pip install 'numpy>=1.24'
      - name: Run six structural and observation-rank negative controls
        run: python -m unittest -v test_verify_structural_alias.py
      - name: Verify 333-route numerical exact-k structural equivalence
        run: python verify_structural_alias.py
