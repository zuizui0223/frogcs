name: Spatial depth shape audit

on:
  push:
    branches: [audit/spatial-depth-shape-v1]
    paths:
      - "audit/NAAMP_SPATIAL_DEPTH_SHAPE_AUDIT_CONTRACT_V0_1.json"
      - "audit/run_naamp_spatial_depth_shape_audit.py"
      - ".github/workflows/spatial_depth_shape_audit.yml"
  workflow_dispatch:

permissions: {contents: read}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas statsmodels
      - name: Run frozen descriptive audit
        run: python audit/run_naamp_spatial_depth_shape_audit.py
      - name: Audit output contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("audit/NAAMP_SPATIAL_DEPTH_SHAPE_AUDIT_RECEIPT_V0_1.json")
          x=json.loads(p.read_text())
          assert x["n_pairs"]==4236
          a=x["algebraic_identities"]
          assert abs(a["extra_minus_sum_marginal_2_to_10"]) < 1e-9
          assert abs(a["third_plus_minus_sum_marginal_3_to_10"]) < 1e-9
          assert abs(a["P_minus_H_minus_extra"]) < 1e-9
          assert x["shape_interpretation"]["exponential_shape_authorized"] is False
          assert x["shape_interpretation"]["H_equivalent_to_standard_pair_count_after_conditioning_on_extra_stop"] is True
          print({"status":"PASS","n_pairs":x["n_pairs"],"marginal_both":x["marginal_sites_above_upper_95_both_nulls"]})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-spatial-depth-shape-audit
          path: audit/NAAMP_SPATIAL_DEPTH_SHAPE_AUDIT_RECEIPT_V0_1.json
