name: sync temporal rain-sensitivity receipt

on:
  push:
    branches:
      - revision/rain-response-persistence-v1
    paths:
      - ".github/workflows/sync_temporal_rain_receipt.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revision/rain-response-persistence-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - name: Recompute frozen fixed family and temporal receipt
        run: |
          python scripts/run_naamp_species_pulse_heterogeneity.py
          python scripts/run_naamp_temporal_rain_sensitivity.py
      - name: Verify headline result identity
        run: |
          python - <<'PY'
          import json, math
          x=json.load(open("NAAMP_TEMPORAL_RAIN_SENSITIVITY_RECEIPT_V0_1.json"))
          p=x["primary_cross_species"]
          assert p["n_species"]==27
          assert math.isclose(p["beta_per_1sd_early_sensitivity"],0.2843699134346247,rel_tol=0,abs_tol=1e-12)
          assert math.isclose(p["p_value"],0.00010490792632491435,rel_tol=0,abs_tol=1e-15)
          f=x["family_stratified_permutation"]
          assert f["n_species"]==24
          assert math.isclose(f["positive_tail_p"],0.015639843601563983,rel_tol=0,abs_tol=1e-15)
          print("temporal receipt identity PASS")
          PY
      - name: Commit full receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NAAMP_TEMPORAL_RAIN_SENSITIVITY_RECEIPT_V0_1.json
          if git diff --cached --quiet; then
            echo "Receipt already synchronized"
            exit 0
          fi
          git commit -m "Sync full temporal rain-sensitivity receipt"
          git push origin HEAD:revision/rain-response-persistence-v1
