name: latent-site reactivation analysis

on:
  push:
    branches:
      - exploration/latent-reactivation-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latent-reactivation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - name: Compile
        run: python -m compileall -q exploration scripts
      - name: Run latent-site reactivation test
        run: python exploration/run_naamp_latent_site_reactivation.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-latent-site-reactivation-v0-1
          path: |
            exploration/NAAMP_LATENT_SITE_REACTIVATION_CONTRACT_V0_1.json
            exploration/NAAMP_LATENT_SITE_REACTIVATION_RECEIPT_V0_1.json
          if-no-files-found: error
