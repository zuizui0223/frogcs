name: G13 44-claim manuscript and rate-conditioned ABC structure source QA
on:
  push:
    branches:
      - research/g13-abc-conditional-structure-null-20261107
    paths:
      - .github/workflows/research_g13_abc_manuscript_source_qa.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-G13-original-ABC-and-entire-manuscript:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Original numerical audit dependencies
        run: python -m pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.3
      - name: Reproduce original 44 field/mechanism population claims and manuscript structural safeguards
        run: |
          python -u research/scripts/audit_submission_claims_20261105.py \
            --r2 research/results/submission_frozen_sources_20261106/R2 \
            --pr161 research/results/submission_frozen_sources_20261106/R3 \
            --r4 research/results/submission_frozen_sources_20261106/R4 \
            --g2 research/results/submission_frozen_sources_20261106/G2 \
            --g2b research/results/submission_frozen_sources_20261106/G2B \
            --p1 research/results/submission_frozen_sources_20261106/P1 \
            --main editorial/MAIN_TEXT_R1_R4_SUBMISSION_CANDIDATE_2026-11-05.md \
            --si editorial/SUPPLEMENTARY_METHODS_AND_EVIDENCE_R1_R4_2026-11-05.md \
            --out research/results/g13_submission_QA_20261107
      - name: Independently audit G13 20k acceptance, all 81 strata, 4999 null draws, 34 maxT features and revised Letter
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          import numpy as np,pandas as pd
          root=Path('.')
          g13=root/'research/results/g13_abc_structure_null_20261107'
          g12=root/'research/results/g12_abc_pom_prior_20261107'
          q=root/'research/results/g13_submission_QA_20261107'
          g11=root/'research/results/g11_disjoint_holdout_20261107/audited'
          receipt=json.loads((g13/'G13_source_audit_receipt.json').read_text())
          old=json.loads((g12/'source_receipt/r2_original_source_receipt.json').read_text())
          history=json.loads((g11/'g11_final_independent_validation_receipt.json').read_text())
          qc=json.loads((q/'submission_source_QA_receipt.json').read_text())
          assert receipt['status']=='G13_81_RATE_CONTEXT_CONDITIONAL_NULL_ABC_STRUCTURE_AUDIT_SUCCESS'
          assert (receipt['original_proposals'],receipt['original_four_sign_accepted'],
                  receipt['source_survival_count'],receipt['original_unique'])==(20000,794,426,647)
          assert (receipt['synthetic_rate_by_context_strata'],receipt['null_replicates'],
                  receipt['tested_feature_levels'],receipt['null_eligible_feature_levels'])==(81,4999,34,34)
          assert receipt['original_eight_shard_sha256']==old['original_shard_sha256']
          assert not receipt['posterior_for_natural_field_mechanism'] and receipt['no_new_biological_model_run']
          for name,digest in receipt['outputs_sha256'].items():
              assert hashlib.sha256((g13/name).read_bytes()).hexdigest()==digest
          for name,digest in old['original_shard_sha256'].items():
              assert hashlib.sha256((g12/'original_20k'/name).read_bytes()).hexdigest()==digest
          source=pd.concat([pd.read_csv(p) for p in sorted((g12/'original_20k').glob('shard_*.csv.gz'))])
          assert len(source)==20000 and source.draw_id.nunique()==20000
          assert source.accepted.sum()==794 and source.loc[source.accepted,'model_id'].nunique()==647
          assert source.groupby(['attack','rho','conversion','context_id']).ngroups==81
          summary=pd.read_csv(g13/'G13_conditional_structure_concentration.csv')
          assert len(summary)==4
          main_id=summary[(summary.criterion=='original_four_sign') &
                          (summary.metric=='distinct_accepted_canonical_IDs')].iloc[0]
          main_eff=summary[(summary.criterion=='original_four_sign') &
                           (summary.metric=='Shannon_effective_accepted_IDs')].iloc[0]
          assert main_id.observed==647 and 710<main_id.conditional_null_mean<714
          assert main_id.conditional_null_95_low==696 and main_id.conditional_null_95_high==727
          assert main_id.one_sided_concentration_p==.0002
          assert 603<main_eff.observed<606 and 684<main_eff.conditional_null_mean<687
          assert main_eff.one_sided_concentration_p==.0002
          null=pd.read_csv(g13/'G13_4999_exact_stratum_permutation_null.csv.gz')
          assert len(null)==4999 and null.permutation.nunique()==4999
          assert abs(null.four_sign_distinct_models.mean()-main_id.conditional_null_mean)<1e-12
          feat=pd.read_csv(g13/'G13_all_feature_level_rate_context_adjusted.csv')
          assert len(feat)==34 and feat.feature.nunique()==16
          assert int(feat.maxT_family_eligible.sum())==34
          for axis,group in feat.groupby('feature'):
              assert int(group.original_proposals.sum())==20000
              assert int(group.accepted_proposals.sum())==794
              assert abs(group.expected_accepted_count.sum()-794)<1e-9
          support=feat[(feat.feature=='support_DF') & (feat.level.astype(str)=='1')]
          assert len(support)==1
          support=support.iloc[0]
          assert int(support.accepted_proposals)==535
          assert abs(support.expected_accepted_count-396.286832822281)<1e-8
          assert abs(support.accepted_minus_conditional_null_expected_pp-17.4701721886296)<1e-8
          assert support.maxT_familywise_adjusted_p==.0002
          assert history['fixed_replication_gates']['joint_compatibility_population_mismatch']
          assert history['old_new_model_structure_overlap']==0
          assert qc['status']=='R1_R4_SUBMISSION_SOURCE_CLAIMS_AND_MANUSCRIPT_STRUCTURAL_QA_PASS'
          assert qc['independently_recomputed_numerical_claims']==44
          assert len(qc['document_structural_checks'])==13 and all(qc['document_structural_checks'].values())
          assert (qc['main_words'],qc['abstract_words'])==(4989,148)
          main=root/'editorial/MAIN_TEXT_R1_R4_SUBMISSION_CANDIDATE_2026-11-05.md'
          si=root/'editorial/SUPPLEMENTARY_METHODS_AND_EVIDENCE_R1_R4_2026-11-05.md'
          letter=root/'editorial/ECOLOGY_LETTERS_COVER_LETTER_DRAFT_2026-11-06.md'
          g13report=root/'research/G13_ABC_POM_CONDITIONAL_STRUCTURE_NULL_VERIFIED_RESULT_2026-11-07.md'
          assert 'Supplementary Methods S15' in si.read_text()
          for text0 in ('647','712','0.0002'):
              for doc in (main,si,letter,g13report):
                  assert text0 in doc.read_text(),(text0,doc)
          assert '4,989 words' in letter.read_text() and '148 words' in letter.read_text()
          assert 'not a field posterior' in main.read_text() or 'not a field-conditioned posterior' in main.read_text()
          for doc in (main,si,g13report):
              for url in re.findall(r'\]\(([^)]+)\)',doc.read_text()):
                  if url.startswith(('http://','https://','mailto:','#')):continue
                  relative=url.split('#',1)[0]
                  if relative and '?' not in relative:
                      assert (doc.parent/relative).exists(),(str(doc),url)
          out=dict(status='G13_ORIGINAL_20K_81_STRATA_34_LEVEL_44_CLAIM_EL_PAPER_QA_SUCCESS',
            original_source_claims=44,preexisting_document_checks=13,
            main_scientific_body_words=qc['main_words'],abstract_words=qc['abstract_words'],
            original_SHA_verified_proposals=20000,
            accepted_proposals=794,distinct_accepted_models=647,
            rate_context_strata=81,permutations=4999,
            conditional_null_mean_canonical_ids=float(main_id.conditional_null_mean),
            conditional_null_structural_concentration_p=.0002,
            full_mechanism_feature_levels=34,
            support_DF_conditional_enrichment_pp=float(support.accepted_minus_conditional_null_expected_pp),
            support_DF_maxT_familywise_p=float(support.maxT_familywise_adjusted_p),
            G11_disjoint_structure_mismatch_replication_passed=True,
            calibrated_field_ABC_posterior=False,submitted_to_journal=False)
          (q/'G13_abc_structure_manuscript_QA_receipt.json').write_text(json.dumps(out,indent=2)+'\n')
          print('G13_FULL_SOURCE_CONDITIONAL_ABC_AND_LETTER_44_CLAIM_QA_SUCCESS',json.dumps(out))
          PY
      - name: Archive complete G13 manuscript source QA on this Draft branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/results/g13_submission_QA_20261107/
          if git diff --cached --quiet; then
            echo 'G13 paper receipt already archived'
          else
            git commit -m 'qa: archive G13 20k conditional-null ABC and 44 manuscript claim audit'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-g13-abc-44claim-manuscript-source-QA
          path: research/results/g13_submission_QA_20261107/
          if-no-files-found: warn
          retention-days: 60
