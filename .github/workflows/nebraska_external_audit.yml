name: Nebraska external data audit
on:
  push:
    branches: [exploration/nebraska-external-v1]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: nebraska-external-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q pandas requests openpyxl
      - run: python exploration/audit_nebraska_boreal_chorus_data.py
      - uses: actions/upload-artifact@v4
        with:
          name: nebraska-boreal-chorus-data-audit-v0-1
          path: |
            exploration/NEBRASKA_BOREAL_CHORUS_EXTERNAL_CONTRACT_V0_1.json
            exploration/NEBRASKA_BOREAL_CHORUS_DATA_AUDIT_V0_1.json
          if-no-files-found: error
