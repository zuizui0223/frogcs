name: Research - rain vegetation wetland site prediction
on:
  push:
    branches: [integration/stage-legacy-unified-2026-10-25]
    paths:
      - research/scripts/hungary_rain_vegetation_site_allocation.py
      - .github/workflows/research_rain_vegetation_wetland_site_test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-backed-rain-veg-call:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned ML
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 pandas==2.2.3 scikit-learn==1.6.1
      - name: Fit source verified rain x vegetation/depth models holding out wetlands
        run: python research/scripts/hungary_rain_vegetation_site_allocation.py --out /tmp/hungary_rain_veg_sites.json
      - name: Prevent false hydroperiod or predator conclusions
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/hungary_rain_veg_sites.json'))
          assert x['n_sites']==29 and x['n_acoustic_visits']==129
          assert x['source_depth_is_hydroperiod_duration'] is False
          assert x['true_RC6_multisite_concentration_C_estimated'] is False
          assert x['frog_competition_causally_identified'] is False
          print('HUNGARY_RAIN_VEGETATION_QA_PASS')
          PY
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hungary_rain_vegetation_site_forecast
          path: /tmp/hungary_rain_veg_sites.json
          if-no-files-found: warn
