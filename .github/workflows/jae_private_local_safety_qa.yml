name: JAE private local assembly synthetic safety QA

on:
  push:
    branches:
      - submission/jae-current-main-artifact-audit-2026-10-15
    paths:
      - "scripts/submission/assemble_private_jae_local.py"
      - "scripts/submission/test_assemble_private_jae_local.py"
      - ".github/workflows/jae_private_local_safety_qa.yml"
      - ".github/workflows/pulse_template_submission_pipeline.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/submission/assemble_private_jae_local.py"
      - "scripts/submission/test_assemble_private_jae_local.py"
      - ".github/workflows/jae_private_local_safety_qa.yml"
      - ".github/workflows/pulse_template_submission_pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic_no_secret_only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local-only metadata and Word dependencies
        run: python -m pip install --disable-pip-version-check -q PyYAML==6.0.2 python-docx==1.2.0
      - name: Syntax and offline private packaging safety regressions
        run: |
          python -m compileall -q scripts/submission/assemble_private_jae_local.py scripts/submission/test_assemble_private_jae_local.py
          python -m unittest discover -s scripts/submission -p "test_assemble_private_jae_local.py" -v
      - name: Verify public GitHub Actions refuses private metadata before secrets
        run: |
          python - <<'PY'
          from pathlib import Path
          wf=Path(".github/workflows/pulse_template_submission_pipeline.yml").read_text()
          assert "refuse-public-private-bundle:" in wf
          job=wf.split("  private-bundle:\n",1)[1]
          assert "github.event.repository.private" in job.split("    needs:",1)[0]
          assert job.index("Fail closed if repository visibility") < job.index("Materialize private metadata")
          assert "github.event.repository.visibility" in job
          print("PASS: confidential author metadata unavailable to public workflow artifact jobs")
          PY
      # Never upload anything here; synthetic fixture includes dummy author text.
