name: rain selective local memory
on:
  push:
    branches: [exploration/rain-selective-memory-v1]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - run: python -m compileall -q exploration scripts
      - run: python exploration/run_naamp_rain_selective_local_memory.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-rain-selective-local-memory-v0-1
          path: |
            exploration/NAAMP_RAIN_SELECTIVE_LOCAL_MEMORY_CONTRACT_V0_1.json
            exploration/NAAMP_RAIN_SELECTIVE_LOCAL_MEMORY_RECEIPT_V0_1.json
          if-no-files-found: error
