name: Frogcs source-reuse cross-ontogeny plant ABC summary

on:
  push:
    branches:
      - research/multigeneration-reversal-abm-pde-20261031
    paths:
      - .github/workflows/research_cross_vegetation_source_reuse.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  reuse-six-real-80y-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original pinned numerical dependencies
        run: python -m pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.3 scikit-learn==1.7.2
      - name: Test complete 144-class source and original paired 64-rate prior controls
        run: |
          python -m unittest discover -s research/scripts -p 'test_summarize_vegetation_cross_ontogeny_abc.py' -v
      - name: Download six already successful actual 80-year biological model source shards
        uses: actions/download-artifact@v4
        with:
          run-id: 41184627221
          pattern: frogcs-crossveg-*-64
          merge-multiple: true
          github-token: ${{ github.token }}
          path: research/results/macro_vegetation_cross_ontogeny_20261031
      - name: Download original verified 256-parameter full vegetation source for strict matched-rate replay
        uses: actions/download-artifact@v4
        with:
          run-id: 41183066399
          pattern: frogcs-native-full256-vegetation-SF*-L*
          merge-multiple: true
          github-token: ${{ github.token }}
          path: research/results/macro_intrinsic_factorial_abc_20261031
      - name: Aggregate actual 144 plant/ontogeny/handling source-model sign outputs with 999 whole-rate bootstraps
        run: |
          python -u research/scripts/summarize_vegetation_cross_ontogeny_abc.py --run \
            --original-full256 research/results/macro_intrinsic_factorial_abc_20261031 \
            --bootstrap 999
      - name: Audit 18,432 actual 80-year sources, 64 original shared rate IDs and plant × stage outcome groups
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import numpy as np
          import pandas as pd
          p=Path('research/results/macro_vegetation_cross_ontogeny_20261031')
          cls=pd.read_csv(p/'cross_ontogeny_144class_abc.csv')
          axis=pd.read_csv(p/'cross_ontogeny_factor_marginals.csv')
          ctx=pd.read_csv(p/'cross_ontogeny_context_plant_shares.csv')
          pair=pd.read_csv(p/'cross_ontogeny_vegetation_paired_effects.csv')
          rc=json.loads((p/'cross_ontogeny_abc_receipt.json').read_text())
          assert len(cls)==288 and cls.groupby('scale').structure_id.nunique().eq(144).all()
          assert cls.groupby('scale').conditional_model_share.sum().between(.999999,1.000001).all()
          assert len(pair)==48 and pair.n_independent_draws.eq(64).all()
          assert len(ctx)==144 and len(axis)>=40
          assert rc['n_actual_80year_runs']==18432
          assert rc['original_256_vegetation_replay']['n_paired_sources']==3072
          assert max(rc['original_256_vegetation_replay']['numerical_contrast_max_errors'].values())<1e-8
          print('CROSS_PLANT_80Y_144CLASS_ABC_SOURCE_REUSE_SUCCESS')
          PY
      - name: Print full model-native source evidence
        run: |
          for file in cross_ontogeny_factor_marginals.csv cross_ontogeny_vegetation_paired_effects.csv cross_ontogeny_context_plant_shares.csv; do
            echo "===== $file ====="
            cat "research/results/macro_vegetation_cross_ontogeny_20261031/$file"
          done
      - name: Preserve full confirmed ABC/source rates, 999 paired CIs and original matching receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-crossveg-144class-80year-abc-source-reuse-20261031
          path: research/results/macro_vegetation_cross_ontogeny_20261031/
          retention-days: 30
          if-no-files-found: warn
