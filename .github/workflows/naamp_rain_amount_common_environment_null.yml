name: NAAMP rain-amount common-environment null

on:
  push:
    branches: [main]
    paths:
      - exploration/NAAMP_RAIN_AMOUNT_COMMON_ENVIRONMENT_NULL_CONTRACT_V0_1.json
      - exploration/run_naamp_rain_amount_common_environment_null.py
      - .github/workflows/naamp_rain_amount_common_environment_null.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naamp-rain-amount-common-environment-null
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q icechunk xarray zarr numpy pandas scipy statsmodels patsy timezonefinder 'numcodecs[pcodec]'
      - name: Run fixed rain-amount common-environment null
        run: python exploration/run_naamp_rain_amount_common_environment_null.py
      - name: Validate receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("exploration/NAAMP_RAIN_AMOUNT_COMMON_ENVIRONMENT_NULL_RECEIPT_V0_1.json")
          x=json.loads(p.read_text())
          assert x["coverage"]["prior_history_pairs"]==2916
          assert x["coverage"]["weather_prior_history_pairs"]>=2700
          assert x["decision"] in {
              "rain_amount_common_environment_sufficient",
              "residual_dependence_beyond_rain_amount_common_environment"
          }
          print(json.dumps({
              "coverage":x["coverage"],
              "decision":x["decision"],
              "linear":x["same_sample_existing_linear_comparator"],
              "rain_amount":x["rain_amount_common_environment_null"],
              "comparison":x["comparison"]
          },indent=2))
          PY
      - name: Commit receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exploration/NAAMP_RAIN_AMOUNT_COMMON_ENVIRONMENT_NULL_RECEIPT_V0_1.json
          if git diff --cached --quiet; then
            echo "Receipt unchanged"
          else
            git commit -m "Record rain-amount common-environment null result"
            git push origin HEAD:main
          fi
