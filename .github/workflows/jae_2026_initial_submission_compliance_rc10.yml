name: JAE 2026 initial-submission compliance audit RC10
on:
  push:
    branches:
      - release/jae-v1-rc10
    paths:
      - "MANUSCRIPT_JAE_V1_2.md"
      - "SUPPORTING_INFORMATION_JAE_RC10_V0_1.md"
      - "submission/COVER_LETTER_JAE_V0_13.md"
      - "JAE_TITLE_PAGE_V0_8.template.md"
      - "scripts/audit_jae_initial_submission_rc10_2026.py"
      - ".github/workflows/jae_2026_initial_submission_compliance_rc10.yml"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/audit_jae_initial_submission_rc10_2026.py
