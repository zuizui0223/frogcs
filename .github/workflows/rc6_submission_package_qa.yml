name: frogcs RC6 submission package QA

on:
  push:
    branches:
      - revision/community-metacommunity-synthesis-v1
    paths:
      - "MANUSCRIPT_JAE_V0_8.md"
      - "ECOLOGICAL_CLAIM_BOUNDARY_V0_3.json"
      - "COMMUNITY_ECOLOGY_ARGUMENT_SPINE_V0_1.md"
      - "NAAMP_MATRIX_DENSITY_INVARIANCE_SUMMARY_V0_1.json"
      - "ECOLOGICAL_FIGURE_HASHES_V0_3.json"
      - "figures_ecology_v0_8/**"
      - "JAE_TITLE_PAGE_V0_5.template.md"
      - "submission/COVER_LETTER_JAE_V0_6.md"
      - "submission/JAE_PORTAL_CHECKLIST_V0_5.md"
      - "submission/SUBMISSION_HANDOFF_RC6.md"
      - "submission/SUBMISSION_METADATA_TEMPLATE_V0_3.yml"
      - "submission/CITATION_V0_2.cff.template"
      - "scripts/audit_rc6_submission_package.py"
      - "scripts/audit_jae_v0_8_metacommunity.py"
      - "scripts/verify_metacommunity_figure_hashes_v0_3.py"
      - ".github/workflows/rc6_submission_package_qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run RC6 package audit
        run: python scripts/audit_rc6_submission_package.py
