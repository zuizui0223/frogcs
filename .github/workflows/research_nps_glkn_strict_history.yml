name: NPS GLKN prior frog chorus sites (external data)

on:
  push:
    branches:
      - research/stage-structured-interactions-2026-10-25
    paths:
      - research/scripts/nps_glkn_strict_history.py
      - .github/workflows/research_nps_glkn_strict_history.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install quantitative dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'pandas>=2.1,<3'
      - name: Download pinned NPS public source and fit predeclared strict-prior tests
        run: |
          python research/scripts/nps_glkn_strict_history.py \
            --out research/results/nps_glkn_history \
            --bootstrap 2000
      - name: Archive source-free derived outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nps-strict-history-observed-results
          path: research/results/nps_glkn_history/observed_results.json
          if-no-files-found: error
