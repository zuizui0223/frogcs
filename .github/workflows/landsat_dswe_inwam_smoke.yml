name: Landsat DSWE INWAM COG smoke
on:
  push:
    branches: [remotesensing/naamp-dynamic-hydrology-v1]
    paths:
      - ".github/workflows/landsat_dswe_inwam_smoke.yml"
      - "scripts/remotesensing/smoke_landsat_dswe_inwam.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check numpy rasterio
      - run: python scripts/remotesensing/smoke_landsat_dswe_inwam.py
