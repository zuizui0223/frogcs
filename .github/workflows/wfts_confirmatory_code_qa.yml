name: WFTS confirmatory code QA

on:
  push:
    branches: [revision/pulse-template-synthesis-v1]
    paths:
      - revision/WFTS_CANONICAL_SCHEMA_V0_2.json
      - revision/WFTS_WEATHER_AND_ANALYSIS_SPEC_V0_4.md
      - revision/WFTS_RAW_DATA_INTAKE_PROTOCOL_V0_1.md
      - scripts/wfts/intake_wfts_files.py
      - scripts/wfts/preflight_wfts_structure.py
      - scripts/wfts/run_wfts_confirmatory_analysis_v0_4.py
      - scripts/wfts/generate_synthetic_wfts_fixture.py
      - .github/workflows/wfts_confirmatory_code_qa.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: wfts-confirmatory-code-qa-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions: {contents: read}

jobs:
  synthetic-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels
      - name: Generate artificial WFTS fixture
        run: |
          python scripts/wfts/generate_synthetic_wfts_fixture.py --outdir build/wfts-synthetic

      - name: Intake artificial files without reading response values
        run: |
          python scripts/wfts/intake_wfts_files.py             build/wfts-synthetic/runs.csv             build/wfts-synthetic/matrix.csv             --source synthetic_QA             --transport local_fixture             --output build/wfts-synthetic/intake.json

      - name: Audit outcome-blind intake receipt
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          x=json.loads(Path("build/wfts-synthetic/intake.json").read_text())
          assert x["response_values_inspected"] is False
          assert len(x["files"])==2
          by={r["name"]:r for r in x["files"]}
          for name in ("runs.csv","matrix.csv"):
              p=Path("build/wfts-synthetic")/name
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              assert by[name]["sha256"]==h
              assert by[name]["size"]==p.stat().st_size
              assert by[name]["text"]["text_readable"] is True
              assert by[name]["text"]["header"]
          assert "taxon_key" in by["matrix.csv"]["text"]["header"]
          assert "call_index" in by["matrix.csv"]["text"]["header"]
          print({"status":"PASS","files":list(by)})
          PY

      - name: Run outcome-blind structural preflight
        run: |
          python scripts/wfts/preflight_wfts_structure.py             --runs build/wfts-synthetic/runs.csv             --matrix build/wfts-synthetic/matrix.csv             --output build/wfts-synthetic/preflight.json
      - name: Audit preflight before response analysis
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("build/wfts-synthetic/preflight.json").read_text())
          assert x["response_columns_read"] is False
          assert x["call_index_read"] is False
          assert x["taxon_key_read"] is False
          assert x["coverage"]["gate_pass"] is True
          assert x["coverage"]["principal_routes"]==30
          assert x["coverage"]["principal_history_pairs"]==540
          assert x["coverage"]["routes_by_fold"]=={"A":15,"B":15}
          print({"status":"PASS","coverage":x["coverage"]})
          PY
      - name: Run frozen confirmatory core on synthetic data only
        run: |
          python scripts/wfts/run_wfts_confirmatory_analysis_v0_4.py             --runs build/wfts-synthetic/runs.csv             --matrix build/wfts-synthetic/matrix.csv             --preflight-receipt build/wfts-synthetic/preflight.json             --output build/wfts-synthetic/confirmatory.json
      - name: Audit code path without asserting ecological direction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("build/wfts-synthetic/confirmatory.json").read_text())
          assert x["coverage"]["gate_pass"] is True
          assert x["response_endpoints_read"] is True
          assert x["simulation_replicates"]==1000
          assert x["seed"]==2840223
          assert x["preflight_verified"] is True
          assert x["analysis"]=="wfts_prospective_within_taxon_concentration_v0_4"
          assert set(x["observed"])=={
              "route_new_taxon_beta","extra_stop_beta","within_taxon_concentration_beta"
          }
          t=x["principal_comparator"]
          for k in ["predicted_concentration_beta","observed_conditional_residual","null_residual_ci95","upper_tail_p","pass"]:
              assert k in t,k
          assert x["decision"] in {"replication_support","replication_not_supported"}
          print({
              "status":"PASS",
              "decision_is_not_a_QA_gate":x["decision"],
              "p":t["upper_tail_p"],
          })
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wfts-confirmatory-synthetic-qa
          path: |
            build/wfts-synthetic/intake.json
            build/wfts-synthetic/preflight.json
            build/wfts-synthetic/confirmatory.json
          if-no-files-found: error
