name: JAE initial-submission compliance audit
on:
  push:
    branches:
      - cleanup/provenance-prune-v1
      - cleanup/deep-structure-v1
      - fix/rc11-submission-clean-copyedit-v1
      - main
      - release/jae-v1-rc11
      - submission/jae-v1
    paths:
      - "MANUSCRIPT_JAE_V1_3.md"
      - "SUPPORTING_INFORMATION_JAE_RC11_V0_1.md"
      - "provenance/summaries/NAAMP_SAME_OBSERVER_ROBUSTNESS_SUMMARY_V0_1.json"
      - "submission/COVER_LETTER_JAE_V0_13.md"
      - "JAE_TITLE_PAGE_V0_8.template.md"
      - "scripts/qa/audit_jae_initial_submission_rc11_2026.py"
      - ".github/workflows/jae_initial_submission_compliance.yml"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/qa/audit_jae_initial_submission_rc11_2026.py
