name: DSWEmod v0.2 reuse extracted years

on:
  push:
    branches:
      - remotesensing/naamp-dynamic-hydrology-v1
    paths:
      - ".github/workflows/dswemod_v02_reuse_extracted.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  aggregate_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy pandas scipy statsmodels patsy
      - name: Reuse source-available year artifacts from frozen v0.2 extraction
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37613989451
          pattern: dswemod-year-*
          path: remotesensing/dswemod_inputs
          merge-multiple: true
      - name: Aggregate source-available DSWEmod and freeze coverage
        env:
          DSWEMOD_YEAR_DIR: remotesensing/dswemod_inputs
        run: python scripts/remotesensing/aggregate_naamp_dswemod.py
      - name: Run latest frozen DSWEmod M0-M3 mechanism
        env:
          NAAMP_DSWEMOD_CSV: remotesensing/NAAMP_DSWEMOD_RUN_SITE_METRICS_V0_1.csv
        run: python scripts/remotesensing/run_naamp_dswemod_mechanism.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-dswemod-v02-reuse-result
          path: |
            remotesensing/NAAMP_DSWEMOD_RUN_SITE_METRICS_V0_1.csv
            remotesensing/NAAMP_DSWEMOD_COVERAGE_V0_1.json
            remotesensing/NAAMP_DSWEMOD_MECHANISM_RECEIPT_V0_1.json
          retention-days: 30
