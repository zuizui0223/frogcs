name: WFTS frozen full-chain QA

on:
  push:
    branches: [main]
    paths:
      - "revision/WFTS_REAL_DATA_EXECUTION_LOCK_V0_1.json"
      - "revision/WFTS_REAL_DATA_EXECUTION_HANDOFF_V0_1.md"
      - "revision/WFTS_CONFIRMATORY_AUTHORITY_V0_4.md"
      - "revision/WFTS_CANONICAL_SCHEMA_V0_2.json"
      - "revision/WFTS_PROSPECTIVE_COMMON_ENVIRONMENT_DIAGNOSTIC_V0_2.json"
      - "revision/WFTS_PROSPECTIVE_DEEP_TEMPLATE_ALIGNMENT_V0_1.json"
      - "scripts/wfts/preflight_wfts_structure.py"
      - "scripts/wfts/run_wfts_confirmatory_analysis_v0_5.py"
      - "scripts/wfts/run_wfts_secondary_route_night_diagnostics_v0_2.py"
      - "scripts/wfts/run_wfts_deep_template_alignment_v0_1.py"
      - "scripts/wfts/generate_synthetic_wfts_fixture.py"
      - "scripts/wfts/generate_synthetic_common_environment_runs.py"
      - ".github/workflows/wfts_full_chain_qa.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {contents: read}

concurrency:
  group: wfts-frozen-full-chain-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  full-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy

      - name: Verify byte-level real-data authority lock
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          lock=json.loads(Path("revision/WFTS_REAL_DATA_EXECUTION_LOCK_V0_1.json").read_text())
          bad=[]
          for path,expected in lock["files"].items():
              got=subprocess.check_output(["git","hash-object",path],text=True).strip()
              if got!=expected:
                  bad.append((path,expected,got))
          if bad:
              raise SystemExit("authority drift: "+repr(bad))
          print({"status":"PASS","lock_id":lock["lock_id"],"n_locked_files":len(lock["files"])})
          PY

      - name: Generate one synthetic WFTS response fixture
        run: python scripts/wfts/generate_synthetic_wfts_fixture.py --outdir build/wfts-full-chain

      - name: Run response-blind structural preflight
        run: |
          python scripts/wfts/preflight_wfts_structure.py \
            --runs build/wfts-full-chain/runs.csv \
            --matrix build/wfts-full-chain/matrix.csv \
            --output build/wfts-full-chain/preflight.json

      - name: Freeze-check preflight boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("build/wfts-full-chain/preflight.json").read_text())
          assert x["response_columns_read"] is False
          assert x["taxon_key_read"] is False
          assert x["call_index_read"] is False
          assert x["coverage"]["gate_pass"] is True
          assert x["coverage"]["principal_routes"]==30
          assert x["coverage"]["principal_history_pairs"]==540
          assert x["coverage"]["routes_by_fold"]=={"A":15,"B":15}
          print({"status":"PASS","coverage":x["coverage"]})
          PY

      - name: Run frozen primary exactly once
        run: |
          python scripts/wfts/run_wfts_confirmatory_analysis_v0_5.py \
            --runs build/wfts-full-chain/runs.csv \
            --matrix build/wfts-full-chain/matrix.csv \
            --preflight-receipt build/wfts-full-chain/preflight.json \
            --output build/wfts-full-chain/primary.json

      - name: Create response-free common-environment covariates
        run: |
          python scripts/wfts/generate_synthetic_common_environment_runs.py \
            --runs build/wfts-full-chain/runs.csv \
            --output-runs build/wfts-full-chain/common_env_runs.csv \
            --receipt build/wfts-full-chain/common_env_receipt.json

      - name: Run frozen common-environment and route-night secondary
        run: |
          python scripts/wfts/run_wfts_secondary_route_night_diagnostics_v0_2.py \
            --runs build/wfts-full-chain/runs.csv \
            --matrix build/wfts-full-chain/matrix.csv \
            --preflight-receipt build/wfts-full-chain/preflight.json \
            --primary-result build/wfts-full-chain/primary.json \
            --common-env-runs build/wfts-full-chain/common_env_runs.csv \
            --common-env-receipt build/wfts-full-chain/common_env_receipt.json \
            --output build/wfts-full-chain/secondary.json

      - name: Run frozen recurrent-site/deep-placement secondary
        run: |
          python scripts/wfts/run_wfts_deep_template_alignment_v0_1.py \
            --runs build/wfts-full-chain/runs.csv \
            --matrix build/wfts-full-chain/matrix.csv \
            --preflight-receipt build/wfts-full-chain/preflight.json \
            --primary-result build/wfts-full-chain/primary.json \
            --common-env-runs build/wfts-full-chain/common_env_runs.csv \
            --common-env-receipt build/wfts-full-chain/common_env_receipt.json \
            --secondary-result build/wfts-full-chain/secondary.json \
            --output build/wfts-full-chain/deep_recurrent_site.json

      - name: Audit complete frozen chain without ecological-direction assertions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          pre=json.loads(Path("build/wfts-full-chain/preflight.json").read_text())
          pri=json.loads(Path("build/wfts-full-chain/primary.json").read_text())
          sec=json.loads(Path("build/wfts-full-chain/secondary.json").read_text())
          deep=json.loads(Path("build/wfts-full-chain/deep_recurrent_site.json").read_text())

          assert pri["analysis"]=="wfts_prospective_within_taxon_concentration_v0_5"
          assert pri["preflight_verified"] is True
          assert pri["response_endpoints_read"] is True
          assert pri["decision"] in {
              "replication_support",
              "informative_nonreplication_of_half_discovery_effect",
              "inconclusive_nonpass",
          }

          assert sec["status"]=="prospective_secondary_executed_after_primary"
          assert sec["primary_decision"]==pri["decision"]
          assert sec["primary_replication_classification_unchanged"] is True
          assert sec["coverage"]["pairs"]==pre["coverage"]["principal_history_pairs"]
          assert sec["coverage"]["routes"]==pre["coverage"]["principal_routes"]
          assert sec["interpretation_boundary"]["secondary_can_rescue_or_retune_primary"] is False

          assert deep["analysis"]=="wfts_prospective_deep_template_alignment_v0_1"
          assert deep["coverage"]["pairs"]==pre["coverage"]["principal_history_pairs"]
          assert deep["coverage"]["routes"]==pre["coverage"]["principal_routes"]
          assert deep["decision"] in {
              "template_link_support",
              "template_link_non_support",
              "inconclusive_secondary_template_link",
          }
          assert deep["interpretation_boundary"]["can_change_primary_replication_classification"] is False

          # The synthetic fixture may yield any allowed scientific classification.
          # QA validates execution order and guards only.
          print({
              "status":"PASS",
              "primary_decision_is_not_qa_gate":pri["decision"],
              "secondary_primary_unchanged":sec["primary_replication_classification_unchanged"],
              "deep_decision_is_not_qa_gate":deep["decision"],
              "coverage":pre["coverage"],
          })
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: wfts-frozen-full-chain-synthetic-qa
          path: |
            build/wfts-full-chain/preflight.json
            build/wfts-full-chain/primary.json
            build/wfts-full-chain/common_env_receipt.json
            build/wfts-full-chain/secondary.json
            build/wfts-full-chain/deep_recurrent_site.json
          if-no-files-found: error
