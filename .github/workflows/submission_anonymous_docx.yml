name: frogcs JAE anonymous DOCX
on:
  push:
    branches:
      - cleanup/deep-structure-v1
      - fix/rc11-submission-clean-copyedit-v1
      - revision/rc10-reviewer-defense-v1
      - release/jae-v1-rc11
      - main
      - submission/jae-v1
    paths:
      - "MANUSCRIPT_JAE_V1_3.md"
      - "SUPPORTING_INFORMATION_JAE_RC11_V0_1.md"
      - "scripts/submission/build_jae_anonymous_docx.py"
      - "scripts/qa/audit_rc11_submission_package.py"
      - ".github/workflows/submission_anonymous_docx.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q python-docx==1.2.0
      - run: python scripts/qa/audit_rc11_submission_package.py
      - name: Build anonymous RC11 main DOCX
        run: python scripts/submission/build_jae_anonymous_docx.py --source MANUSCRIPT_JAE_V1_3.md --output build/FROG_JAE_ANON_MAIN.docx
      - name: Build anonymous RC11 SI DOCX
        run: python scripts/submission/build_jae_anonymous_docx.py --source SUPPORTING_INFORMATION_JAE_RC11_V0_1.md --output build/FROG_JAE_SUPPORTING_INFORMATION.docx
      - name: Verify RC11 anonymous DOCX
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re
          p=Path("build/FROG_JAE_ANON_MAIN.docx")
          s=Path("build/FROG_JAE_SUPPORTING_INFORMATION.docx")
          assert p.is_file() and p.stat().st_size>10000
          assert s.is_file() and s.stat().st_size>10000
          with ZipFile(p) as z:
              doc=z.read("word/document.xml").decode("utf-8")
              core=z.read("docProps/core.xml").decode("utf-8")
              footer=z.read("word/footer1.xml").decode("utf-8")
          with ZipFile(s) as z:
              sidoc=z.read("word/document.xml").decode("utf-8")
              sicore=z.read("docProps/core.xml").decode("utf-8")
          for x in [
              "more boundary-biased than uniform activation predicts",
              "3,152 same-observer pairs",
              "a null allowing species-specific shifts",
              "92.0% boundary crossing",
          ]:
              assert x in doc,x
          for x in ["Same-observer sensitivity","3,152 of 4,236 pairs","observer robust"]:
              assert x.lower() in sidoc.lower(),x
          assert not re.search(r"\\bRC\\d+\\b",doc+sidoc)
          assert "readback" not in (doc+sidoc).lower()
          assert "<w:lnNumType" in doc
          assert "PAGE" in footer
          assert not re.search(r"<dc:creator>[^<]+</dc:creator>",core)
          assert not re.search(r"<dc:creator>[^<]+</dc:creator>",sicore)
          print({"status":"PASS","main_bytes":p.stat().st_size,"si_bytes":s.stat().st_size})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frogcs-jae-anonymous-docx
          path: |
            build/FROG_JAE_ANON_MAIN.docx
            build/FROG_JAE_SUPPORTING_INFORMATION.docx
          if-no-files-found: error
