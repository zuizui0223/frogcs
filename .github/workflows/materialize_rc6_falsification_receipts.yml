name: frogcs materialize RC6 falsification receipts

on:
  push:
    branches:
      - revision/activation-geometry-placebo-gate-v1
    paths:
      - ".github/workflows/materialize_rc6_falsification_receipts.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frogcs-materialize-rc6-falsification-receipts
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revision/activation-geometry-placebo-gate-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - name: Re-run frozen falsification analyses
        run: |
          set -eu
          python scripts/run_naamp_hydroperiod_filter.py > /tmp/hydro.log
          python scripts/run_naamp_breeding_season_filter.py > /tmp/breeding-filter.log
          python scripts/run_naamp_breeding_season_breadth.py > /tmp/breeding-breadth.log
          python scripts/run_naamp_context_dependent_pulse.py > /tmp/context.log
          python scripts/audit_dry_dry_background_estimability.py > /tmp/dry-dry.log
          python scripts/run_naamp_species_response_within_genus.py > /tmp/within-genus.log
          python scripts/run_naamp_crossperiod_episodic_recruitment.py > /tmp/episodic.log
          python scripts/run_naamp_latent_spatial_heterogeneity.py > /tmp/latent.log
      - name: Verify expected receipts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          expected=[
            "NAAMP_HYDROPERIOD_FILTER_RECEIPT_V0_1.json",
            "NAAMP_BREEDING_SEASON_FILTER_RECEIPT_V0_1.json",
            "NAAMP_BREEDING_SEASON_BREADTH_RECEIPT_V0_1.json",
            "NAAMP_CONTEXT_DEPENDENT_PULSE_RECEIPT_V0_1.json",
            "DRY_DRY_BACKGROUND_ESTIMABILITY_AUDIT_RECEIPT_V0_1.json",
            "NAAMP_SPECIES_RESPONSE_WITHIN_GENUS_RECEIPT_V0_1.json",
            "NAAMP_CROSSPERIOD_EPISODIC_RECRUITMENT_RECEIPT_V0_1.json",
            "NAAMP_LATENT_SPATIAL_HETEROGENEITY_RECEIPT_V0_1.json",
          ]
          for name in expected:
              p=Path(name)
              assert p.is_file() and p.stat().st_size>100, name
              json.loads(p.read_text(encoding="utf-8"))
          # Frozen headline checks against audit summaries / known endpoints.
          assert json.loads(Path("NAAMP_HYDROPERIOD_FILTER_RECEIPT_V0_1.json").read_text())["primary"]["estimable"] is False
          assert abs(json.loads(Path("NAAMP_BREEDING_SEASON_FILTER_RECEIPT_V0_1.json").read_text())["primary"]["p_value"]-0.8233808701505375)<1e-12
          assert abs(json.loads(Path("NAAMP_BREEDING_SEASON_BREADTH_RECEIPT_V0_1.json").read_text())["primary"]["p_value"]-0.9864546047783768)<1e-12
          assert abs(json.loads(Path("NAAMP_CONTEXT_DEPENDENT_PULSE_RECEIPT_V0_1.json").read_text())["primary_richness_interaction"]["p_value"]-0.8554404547640997)<1e-12
          assert json.loads(Path("DRY_DRY_BACKGROUND_ESTIMABILITY_AUDIT_RECEIPT_V0_1.json").read_text())["total_dry_runs"]==338
          print("receipt materialization verification PASS")
          PY
      - name: Commit receipts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             NAAMP_HYDROPERIOD_FILTER_RECEIPT_V0_1.json             NAAMP_BREEDING_SEASON_FILTER_RECEIPT_V0_1.json             NAAMP_BREEDING_SEASON_BREADTH_RECEIPT_V0_1.json             NAAMP_CONTEXT_DEPENDENT_PULSE_RECEIPT_V0_1.json             DRY_DRY_BACKGROUND_ESTIMABILITY_AUDIT_RECEIPT_V0_1.json             NAAMP_SPECIES_RESPONSE_WITHIN_GENUS_RECEIPT_V0_1.json             NAAMP_CROSSPERIOD_EPISODIC_RECRUITMENT_RECEIPT_V0_1.json             NAAMP_LATENT_SPATIAL_HETEROGENEITY_RECEIPT_V0_1.json
          if git diff --cached --quiet; then
            echo "receipts already materialized"
            exit 0
          fi
          git commit -m "Materialize RC6 falsification receipts"
          git push origin HEAD:revision/activation-geometry-placebo-gate-v1
