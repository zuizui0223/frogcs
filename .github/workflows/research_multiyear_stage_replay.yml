name: Research multiyear stage feedback replay
on:
  pull_request:
    paths:
      - 'research/scripts/*multiyear_stage*'
      - 'research/scripts/stage_vegetation_network.py'
      - 'research/scripts/*source_gradient.py'
      - 'research/results/multiyear_stage_network_20261026/**'
      - '.github/workflows/research_multiyear_stage_replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  multiyear-stage-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy==2.2.6 pandas==2.3.3
      - run: python -m unittest discover -s research/scripts -p test_multiyear_stage_network.py
      - run: python -m unittest discover -s research/scripts -p test_source_gradient.py
      - run: python research/scripts/multiyear_stage_network.py --out /tmp/multiyear-replay
      - name: Compare every saved numerical table
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd
          saved=Path('research/results/multiyear_stage_network_20261026')
          replay=Path('/tmp/multiyear-replay')
          for p in sorted(saved.glob('*.csv*')):
              pd.testing.assert_frame_equal(pd.read_csv(p),pd.read_csv(replay/p.name),
                                            check_exact=False,rtol=1e-9,atol=1e-11)
              print('PASS',p.name)
          d=json.loads((replay/'synthetic_results.json').read_text())
          assert d['scenarios']==864
          assert d['local_return_zero_max_F_effect']==0
          print('PASS scenarios and fixed-input control')
          PY
      - run: python research/scripts/verify_macro_snapshot.py
