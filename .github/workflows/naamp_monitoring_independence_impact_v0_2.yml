name: NAAMP monitoring independence impact v0.2

on:
  push:
    branches: [main]
    paths:
      - exploration/NAAMP_MONITORING_INDEPENDENCE_IMPACT_CONTRACT_V0_2.json
      - exploration/run_naamp_monitoring_independence_impact_v0_2.py
      - .github/workflows/naamp_monitoring_independence_impact_v0_2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naamp-monitoring-independence-v0-2
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q icechunk xarray zarr numpy pandas scipy statsmodels patsy timezonefinder 'numcodecs[pcodec]'
      - name: Run fixed v0.2 monitoring diagnostic
        run: python exploration/run_naamp_monitoring_independence_impact_v0_2.py
      - name: Validate receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("exploration/NAAMP_MONITORING_INDEPENDENCE_IMPACT_RECEIPT_V0_2.json")
          x=json.loads(p.read_text())
          assert x["coverage"]["pairs"]==2835, x["coverage"]
          assert x["specieswise"]["summary"]["estimable_species"]>0
          print(json.dumps({
            "pooled_ratios":x["pooled"]["ratios"],
            "specieswise_summary":x["specieswise"]["summary"],
            "decision":x["decision"]
          },indent=2))
          PY
      - name: Commit receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exploration/NAAMP_MONITORING_INDEPENDENCE_IMPACT_RECEIPT_V0_2.json
          if git diff --cached --quiet; then
            echo "Receipt unchanged"
          else
            git commit -m "Record monitoring-independence v0.2 result"
            git push origin HEAD:main
          fi
