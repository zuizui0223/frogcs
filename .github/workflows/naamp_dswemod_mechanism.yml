name: NAAMP DSWEmod mechanism

on:
  push:
    branches:
      - remotesensing/naamp-dynamic-hydrology-v1
    paths:
      - ".github/workflows/naamp_dswemod_mechanism.yml"
      - "scripts/remotesensing/extract_naamp_dswemod_year.py"
      - "scripts/remotesensing/aggregate_naamp_dswemod.py"
      - "scripts/remotesensing/run_naamp_dswemod_mechanism.py"
      - "revision/NAAMP_MODIS_DSWEMOD_MECHANISM_CONTRACT_V0_1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    strategy:
      fail-fast: false
      matrix:
        year: [2003,2004,2005,2006,2007,2008,2009,2010,2011,2012,2013,2014,2015]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy pandas scipy statsmodels patsy rasterio
      - name: Extract DSWEmod year
        env:
          DSWEMOD_YEAR: ${{ matrix.year }}
        run: python scripts/remotesensing/extract_naamp_dswemod_year.py
      - uses: actions/upload-artifact@v4
        with:
          name: dswemod-year-${{ matrix.year }}
          path: |
            remotesensing/dswemod_years/NAAMP_DSWEMOD_*.csv
            remotesensing/dswemod_years/NAAMP_DSWEMOD_*.json
          retention-days: 7

  aggregate_and_test:
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy pandas scipy statsmodels patsy
      - uses: actions/download-artifact@v4
        with:
          pattern: dswemod-year-*
          path: remotesensing/dswemod_inputs
          merge-multiple: true
      - name: Aggregate DSWEmod and freeze coverage
        env:
          DSWEMOD_YEAR_DIR: remotesensing/dswemod_inputs
        run: python scripts/remotesensing/aggregate_naamp_dswemod.py
      - name: Run frozen DSWEmod mechanism test
        env:
          NAAMP_DSWEMOD_CSV: remotesensing/NAAMP_DSWEMOD_EXPOSURES_V0_1.csv
        run: python scripts/remotesensing/run_naamp_dswemod_mechanism.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-dswemod-mechanism
          path: |
            remotesensing/NAAMP_DSWEMOD_EXPOSURES_V0_1.csv
            remotesensing/NAAMP_DSWEMOD_COVERAGE_V0_1.json
            remotesensing/NAAMP_DSWEMOD_MECHANISM_RECEIPT_V0_1.json
          retention-days: 30
