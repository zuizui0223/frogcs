name: PEM wetlands frog salamander dragonfly staged network synthetic QA
on:
  push:
    branches:
      - research/stage-structured-interactions-2026-10-25
    paths:
      - research/scripts/simulate_pem_three_guild_stage_balance.py
      - .github/workflows/research_pem_stage_triads_synthetic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  triad:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numeric dependency
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3'
      - name: Verify cohort mismatch, PEM water windows and stage overlap synthetic invariants
        run: python research/scripts/simulate_pem_three_guild_stage_balance.py --self-test
      - name: Sweep exact synthetic baseline through PEM1A, PEM1C, PEM1F wetland scenarios
        run: |
          python research/scripts/simulate_pem_three_guild_stage_balance.py \
            --out research/results/pem_three_guild_stage_balance
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: synthetic-pem-three-guild-ontogenetic-network
          path: research/results/pem_three_guild_stage_balance/
          if-no-files-found: error
