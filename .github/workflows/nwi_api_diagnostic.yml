name: NWI API diagnostic
on:
  push:
    branches:
      - exploration/nwi-api-diagnostic-v1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python exploration/audit_nwi_api_variants.py
      - uses: actions/upload-artifact@v4
        with:
          name: nwi-api-diagnostic-v0-1
          path: exploration/NWI_API_DIAGNOSTIC_RECEIPT_V0_1.json
          if-no-files-found: error
