name: root JSON provenance migration QA

on:
  push:
    branches:
      - cleanup/root-json-provenance-v1
    paths:
      - "provenance/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "submission/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install submission build dependencies
        run: python -m pip install --disable-pip-version-check -q python-docx==1.2.0 PyYAML==6.0.2 numpy pandas scipy statsmodels patsy
      - name: Repository structure QA
        run: python scripts/audit_repository_structure.py
      - name: Scientific submission package QA
        run: python scripts/audit_rc11_submission_package.py
      - name: JAE compliance QA
        run: python scripts/audit_jae_initial_submission_rc11_2026.py
      - name: Build anonymous submission DOCX
        run: |
          python scripts/build_jae_anonymous_docx.py --source MANUSCRIPT_JAE_V1_3.md --output /tmp/Manuscript.docx
          python scripts/build_jae_anonymous_docx.py --source SUPPORTING_INFORMATION_JAE_RC11_V0_1.md --output /tmp/Supporting_Information.docx
      - name: Verify no stale root JSON references in active workflows
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path(".")
          m=json.loads(Path("provenance/ROOT_JSON_MIGRATION_MANIFEST.json").read_text())
          stale={}
          for p in list(Path("scripts").glob("*.py"))+list(Path(".github/workflows").glob("*.yml")):
              t=p.read_text(encoding="utf-8")
              bad=[old for old,target in m["mapping"].items() if old in t and target not in t]
              if bad: stale[str(p)]=bad
          assert not stale, stale
          assert not list(root.glob("*.json"))
          print({"status":"PASS","root_json":0,"moved":m["moved_json_files"]})
          PY
