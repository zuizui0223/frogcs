name: soil moisture generality
on:
  push:
    branches: [exploration/soil-moisture-generality-v2]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy xarray icechunk timezonefinder "numcodecs[pcodec]"
      - run: python -m compileall -q exploration scripts
      - run: python exploration/run_naamp_soil_moisture_generality.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-soil-moisture-generality-v0-1
          path: |
            exploration/NAAMP_SOIL_MOISTURE_GENERALITY_CONTRACT_V0_1.json
            exploration/NAAMP_SOIL_MOISTURE_GENERALITY_RECEIPT_V0_1.json
          if-no-files-found: error
