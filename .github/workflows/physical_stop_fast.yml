name: physical stop fast sensitivity

on:
  push:
    branches:
      - exploration/physical-stop-fast-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - run: python -m compileall -q exploration scripts
      - name: Audit physical stop identity
        run: python exploration/run_naamp_physical_stop_identity_audit.py
      - name: Test CallingIndex on physically stable pairs
        run: python exploration/run_naamp_calling_index_physical_stop_sensitivity.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-physical-stop-fast-v0-1
          path: |
            exploration/NAAMP_PHYSICAL_STOP_IDENTITY_AUDIT_CONTRACT_V0_1.json
            exploration/NAAMP_PHYSICAL_STOP_IDENTITY_AUDIT_RECEIPT_V0_1.json
            exploration/NAAMP_CALLING_INDEX_PHYSICAL_STOP_SENSITIVITY_CONTRACT_V0_1.json
            exploration/NAAMP_CALLING_INDEX_PHYSICAL_STOP_SENSITIVITY_RECEIPT_V0_1.json
          if-no-files-found: error
