name: One-off public report coverage page verification
on:
  push:
    branches:
      - audit/iowa-station-waterstate-source-gate-v31
    paths:
      - '.github/workflows/oneoff_source_coverage_pages.yml'
permissions: {}
jobs:
  source-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install fixed PDF renderer
        run: python3 -m pip install 'PyMuPDF==1.26.4'
      - name: Read only two cited public reports and render selected non-coordinate pages
        run: |
          python3 - <<'PY'
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from pathlib import Path
          from hashlib import sha256
          from datetime import datetime, timezone
          import json
          import fitz
          SOURCES = [
              ('bittern_2024', 'https://www.dcceew.gov.au/sites/default/files/documents/investigating-requirements-endangered-australasian-bittern-2024.pdf', 25, [3,7]),
              ('annual_2024_25', 'https://www.dcceew.gov.au/sites/default/files/documents/murrumbidgee-mer-annual-report-2024-25.pdf', 174, [62,73,74,97]),
          ]
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs): return None
          opener = build_opener(NoRedirect)
          out = Path('source_pages'); out.mkdir()
          receipt = {'checked_utc': datetime.now(timezone.utc).isoformat(), 'purpose':'Visual validation of published coverage tables, not new animal observations', 'sources':[], 'raw_acoustic_or_logger_archive_accessed':False}
          for key,url,expected_pages,pages in SOURCES:
              with opener.open(Request(url,headers={'User-Agent':'frogcs-public-report-review/1.0','Accept':'application/pdf'}),timeout=40) as response:
                  raw=response.read(40000001)
                  if response.status!=200 or len(raw)>40000000 or not raw.startswith(b'%PDF-'):
                      raise ValueError('SOURCE_TYPE_SIZE_OR_STATUS')
              doc=fitz.open(stream=raw,filetype='pdf')
              if len(doc)!=expected_pages: raise ValueError('PAGE_COUNT_CHANGED')
              summary={'source_key':key,'url':url,'sha256':sha256(raw).hexdigest(),'bytes':len(raw),'page_count':len(doc),'rendered_zero_based_pages':pages}
              for p in pages:
                  page=doc[p]
                  page.get_pixmap(matrix=fitz.Matrix(1.7,1.7),alpha=False).save(str(out/f'{key}_p{p+1}.png'))
                  (out/f'{key}_p{p+1}.txt').write_text(page.get_text(),encoding='utf-8')
              receipt['sources'].append(summary)
              doc.close(); del raw
          (out/'source_receipt.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(receipt,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cited-public-report-coverage-pages
          path: source_pages/
          if-no-files-found: error
