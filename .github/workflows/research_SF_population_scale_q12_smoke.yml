name: Frogcs q12 population-scale original finite-N and source controls

on:
  push:
    branches:
      - research/SF-predation-population-scale-20261031
    paths:
      - research/scripts/run_SF_predation_population_scale_q12_80y.py
      - research/scripts/test_SF_predation_population_scale_q12.py
      - .github/workflows/research_SF_population_scale_q12_smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-ecological-kernel-and-q12-integers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2'
      - name: Check q12 default equals four explicit hazard edges, zero edge and source mass
        run: |
          python -m unittest discover -s research/scripts -p test_SF_predation_population_scale_q12.py -v
          python -m unittest discover -s research/scripts -p test_SF_only_trophic_network_sufficiency.py -v
