name: frogcs RC10 scientific package QA
on:
  push:
    branches:
      - main
      - release/jae-v1-rc10
      - submission/jae-v1
    paths:
      - "MANUSCRIPT_JAE_V1_2.md"
      - "SUPPORTING_INFORMATION_JAE_RC10_V0_1.md"
      - "submission/COVER_LETTER_JAE_V0_13.md"
      - "submission/NOVELTY_AUDIT_V0_10.md"
      - "submission/REVIEWER_ATTACK_MATRIX_V0_10.md"
      - "submission/SUBMISSION_HANDOFF_RC10.md"
      - "submission/JAE_PORTAL_CHECKLIST_V0_9.md"
      - "submission/RC10_STORY_FREEZE_V0_1.json"
      - "NAAMP_PERSISTENCE_PRESERVING_NULL_SUMMARY_V0_1.json"
      - "README.md"
      - "JAE_TITLE_PAGE_V0_8.template.md"
      - "submission/SUBMISSION_METADATA_TEMPLATE_V0_7.yml"
      - "submission/CITATION_V0_5.cff.template"
      - "submission/HUMAN_FINALIZATION_RC10.md"
      - "figures_ecology_v1_2/**"
      - "scripts/audit_rc10_submission_package.py"
      - ".github/workflows/rc10_submission_package_qa.yml"
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/audit_rc10_submission_package.py
