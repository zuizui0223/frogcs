name: Reconcile complete NAAMP 2001 JRC source shards
on:
  push:
    branches: [research/vegetation-hydrology-feasibility-2026-10]
    paths:
      - ".github/workflows/vegetation_hydrology_jrc_year2001_reconcile.yml"
      - "studies/vegetation_hydrology/scripts/merge_jrc_shards.py"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-original-source-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: studies/vegetation_hydrology
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source-only geospatial dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit-test source shard and missing-pixel gates
        run: python -m unittest discover -s tests -p test_merge_jrc_shards.py -v
      - name: Restore checksum-pinned NAAMP site/date calendar and all 6 source shard archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/qc data/shards data/source-zips
          gh run download 39960918335 --repo zuizui0223/frogcs --name public-NAAMP-outcome-blind-site-frame --dir data/qc
          for shard in 0 1 2 3 4 5; do
            mkdir -p data/shards/$shard
            gh run download 40059404586 --repo zuizui0223/frogcs --name naamp-jrc-2001-shard${shard}-of6-environment-only --dir data/shards/$shard
            zip -q -j data/source-zips/shard${shard}.zip data/shards/$shard/*.csv data/shards/$shard/*.json
          done
      - name: Require exact site-month, source-URL and data-value reconciliation
        run: |
          python scripts/merge_jrc_shards.py \
            --year 2001 \
            --shard-count 6 \
            --shard-dir data/source-zips \
            --coordinates data/qc/accepted_coordinates.csv \
            --site-calendar data/qc/survey_site_calendar.csv \
            --out-dir data/verified-2001
      - name: Preserve full 2001 environmental source provenance and water pixels
        uses: actions/upload-artifact@v4
        with:
          name: naamp-2001-jrc-water-reconciled-42sources-7511site-months
          path: studies/vegetation_hydrology/data/verified-2001/
          if-no-files-found: error
