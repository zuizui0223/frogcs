name: NAAMP frog same-run partner stop conditions sensitivity

on:
  push:
    branches: [exploration/naamp-partner-stop-context-control-2026-10-21]
    paths:
      - ".github/workflows/naamp_same_run_partner_stop_conditions_v0_1.yml"
      - "exploration/run_naamp_partner_stop_conditions_v0_1.py"
      - "exploration/NAAMP_PARTNER_STOP_CONDITIONS_SENSITIVITY_CONTRACT_2026_10_21.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q --disable-pip-version-check numpy pandas scipy statsmodels
      - name: Verify stop-context centering and zero-weight reduction to frozen NWI null
        run: |
          python -m py_compile exploration/run_naamp_partner_stop_conditions_v0_1.py
          python exploration/run_naamp_partner_stop_conditions_v0_1.py --synthetic-only

  empirical:
    needs: synthetic
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q --disable-pip-version-check numpy pandas scipy statsmodels
      - uses: actions/download-artifact@v4
        with:
          name: naamp-nwi-vegetation-sites-validated
          run-id: 39450277196
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/vegetation_context
      - uses: actions/download-artifact@v4
        with:
          name: naamp-nwi-route-crossfit-weighted-checkerboard-v0-1
          run-id: 39516056663
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/nwi_frozen
      - name: Verify immutable full NWI and frozen route-heldout weights
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          z=json.loads(Path("build/vegetation_context/geometry_nwi_preflight.json").read_text())
          assert z["preflight_eligible"] and z["mode"]=="full"
          assert z["overlay"]["site_records"]==5147 and len(z["overlay"]["shards"])==12
          root=Path("build/nwi_frozen")
          for mode in ("any","strong"):
             assert (root/f"{mode}_train_coefficients.json").is_file()
             assert (root/f"{mode}_heldout_run_diagnostics.csv").is_file()
          print("PASS unmodified route-heldout species NWI null and NWI site coordinates")
          PY
      - name: Estimate site temperature noise and position weights on other routes and assess focal shared surveys
        run: |
          python -u exploration/run_naamp_partner_stop_conditions_v0_1.py \
            --frozen-nwi build/nwi_frozen \
            --outdir build/partner_stop_context
      - name: Validate exact frozen populations and inferential guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("build/partner_stop_context/result.json").read_text())
          assert d["synthetic_QA"]["status"]=="PASS"
          assert d["source"]["augmented_10_stop_runs"]==6236
          assert d["modes"]["any"]["coverage"]["original_checked_runs"]==3659
          assert d["modes"]["strong"]["coverage"]["original_checked_runs"]==1766
          for mode in ("any","strong"):
              x=d["modes"][mode]["trios"]
              assert x["Hyla versicolor"]["n"]== (744 if mode=="any" else 171)
              assert x["Anaxyrus fowleri"]["n"]== (538 if mode=="any" else 72)
          assert not d["interpretation_boundaries"]["biological_pairwise_causation_proven"]
          assert d["interpretation_boundaries"]["RC6_unchanged"]
          print("PASS source membership and no causation claim")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: naamp-same-run-partner-stop-conditions-crossfit-v0-1
          path: build/partner_stop_context/
          if-no-files-found: warn
