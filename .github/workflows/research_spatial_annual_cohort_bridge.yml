name: Frogcs source-locked spatial annual cohort bridge

on:
  push:
    branches:
      - research/common-kernel-spatial-cohort-20261031
    paths:
      - research/scripts/spatial_cohort_80y_bridge.py
      - research/scripts/test_spatial_cohort_80y_bridge.py
      - research/COMMON_KERNEL_SPATIAL_COHORT_BRIDGE_PROTOCOL_2026-10-31.md
      - .github/workflows/research_spatial_annual_cohort_bridge.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-replay-and-movement-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout precise source
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed analysis dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2'
      - name: Validate source and conservation invariants
        run: python -m unittest discover -s research/scripts -p test_spatial_cohort_80y_bridge.py -v
      - name: Execute predeclared 4-year method smoke (not ecological findings)
        run: python research/scripts/spatial_cohort_80y_bridge.py --run --draws 1 --years 4 --window 2 --transfer 0.15
      - name: Preserve exact model-native receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-spatial-annual-source-bridge-4yr-method-smoke
          path: research/results/common_kernel_spatial_cohort_20261031/
          if-no-files-found: warn
          retention-days: 30
