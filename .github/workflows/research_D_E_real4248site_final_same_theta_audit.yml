name: Frogcs final independent same-theta real-site ABC-POM x 80year source audit

on:
  push:
    branches:
      - research/common-engine-D-E-nuisance-pom-20261101
    paths:
      - .github/workflows/research_D_E_real4248site_final_same_theta_audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  independently-join-original-biological-rate-and-both-real-site-backgrounds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: '41214798025'
      SITE_RUN: '41214957789'
    steps:
      - uses: actions/checkout@v4
        with:
          path: paper
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent source audit package
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'tabulate>=0.9,<1'
      - name: Retrieve actual 80year source F cohorts, model signs and occupancy
        run: |
          mkdir -p paper/research/results/D_E_common_engine_20261101/source_audited
          gh run download "$SOURCE_RUN" --repo "${{ github.repository }}" --name "frogcs-D-E-same-source-true80y-q-mobility-prior-audited" --dir paper/research/results/D_E_common_engine_20261101/source_audited
      - name: Retrieve both genuine original 4248-site six-pattern source projection results
        run: |
          mkdir -p paper/research/results/D_E_common_engine_20261101/site_pom_two_backgrounds
          gh run download "$SITE_RUN" --repo "${{ github.repository }}" --pattern "frogcs-DE-same-theta-real4248-site-six-pattern-*" --dir paper/research/results/D_E_common_engine_20261101/site_pom_two_backgrounds
      - name: Independently verify identical biological network theta q mobility and four-seed 6-effect predictions for both SDM backgrounds
        run: |
          python paper/research/scripts/audit_D_E_same_theta_real_site_POM_and_80y.py --full-80y-audit paper/research/results/D_E_common_engine_20261101/source_audited --two-site-POM-artifacts paper/research/results/D_E_common_engine_20261101/site_pom_two_backgrounds --output paper/research/results/D_E_common_engine_20261101/final_audited_site_and_demography
      - name: Retain full source matched real site POM and 80year demographic model audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-DE-true80y-same-theta-4248site-6pattern-both-backgrounds-audited
          path: paper/research/results/D_E_common_engine_20261101/final_audited_site_and_demography/
          if-no-files-found: warn
          retention-days: 30
