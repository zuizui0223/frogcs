name: Annual NLCD C1.2 authoritative download catalog source gate
on:
  push:
    branches:
      - study/climate-landscape-acoustic-sites-v0
    paths:
      - '.github/workflows/climate_nlcd_c12_authority_download_catalog_v24.yml'
      - 'studies/climate_landscape/scripts/audit_official_nlcd_c12_metadata_access_v24.py'
      - 'studies/climate_landscape/tests/test_nlcd_c12_metadata_access_v24.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-outcome-version-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install unit test runner
        run: python -m pip install pytest
      - name: Test source gate before external fetch
        run: python -m pytest -q studies/climate_landscape/tests/test_nlcd_c12_metadata_access_v24.py
      - name: Audit official NLCD C1V2 metadata and non-authoritative community GEE reference
        run: |
          python studies/climate_landscape/scripts/audit_official_nlcd_c12_metadata_access_v24.py \
            --out "$RUNNER_TEMP/annual_nlcd_c12_source_metadata_access_v24.json"
      - name: Preserve exact metadata hashes with unvalidated statuses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: annual-nlcd-c12-authority-catalog-metadata-v24
          path: ${{ runner.temp }}/annual_nlcd_c12_source_metadata_access_v24.json
          if-no-files-found: error
          retention-days: 30
