name: Open-Meteo batch exact qualification
on:
  push:
    branches: [exploration/openmeteo-batch-qualification-v1]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python exploration/qualify_openmeteo_batch_exact.py
      - uses: actions/upload-artifact@v4
        with:
          name: openmeteo-batch-exact-qualification-v0-1
          path: exploration/OPENMETEO_BATCH_EXACT_QUALIFICATION_RECEIPT_V0_1.json
          if-no-files-found: error
