name: NAAMP hydrology strong-chorus secondary

on:
  push:
    branches:
      - remotesensing/naamp-dynamic-hydrology-v1
    paths:
      - ".github/workflows/naamp_hydrology_strong_chorus_secondary.yml"
      - "scripts/remotesensing/run_naamp_hydrology_strong_chorus_secondary.py"
      - "revision/NAAMP_HYDROLOGY_STRONG_CHORUS_SECONDARY_V0_1.md"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy statsmodels patsy
      - name: Download corrected response-blind hydrology extraction
        uses: actions/download-artifact@v4
        with:
          name: naamp-jrc-hydrology-mechanism-v04
          path: frozen_hydrology
          github-token: ${{ github.token }}
          run-id: 37607007300
      - name: Run frozen strong-chorus secondary
        env:
          NAAMP_HYDRO_VARIABILITY_CSV: frozen_hydrology/NAAMP_JRC_V1_HYDROLOGY_VARIABILITY_V0_2.csv
        run: python scripts/remotesensing/run_naamp_hydrology_strong_chorus_secondary.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-hydrology-strong-chorus-secondary
          path: remotesensing/NAAMP_HYDROLOGY_STRONG_CHORUS_SECONDARY_RECEIPT_V0_1.json
          retention-days: 30
