name: NAAMP detection-augmented common-environment null

on:
  push:
    branches: [main]
    paths:
      - exploration/NAAMP_DETECTION_AUGMENTED_COMMON_ENVIRONMENT_NULL_CONTRACT_V0_1.json
      - exploration/run_naamp_detection_augmented_common_environment_null.py
      - .github/workflows/naamp_detection_augmented_common_environment_null.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naamp-detection-augmented-common-environment
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q icechunk xarray zarr numpy pandas scipy statsmodels patsy timezonefinder 'numcodecs[pcodec]'
      - name: Run fixed detection-augmented null
        run: python exploration/run_naamp_detection_augmented_common_environment_null.py
      - name: Validate receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("exploration/NAAMP_DETECTION_AUGMENTED_COMMON_ENVIRONMENT_NULL_RECEIPT_V0_1.json")
          x=json.loads(p.read_text())
          assert x["coverage"]["detection_complete_pairs"]>0,x["coverage"]
          assert x["coverage"]["routes"]>0,x["coverage"]
          for arm in ("same_sample_rain_amount_baseline","detection_augmented"):
              dep=x[arm]["bounded_dependence"]
              for k in ("all","dry_route_silent"):
                  assert -1/9-1e-12 <= dep[k]["rho_bounded"] <= 1+1e-12,(arm,k,dep[k])
          print(json.dumps({
              "coverage":x["coverage"],
              "comparison":x["comparison"],
              "decision":x["decision"]
          },indent=2))
          PY
      - name: Commit receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exploration/NAAMP_DETECTION_AUGMENTED_COMMON_ENVIRONMENT_NULL_RECEIPT_V0_1.json
          if git diff --cached --quiet; then
            echo "Receipt unchanged"
          else
            git commit -m "Record detection-augmented common-environment result"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main && exit 0
              sleep 2
            done
            exit 1
          fi
