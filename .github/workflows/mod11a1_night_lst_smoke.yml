name: MOD11A1 nighttime LST public smoke
on:
  push:
    branches:
      - remotesensing/naamp-dynamic-hydrology-v1
    paths:
      - ".github/workflows/mod11a1_night_lst_smoke.yml"
      - "scripts/remotesensing/preflight_mod11a1_night_lst_pc.py"
      - "revision/NAAMP_MODIS_NIGHT_LST_PROSPECTIVE_SPEC_V0_1.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy rasterio pyproj pystac-client planetary-computer
      - run: python scripts/remotesensing/preflight_mod11a1_night_lst_pc.py
