name: NAAMP cross-fit latent route-night generator

on:
  push:
    branches: [main]
    paths:
      - exploration/NAAMP_CROSSFIT_LATENT_ROUTE_NIGHT_GENERATOR_CONTRACT_V0_1.json
      - exploration/run_naamp_crossfit_latent_route_night_generator.py
      - .github/workflows/naamp_crossfit_latent_route_night_generator.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naamp-crossfit-latent-route-night-generator
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q icechunk xarray zarr numpy pandas scipy statsmodels patsy timezonefinder 'numcodecs[pcodec]'
      - name: Run frozen cross-fit latent generator
        run: python exploration/run_naamp_crossfit_latent_route_night_generator.py
      - name: Validate receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("exploration/NAAMP_CROSSFIT_LATENT_ROUTE_NIGHT_GENERATOR_RECEIPT_V0_1.json")
          x=json.loads(p.read_text())
          assert x["coverage"]["pairs"]==2835, x["coverage"]
          assert x["coverage"]["routes"]==428, x["coverage"]
          assert x["decision"] in {
              "route_transferable_shared_state_generator",
              "partial_generator",
              "insufficient_generator"
          }
          g=x["generator_checks"]
          for k in ("concentration","bounded_dependence","far_lag_7_9"):
              assert "observed_within_generator_ci95" in g[k], k
          print(json.dumps({
              "decision":x["decision"],
              "training":x["latent_state_training"],
              "checks":x["generator_checks"]
          },indent=2))
          PY
      - name: Commit receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exploration/NAAMP_CROSSFIT_LATENT_ROUTE_NIGHT_GENERATOR_RECEIPT_V0_1.json
          if git diff --cached --quiet; then
            echo "Receipt unchanged"
          else
            git commit -m "Record cross-fit latent route-night generator test"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main && exit 0
              sleep 2
            done
            exit 1
          fi
