name: frogcs Amado SVL source audit

on:
  push:
    branches:
      - revision/rainfall-community-filter-v1
    paths:
      - "AMADO2018_SVL_SOURCE_AUDIT_CONTRACT_V0_1.json"
      - "scripts/audit_amado2018_svl_source.py"
      - ".github/workflows/amado_svl_source_audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook dependencies
        run: python -m pip install --disable-pip-version-check -q pandas openpyxl
      - name: Recompute full 29-species response table
        run: |
          python -m pip install --disable-pip-version-check -q numpy scipy statsmodels patsy
          python scripts/run_naamp_species_pulse_heterogeneity.py
      - name: Run source-structure audit only
        run: python scripts/audit_amado2018_svl_source.py
      - name: Upload structural receipt
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-amado2018-svl-source-audit-v0-1
          path: AMADO2018_SVL_SOURCE_AUDIT_RECEIPT_V0_1.json
          if-no-files-found: error
