name: NAAMP current-water radius sensitivities
on:
  push:
    branches: [remotesensing/naamp-dynamic-hydrology-v1]
    paths:
      - ".github/workflows/naamp_current_water_radius_sensitivity.yml"
      - "scripts/remotesensing/run_naamp_current_water_radius_sensitivity.py"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy pandas scipy statsmodels patsy
      - name: Download corrected 100/250/500 current-water extraction
        uses: actions/download-artifact@v4
        with:
          name: naamp-jrc-v1-hydrology-exposures
          path: frozen_current
          github-token: ${{ github.token }}
          run-id: 37606224786
      - name: Run named radius sensitivities
        env:
          NAAMP_HYDRO_EXPOSURE_CSV: frozen_current/NAAMP_JRC_V1_HYDROLOGY_EXPOSURES_V0_1.csv
        run: python scripts/remotesensing/run_naamp_current_water_radius_sensitivity.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-current-water-radius-sensitivity
          path: remotesensing/NAAMP_CURRENT_WATER_RADIUS_SENSITIVITY_RECEIPT_V0_1.json
          retention-days: 30
