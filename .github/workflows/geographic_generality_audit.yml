name: NAAMP geographic generality audit

on:
  workflow_dispatch:
  push:
    branches:
      - revision/geographic-generality-audit-v1
    paths:
      - "provenance/contracts/NAAMP_GEOGRAPHIC_GENERALITY_AUDIT_CONTRACT_V0_1.json"
      - "scripts/run_naamp_geographic_generality_audit.py"
      - ".github/workflows/geographic_generality_audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas statsmodels
      - name: Run frozen geographic generality audit
        run: python scripts/run_naamp_geographic_generality_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: geographic-generality-audit
          path: NAAMP_GEOGRAPHIC_GENERALITY_AUDIT_RECEIPT_V0_1.json
