name: Expanded full GloBI nonself life-stage joins to GBIF Anura Odonata world grids
on:
  push:
    branches:
      - research/stage-structured-interactions-2026-10-25
    paths:
      - research/scripts/expand_full_globi_gbif_anura_odonata.py
      - .github/workflows/research_full_globi_gbif_expanded_stage_grid.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  expanded-source-global:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Arrow and pandas for full order partition scanning
        run: python -m pip install --disable-pip-version-check 'pandas>=2.1,<3' 'numpy>=1.26,<3' 'pyarrow>=17,<24'
      - name: Validate full GloBI distinct-species edge and GBIF stages joins on synthetic data
        run: python research/scripts/expand_full_globi_gbif_anura_odonata.py --self-test
      - name: Restore independently verified GloBI all-source stage provenance
        uses: actions/download-artifact@v4
        with:
          name: fixed-full-globi-nonself-gbif-1degree-stage-grid
          run-id: 40193636562
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: research/data/full_globi_stage_artifact
      - name: Scan full public GBIF order partitions and align all source-selected stage pairs
        run: |
          python research/scripts/expand_full_globi_gbif_anura_odonata.py \
            --globi-artifact research/data/full_globi_stage_artifact \
            --out research/results/gbif_open_expanded_anura_odonata
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: expanded-full-globi-anura-odonata-gbif1deg-stage-grid
          path: research/results/gbif_open_expanded_anura_odonata/
          if-no-files-found: error
