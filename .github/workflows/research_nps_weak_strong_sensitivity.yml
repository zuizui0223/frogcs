name: NPS past strong vs weak historical site sensitivity

on:
  push:
    branches:
      - research/stage-structured-interactions-2026-10-25
    paths:
      - research/scripts/nps_glkn_weak_strong_sensitivity.py
      - .github/workflows/research_nps_weak_strong_sensitivity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observed-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pandas and numpy
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'pandas>=2.1,<3'
      - name: Run post-readback sensitivity on same pinned 2016–2023 source
        run: |
          python research/scripts/nps_glkn_weak_strong_sensitivity.py \
            --out research/results/nps_glkn_weak_vs_strong
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nps-history-weak-strong-sensitivity
          path: research/results/nps_glkn_weak_vs_strong/observed_results.json
          if-no-files-found: error
