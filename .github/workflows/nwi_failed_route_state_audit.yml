name: NWI failed-route state audit

on:
  push:
    branches: [remotesensing/naamp-dynamic-hydrology-v1]
    paths:
      - ".github/workflows/nwi_failed_route_state_audit.yml"
      - "scripts/remotesensing/audit_nwi_failed_route_states.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy pandas scipy statsmodels patsy
      - uses: actions/download-artifact@v4
        with:
          name: naamp-nwi-coverage
          path: frozen_nwi
          github-token: ${{ github.token }}
          run-id: 37620292386
      - env:
          NWI_BASE_ASSIGNMENTS: frozen_nwi/NAAMP_NWI_SITE_ASSIGNMENTS_V0_1.csv
        run: python scripts/remotesensing/audit_nwi_failed_route_states.py
