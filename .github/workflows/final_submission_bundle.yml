# Canonical RC10/v1.2 final-submission bundle.
name: frogcs final JAE submission bundle (RC10)

on:
  workflow_dispatch:
    inputs:
      archive_doi:
        description: "Published archive DOI, e.g. 10.5281/zenodo.1234567"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -q python-docx==1.2.0 PyYAML==6.0.2

      - name: Audit RC10 scientific package
        run: python scripts/audit_rc10_submission_package.py

      - name: Materialize private metadata and archive DOI
        env:
          JAE_SUBMISSION_METADATA_YAML: ${{ secrets.JAE_SUBMISSION_METADATA_YAML }}
          ARCHIVE_DOI: ${{ inputs.archive_doi }}
        run: |
          test -n "$JAE_SUBMISSION_METADATA_YAML" || {
            echo "Missing repository secret JAE_SUBMISSION_METADATA_YAML" >&2
            exit 2
          }
          printf '%s' "$JAE_SUBMISSION_METADATA_YAML" > /tmp/metadata-input.yml
          python - <<'PY'
          import os,yaml
          from pathlib import Path
          m=yaml.safe_load(Path("/tmp/metadata-input.yml").read_text(encoding="utf-8"))
          if not isinstance(m,dict):
              raise SystemExit("metadata secret is not a YAML mapping")
          m.setdefault("repository",{})["archive_doi"]=os.environ["ARCHIVE_DOI"]
          Path("/tmp/metadata-final.yml").write_text(
              yaml.safe_dump(m,sort_keys=False,allow_unicode=True),encoding="utf-8"
          )
          PY

      - name: Render archive-stage metadata
        run: |
          python scripts/render_submission_metadata.py             --metadata /tmp/metadata-final.yml             --strict --stage archive             --outdir build/submission-metadata

      - name: Guard RC10 title
        run: |
          python - <<'PY'
          from pathlib import Path
          expected="Rainfall-associated expansion of frog active communities is more boundary-biased than uniform activation predicts"
          x=Path("build/submission-metadata/JAE_TITLE_PAGE_FINAL.md").read_text(encoding="utf-8")
          if expected not in x:
              raise SystemExit("metadata contains a superseded title")
          print("RC10 metadata title PASS")
          PY

      - name: Insert archive DOI into v1.2 manuscript
        run: |
          python scripts/finalize_archive_doi.py             --doi "${{ inputs.archive_doi }}"             --input MANUSCRIPT_JAE_V1_2.md             --output build/MANUSCRIPT_JAE_FINAL.md

      - name: Verify finalized RC10 manuscript
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("build/MANUSCRIPT_JAE_FINAL.md")
          x=p.read_text(encoding="utf-8")
          assert "Rainfall-associated expansion of frog active communities is more boundary-biased than uniform activation predicts" in x
          assert "80.9% boundary crossing" in x
          assert "Monte Carlo P = 0.001" in x
          print("finalized RC10 manuscript PASS")
          PY

      - name: Build final anonymous DOCX files
        run: |
          python scripts/build_jae_anonymous_docx.py             --source build/MANUSCRIPT_JAE_FINAL.md             --output build/FROG_JAE_ANON_MAIN_FINAL_RC10.docx
          python scripts/build_jae_anonymous_docx.py             --source SUPPORTING_INFORMATION_JAE_RC10_V0_1.md             --output build/FROG_JAE_SUPPORTING_INFORMATION_RC10.docx

      - name: Assemble RC10 final bundle
        run: |
          set -eu
          out=build/final-submission-rc10
          mkdir -p "$out"
          cp build/MANUSCRIPT_JAE_FINAL.md "$out/"
          cp build/FROG_JAE_ANON_MAIN_FINAL_RC10.docx "$out/"
          cp SUPPORTING_INFORMATION_JAE_RC10_V0_1.md "$out/"
          cp build/FROG_JAE_SUPPORTING_INFORMATION_RC10.docx "$out/"
          cp build/submission-metadata/* "$out/"
          cp figures_ecology_v1_0/FIGURE_1_METACOMMUNITY_EXPANSION_V0_1.svg "$out/"
          cp figures_ecology_v1_2/*.svg "$out/"
          cp submission/COVER_LETTER_JAE_V0_13.md "$out/"
          cp submission/NOVELTY_AUDIT_V0_10.md "$out/"
          cp submission/REVIEWER_ATTACK_MATRIX_V0_10.md "$out/"
          cp submission/JAE_PORTAL_CHECKLIST_V0_9.md "$out/"
          cp submission/SUBMISSION_HANDOFF_RC10.md "$out/"
          cp submission/RC10_STORY_FREEZE_V0_1.json "$out/"
          cp NAAMP_UNIFORM_ACTIVATION_NULL_CONTRACT_V0_1.json "$out/"
          cp NAAMP_UNIFORM_ACTIVATION_NULL_REPAIR_V0_1_1.json "$out/"
          cp NAAMP_UNIFORM_ACTIVATION_NULL_REPAIR_V0_1_2.json "$out/"
          cp NAAMP_UNIFORM_ACTIVATION_NULL_REPAIR_V0_1_3.json "$out/"
          cp NAAMP_UNIFORM_ACTIVATION_NULL_SUMMARY_V0_1.json "$out/"
          cp NAAMP_SORENSEN_EQUIVALENCE_CONTRACT_V0_1.json "$out/"
          cp NAAMP_SORENSEN_EQUIVALENCE_SUMMARY_V0_1.json "$out/"
          cp CROSSCONTINENTAL_ACTIVE_DEPTH_CONTRACT_V0_1.json "$out/"
          cp CROSSCONTINENTAL_ACTIVE_DEPTH_SUMMARY_V0_1.json "$out/"
          cp NAAMP_PERSISTENCE_PRESERVING_NULL_CONTRACT_V0_1.json "$out/"
          cp NAAMP_PERSISTENCE_PRESERVING_NULL_SUMMARY_V0_1.json "$out/"
          cp submission/RC10_SCOPE_UNFREEZE_V0_1.json "$out/"
          cp submission/RC10_STORY_DECISION_TREE_V0_1.json "$out/"
          cp submission/RC8_CROSSCONTINENTAL_DEPTH_UNFREEZE_V0_1.json "$out/"
          cp submission/RC8_CROSSCONTINENTAL_DEPTH_DECISION_TREE_V0_1.json "$out/"

          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          out=Path("build/final-submission-rc10")
          rows={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.iterdir()) if p.is_file()}
          (out/"SHA256SUMS.json").write_text(json.dumps(rows,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print({"bundle_files_before_manifest":len(rows),"status":"PASS"})
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: frogcs-jae-rc10-v1-2-final-submission-bundle
          path: build/final-submission-rc10/
          if-no-files-found: error
