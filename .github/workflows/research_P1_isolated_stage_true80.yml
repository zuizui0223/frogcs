name: Frogcs P1 isolate salamander arrival vs aquatic duration in original true80 food web

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  immutable-main-model-and-original-stage-replay-methods:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      PYTHONPATH: 'original/research/scripts:paper/research/scripts'
    steps:
      - uses: actions/checkout@v4
        with:
          path: paper
      - uses: actions/checkout@v4
        with:
          path: original
          ref: 5e2f0a87c639df373fa2700b29403d2ab417a1cc
          sparse-checkout: |
            research/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install same original main numerical dependencies
        run: python -m pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.3
      - name: Same source 256 structures, four timing/duration contexts, original stage 1/2 4-year replay
        run: |
          python -m unittest discover -s paper/research/scripts \
            -p 'test_P1_arrival_duration_plant2x2_20261105.py' -v

  genuine-original-80year-four-stage-factorial:
    needs: immutable-main-model-and-original-stage-replay-methods
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      PYTHONPATH: 'original/research/scripts:paper/research/scripts'
    steps:
      - uses: actions/checkout@v4
        with:
          path: paper
      - uses: actions/checkout@v4
        with:
          path: original
          ref: 5e2f0a87c639df373fa2700b29403d2ab417a1cc
          sparse-checkout: |
            research/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.3
      - name: Run 32 fixed model backgrounds × four salamander contexts × four plant states, genuinely 80y
        run: |
          python -u paper/research/scripts/run_P1_arrival_duration_plant2x2_true80_20261105.py \
            --shard ${{ matrix.shard }} --years 80 \
            --out paper/research/results/P1_original80_20261105/source
      - name: Preserve all original 80year model states and SHA256 source receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-P1-pure-arrival-duration-true80-shard-${{ matrix.shard }}
          path: paper/research/results/P1_original80_20261105/source/
          if-no-files-found: warn
          retention-days: 30

  independently-replay-original-PR161-and-audit-pure-stage:
    needs: genuine-original-80year-four-stage-factorial
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
      PYTHONPATH: 'original/research/scripts:paper/research/scripts'
    steps:
      - uses: actions/checkout@v4
        with:
          path: paper
      - uses: actions/checkout@v4
        with:
          path: original
          ref: 5e2f0a87c639df373fa2700b29403d2ab417a1cc
          sparse-checkout: |
            research/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          pattern: frogcs-P1-pure-arrival-duration-true80-shard-*
          path: paper/research/results/P1_original80_20261105/shards
          merge-multiple: false
      - name: Fetch immutable original PR161 successful 256-source×3-stage×4-plant biological responses
        run: |
          mkdir -p paper/research/results/P1_original80_20261105/old_PR161
          gh run download 41408471121 --repo "$GITHUB_REPOSITORY" \
            --name frogcs-newseed-independent-2x2-genuine80y-canonical-audited \
            --dir paper/research/results/P1_original80_20261105/old_PR161
      - name: Independently replay all original 2048 true80 source rows and 16384 source vertex outcomes plus new pure stage effects
        run: |
          python -u paper/research/scripts/audit_P1_arrival_duration_plant2x2_true80_20261105.py \
            --shards paper/research/results/P1_original80_20261105/shards \
            --original-PR161-scores paper/research/results/P1_original80_20261105/old_PR161/true80_canonical_paired_2x2_proposals.csv.gz \
            --original-PR161-vertices paper/research/results/P1_original80_20261105/old_PR161/true80_all_24576_original_model_vertices.csv.gz \
            --output paper/research/results/P1_original80_20261105/audited
      - name: Fail closed on 256 background origin, all source outputs, separate arrival and duration estimates and no fake field test
        run: |
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          out=Path('paper/research/results/P1_original80_20261105/audited')
          r=json.loads((out/'P1_isolated_stage_source_receipt.json').read_text())
          m=pd.read_csv(out/'P1_pure_arrival_duration_and_interaction.csv')
          p=pd.read_csv(out/'P1_original4096_isolated_timing_duration_80year.csv.gz')
          v=pd.read_csv(out/'P1_original32768_vegetation_predator_corners.csv.gz')
          assert r['status']=='P1_PURE_SALAMANDER_ARRIVAL_VS_DURATION_ORIGINAL80_SOURCE_AUDIT_SUCCESS'
          assert len(p)==4096 and len(v)==32768 and p.source_id.nunique()==256
          assert len(m)==36 and set(m.contrast)=={
             'pure_arrival_moderation_of_plant_effect',
             'pure_duration_moderation_of_plant_effect',
             'arrival_x_duration_moderation_of_plant_effect'}
          assert r['source_original_stage1_2_replay']['legacy_original_2048_true80_source_rows_replayed']
          assert r['source_original_stage1_2_replay']['legacy_original_16384_original_vertices_replayed']
          assert r['source_original_stage1_2_replay']['original_vegetation_zero_negative_control_passed']
          assert not r['estimated_breeding_priority_wild']
          assert not r['field_vegetation_x_breeding_lead_model_run']
          print('P1_ISOLATED_ORIGINAL_256_MODEL_SOURCE_REPLAY_AND_TWO_FACTOR_EFFECTS_FINAL_PASS')
          PY
      - name: Archive positive negative and null timing/duration comparisons as original source artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frogcs-P1-same256-true80-pure-S-arrival-duration-full-audited
          path: paper/research/results/P1_original80_20261105/audited/
          if-no-files-found: warn
          retention-days: 30
