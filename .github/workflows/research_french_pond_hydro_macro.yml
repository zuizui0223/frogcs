name: Girard 85 French ponds hydroperiod macrophyte trophic test
on:
  push:
    branches:
      - research/stage-structured-interactions-2026-10-25
    paths:
      - research/scripts/french_pond_history_macrophytes.py
      - .github/workflows/research_french_pond_hydro_macro.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pond-blocked-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'pandas>=2.1,<3' 'scikit-learn>=1.4,<2'
      - name: Compare distinct pond heldout plant and benthos/fish ecology
        run: python research/scripts/french_pond_history_macrophytes.py --out research/results/french_ponds_hydro_plant
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: french-pond-macrophyte-hydroperiod-results
          path: research/results/french_ponds_hydro_plant/observed_results.json
          if-no-files-found: error
