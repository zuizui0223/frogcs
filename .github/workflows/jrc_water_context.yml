name: JRC surface-water context test
on:
  push:
    branches: [exploration/jrc-water-context-v1]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy rasterio pystac-client planetary-computer
      - run: python -m compileall -q exploration scripts
      - run: python exploration/run_naamp_jrc_surface_water_context.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-jrc-surface-water-context-v0-1
          path: |
            exploration/NAAMP_JRC_SURFACE_WATER_CONTEXT_CONTRACT_V0_1.json
            exploration/NAAMP_JRC_SURFACE_WATER_CONTEXT_RECEIPT_V0_1.json
          if-no-files-found: error
