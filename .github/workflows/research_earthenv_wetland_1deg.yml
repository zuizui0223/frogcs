name: EarthEnv global flooded vegetation 1deg background
on:
  push:
    branches:
      - research/stage-structured-interactions-2026-10-25
    paths:
      - research/scripts/earthenv_global_flooded_vegetation_1deg.py
      - .github/workflows/research_earthenv_wetland_1deg.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  earthenv:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install raster geospatial runtime
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'rasterio>=1.3,<2'
      - name: Check synthetic raster aggregation and coordinate grid
        run: python research/scripts/earthenv_global_flooded_vegetation_1deg.py --self-test
      - name: Download real 1km EarthEnv three landcover layers with source integrity and aggregate world 1deg
        run: |
          python research/scripts/earthenv_global_flooded_vegetation_1deg.py \
            --out research/results/earthenv_wetland_1deg
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: earthenv-global-flooded-openwater-herbaceous-1deg
          path: research/results/earthenv_wetland_1deg
          if-no-files-found: error
