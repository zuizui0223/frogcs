name: Official USFWS NWI PEM code and verified site geometry QA
on:
  push:
    branches:
      - research/stage-structured-interactions-2026-10-25
    paths:
      - research/scripts/nwi_pem_verified_site_overlay.py
      - .github/workflows/research_nwi_pem_verified_site_overlay.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-schema-only:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject unverified physical-site coordinates and decode PEM variants
        run: python research/scripts/nwi_pem_verified_site_overlay.py --self-test
      - name: Confirm official USFWS ArcGIS NWI polygon attribute schema without guessing acoustic-site locations
        run: python research/scripts/nwi_pem_verified_site_overlay.py --schema-audit
