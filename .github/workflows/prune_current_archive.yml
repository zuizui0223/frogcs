name: prune duplicated historical archive

on:
  push:
    branches:
      - cleanup/final-prune-v1
    paths:
      - ".github/workflows/prune_current_archive.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Remove duplicated historical payload
        run: |
          find archive -mindepth 1 -maxdepth 1 ! -name README.md -exec rm -rf {} +
          python scripts/qa/audit_repository_structure.py
      - name: Commit minimal archive pointer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A archive
          if git diff --cached --quiet; then
            echo "Archive already minimal"
            exit 0
          fi
          git commit -m "prune duplicated historical archive"
          git push origin HEAD:cleanup/final-prune-v1
