name: Frogcs finite-N source-preserving 20y methods smoke

on:
  push:
    branches:
      - research/finite-n-stage-bridge-20261031
    paths:
      - research/scripts/finite_n_source_cohort_bridge.py
      - research/scripts/test_finite_n_source_cohort_bridge.py
      - research/FINITE_N_SOURCE_COHORT_BRIDGE_PROTOCOL_2026-10-31.md
      - .github/workflows/research_finite_n_stage_smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-integer-source-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2'
      - name: Test unchanged source replay, finite conservation, census censoring
        run: python -m unittest discover -s research/scripts -p test_finite_n_source_cohort_bridge.py -v
      - name: Execute genuine 20-year synthetic integer-cohort methods smoke
        run: python research/scripts/finite_n_source_cohort_bridge.py --run --years 20 --draws 1 --seeds 2 --scales 3 12
      - name: Retain source seed-level and event-level audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-finite-n-source-cohort-20year-smoke
          path: research/results/finite_n_stage_bridge_20261031/
          retention-days: 30
          if-no-files-found: warn
