name: RC7 protocol-selection transparency QA

on:
  push:
    branches:
      - revision/rc7-protocol-selection-transparency-v1
    paths:
      - "MANUSCRIPT_JAE_V0_9.md"
      - "submission/REVIEWER_ATTACK_MATRIX_V0_5.md"
      - "scripts/audit_rc7_protocol_transparency.py"
      - ".github/workflows/rc7_protocol_transparency_qa.yml"
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/audit_rc7_protocol_transparency.py
