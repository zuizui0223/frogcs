name: Archive independently audited G8 27-rate result files

on:
  push:
    branches:
      - research/g8-27rate-paired-factorial-20261107
    paths:
      - .github/workflows/research_g8_archive_audited_results.yml

permissions:
  contents: write
  actions: read

jobs:
  archive-verified-run-42320535778:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight table and figure dependencies
        run: python -m pip install numpy==2.2.6 pandas==2.2.3 matplotlib==3.10.7
      - name: Download complete independent-source G8 audited artifact only
        run: |
          mkdir -p research/results/g8_27rate_paired_20261107/audited
          gh run download 42320535778 -R "$GITHUB_REPOSITORY" \
            --name frogcs-g8-full-27rate-audited-results \
            --dir research/results/g8_27rate_paired_20261107/audited
      - name: Fail closed on 27 cells, 256 backgrounds and original 80-year replay
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd, json, hashlib
          p=Path('research/results/g8_27rate_paired_20261107/audited')
          r=json.loads((p/'g8_completion_receipt.json').read_text())
          assert r['status']=='G8_27RATE_TRUE80_ALL_256_SOURCE_SUCCESS'
          assert (r['n_original_true80_scenarios'],r['n_source_vertices'])==(82944,663552)
          assert r['source_shards']==64 and r['n_sources']==256 and r['n_rates']==27
          assert r['original_model_pr161_rate_cell_replay_max_abs']<1e-10
          for filename,sha in r['output_sha256'].items():
              assert hashlib.sha256((p/filename).read_bytes()).hexdigest()==sha
          c=pd.read_csv(p/'g8_27rate_descriptive_counts.csv')
          s=pd.read_csv(p/'g8_full_27rate_compatibility_abundance_summary.csv')
          z=pd.read_csv(p/'g8_all_source_rate_context_paired.csv.gz')
          assert len(c)==27 and c.n_source_context.eq(768).all()
          assert len(s)==654 and len(z)==20736
          assert z.source_id.nunique()==256 and z.rate_id.nunique()==27
          assert not z.duplicated(['source_id','rate_id','context_id']).any()
          print('G8_POSTRUN_ARCHIVE_FULL_SOURCE_RESULT_HASHES_AND_DENOMINATORS_VERIFIED')
          PY
      - name: Generate all-rate figure directly from unfiltered audited tables
        run: |
          python research/scripts/plot_g8_27rate_rategrid.py \
            --results research/results/g8_27rate_paired_20261107/audited
      - name: Commit audited numerical tables, receipt and figure to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/g8_27rate_paired_20261107/audited/
          if git diff --cached --quiet; then
            echo "G8 results already archived; no changes"
          else
            git commit -m "results: archive 27-rate full-source audited G8 results and figure"
            git push
          fi
