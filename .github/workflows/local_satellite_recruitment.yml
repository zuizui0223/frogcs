name: frogcs local satellite recruitment test

on:
  push:
    branches:
      - revision/local-satellite-recruitment-v1
    paths:
      - "NAAMP_LOCAL_SATELLITE_RECRUITMENT_CONTRACT_V0_1.json"
      - "scripts/run_naamp_local_satellite_recruitment.py"
      - ".github/workflows/local_satellite_recruitment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-satellite:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - name: Run frozen local core-satellite test
        run: python scripts/run_naamp_local_satellite_recruitment.py
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-local-satellite-recruitment-v0-1
          path: NAAMP_LOCAL_SATELLITE_RECRUITMENT_RECEIPT_V0_1.json
          if-no-files-found: error
