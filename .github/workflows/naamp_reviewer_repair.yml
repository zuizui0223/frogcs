name: frogcs NAAMP reviewer repair

on:
  push:
    branches:
      - revision/activation-decomposition-v1
    paths:
      - "NAAMP_REVIEW_REPAIR_CONTRACT_V0_1.json"
      - "scripts/run_naamp_reviewer_repair.py"
      - ".github/workflows/naamp_reviewer_repair.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - name: Run frozen reviewer-repair diagnostics
        run: python scripts/run_naamp_reviewer_repair.py
      - uses: actions/upload-artifact@v4
        with:
          name: frogcs-naamp-reviewer-repair-v0-1
          path: frog_naamp_reviewer_repair_v0_1.json
          if-no-files-found: error
