name: NAAMP annual NLCD C1V2 full 2002-2015 environmental panel
on:
  push:
    branches: [research/vegetation-hydrology-feasibility-2026-10]
    paths:
      - ".github/workflows/vegetation_hydrology_c1v2_year_panel.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare-sites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: studies/vegetation_hydrology
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch source-verified NAAMP route metadata once, without calling records
        run: |
          python scripts/fetch_pinned_naamp_sources.py --out data/source
          python scripts/audit_site_coordinates.py \
            --coordinates data/source/NAAMP_SiteCoordinates.csv \
            --expected-sha256 f71a87df9fc94e0d6c5d4466b4745c3bbaff874cbe7c28796b3f9eb44c2e6e83 \
            --out data/qc
          python scripts/prepare_survey_site_calendar.py \
            --runs data/source/Runs.csv \
            --stops data/source/Stops.csv \
            --accepted-coordinates data/qc/accepted_coordinates.csv \
            --out data/qc/survey_site_calendar.csv
      - name: Share vetted coordinates and calendar among yearly workers
        uses: actions/upload-artifact@v4
        with:
          name: public-NAAMP-outcome-blind-site-frame
          path: |
            studies/vegetation_hydrology/data/qc/accepted_coordinates.csv
            studies/vegetation_hydrology/data/qc/survey_site_calendar.csv
          if-no-files-found: error
          retention-days: 7
  year:
    needs: prepare-sites
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        year: [2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015]
    defaults:
      run:
        working-directory: studies/vegetation_hydrology
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: studies/vegetation_hydrology/requirements.txt
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: public-NAAMP-outcome-blind-site-frame
          path: studies/vegetation_hydrology/data/frame
      - name: One official C1V2 source ZIP and exact sampled site-year buffers
        run: |
          python scripts/run_official_nlcd_c1v2_year.py \
            --year ${{ matrix.year }} \
            --accepted-coordinates data/frame/accepted_coordinates.csv \
            --site-calendar data/frame/survey_site_calendar.csv \
            --out-dir data/qc/nlcd_c1v2
      - name: Upload derived table and source receipt, no raw imagery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naamp-nlcd-c1v2-${{ matrix.year }}-environment-only
          path: |
            studies/vegetation_hydrology/data/qc/nlcd_c1v2/*.csv
            studies/vegetation_hydrology/data/qc/nlcd_c1v2/*receipt.json
          if-no-files-found: warn
          retention-days: 30
