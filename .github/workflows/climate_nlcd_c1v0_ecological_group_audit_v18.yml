name: Independent NLCD C1V0 ecological-group pixel-change QC
on:
  push:
    branches:
      - study/climate-landscape-acoustic-sites-v0
    paths:
      - '.github/workflows/climate_nlcd_c1v0_ecological_group_audit_v18.yml'
      - 'studies/climate_landscape/scripts/audit_c1v0_ecological_class_change_v18.py'
      - 'studies/climate_landscape/tests/test_c1v0_ecological_class_change_v18.py'
      - 'studies/climate_landscape/scripts/audit_nlcd_geolocation_sensitivity_v18.py'
      - 'studies/climate_landscape/tests/test_nlcd_geolocation_sensitivity_v18.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only-functional-class-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible geospatial dependencies
        run: python -m pip install -r studies/climate_landscape/requirements.txt
      - name: Run pre-existing synthetic integrity tests
        run: |
          python -m pytest -q studies/climate_landscape/tests/test_c1v0_ecological_class_change_v18.py studies/climate_landscape/tests/test_nlcd_geolocation_sensitivity_v18.py
      - name: Download frozen source-only ArcGIS C1V0 NLCD artifact
        uses: actions/download-artifact@v4
        with:
          name: iowa360417-annual-nlcd-C1V0-categorical-source-v16
          run-id: 37754405051
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/source_2004_2009_2014
      - name: Reconstitute artifact archive without altering source TIFF bytes
        run: |
          python - <<'PY'
          import os,zipfile
          from pathlib import Path
          source=Path(os.environ['RUNNER_TEMP'])/'source_2004_2009_2014'
          names=['receipt.json']+[f'arcgis_nlcd_C1V0_{y}_iowa_360417.tif' for y in (2004,2009,2014)]
          with zipfile.ZipFile(Path(os.environ['RUNNER_TEMP'])/'source_orig.zip','w') as z:
              for n in names:
                  if not (source/n).exists():
                      raise RuntimeError('Source artifact incomplete: '+n)
                  z.write(source/n,n)
          PY
      - name: Verify original TIFF hashes and recalculate both class scales
        run: |
          python studies/climate_landscape/scripts/audit_c1v0_ecological_class_change_v18.py \
            --artifact "$RUNNER_TEMP/source_orig.zip" \
            --source-stops studies/climate_landscape/reference_routes/iowa_dnr_360417_source_only_stops_v16.csv \
            --out-json "$RUNNER_TEMP/independent_C1V0_ecological_transition_receipt_v18.json" \
            --out-csv "$RUNNER_TEMP/independent_C1V0_ecological_transition_site_table_v18.csv"
      - name: Postreadback nominal-center location-shift sensitivity, no frog responses
        run: |
          python studies/climate_landscape/scripts/audit_nlcd_geolocation_sensitivity_v18.py \
            --artifact-zip "$RUNNER_TEMP/source_orig.zip" \
            --station-csv studies/climate_landscape/reference_routes/iowa_dnr_360417_source_only_stops_v16.csv \
            --outdir "$RUNNER_TEMP/iowa_shift_v18"
      - name: Preserve small source-only transition receipt, not the original TIFFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iowa360417-C1V0-ecological-group-transitions-v18
          path: |
            ${{ runner.temp }}/independent_C1V0_ecological_transition_receipt_v18.json
            ${{ runner.temp }}/independent_C1V0_ecological_transition_site_table_v18.csv
            ${{ runner.temp }}/iowa_shift_v18/receipt.json
            ${{ runner.temp }}/iowa_shift_v18/site_scale_sensitivity.csv
          if-no-files-found: warn
          retention-days: 30
