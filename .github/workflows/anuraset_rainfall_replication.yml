name: AnuraSet rainfall-threshold replication

on:
  push:
    branches:
      - exploration/anuraset-replication-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q icechunk xarray zarr numpy pandas scipy statsmodels patsy 'numcodecs[pcodec]'
      - name: Run frozen AnuraSet replication
        run: python exploration/run_anuraset_rainfall_threshold_replication.py
      - name: Run INCT41 coordinate-uncertainty replication
        run: python exploration/run_anuraset_inct41_coordinate_uncertainty.py
      - uses: actions/upload-artifact@v4
        with:
          name: anuraset-rainfall-threshold-replication-v0-1
          path: |
            exploration/ANURASET_RAINFALL_REPLICATION_RECEIPT_V0_1.json
            exploration/ANURASET_INCT41_COORDINATE_UNCERTAINTY_RECEIPT_V0_1.json
          if-no-files-found: error
