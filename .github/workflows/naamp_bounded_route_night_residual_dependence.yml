name: NAAMP bounded route-night residual dependence

on:
  push:
    branches: [main]
    paths:
      - exploration/NAAMP_BOUNDED_ROUTE_NIGHT_RESIDUAL_DEPENDENCE_CONTRACT_V0_1.json
      - exploration/run_naamp_bounded_route_night_residual_dependence.py
      - .github/workflows/naamp_bounded_route_night_residual_dependence.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naamp-bounded-route-night-residual-dependence
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q icechunk xarray zarr numpy pandas scipy statsmodels patsy timezonefinder 'numcodecs[pcodec]'
      - name: Run bounded dependence repair
        run: python exploration/run_naamp_bounded_route_night_residual_dependence.py
      - name: Validate receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("exploration/NAAMP_BOUNDED_ROUTE_NIGHT_RESIDUAL_DEPENDENCE_RECEIPT_V0_1.json")
          x=json.loads(p.read_text())
          assert x["coverage"]["pairs"]==2835, x["coverage"]
          for k,v in x["results"].items():
              assert -1/9-1e-12 <= v["rho_bounded"] <= 1+1e-12, (k,v)
          assert x["metric_repair"]["design_effect_translation_withdrawn"] is True
          print(json.dumps(x["results"],indent=2))
          PY
      - name: Commit receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exploration/NAAMP_BOUNDED_ROUTE_NIGHT_RESIDUAL_DEPENDENCE_RECEIPT_V0_1.json
          if git diff --cached --quiet; then
            echo "Receipt unchanged"
          else
            git commit -m "Record bounded route-night dependence repair"
            git push origin HEAD:main
          fi
