name: final crossfit rain local-memory gating null
on:
  push:
    branches: [exploration/crossfit-memory-gating-null-v1]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: final-memory-gating-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - run: python -m compileall -q exploration scripts
      - run: python exploration/run_naamp_crossfit_rain_local_memory_gating_null.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-final-crossfit-rain-local-memory-gating-null-v0-1
          path: |
            exploration/NAAMP_CROSSFIT_RAIN_LOCAL_MEMORY_GATING_NULL_CONTRACT_V0_1.json
            exploration/NAAMP_CROSSFIT_RAIN_LOCAL_MEMORY_GATING_NULL_RECEIPT_V0_1.json
          if-no-files-found: error
