name: One-off public frog distance-to-water grouping v7.3
on:
  push:
    branches:
      - audit/iowa-station-waterstate-source-gate-v31
    paths:
      - ".github/workflows/public_frog_water_proximity_v73.yml"
      - "studies/climate_landscape/scripts/analyze_public_frog_water_proximity_season_partition_v73.py"
      - "studies/climate_landscape/V7_3_PUBLIC_FROG_WATER_PROXIMITY_FOUR_PLOT_SEASON_TEST_CONTRACT.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-frog-plot-label-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test non-reallocated four-positive plot sets and run source-pinned original field detections
        run: python studies/climate_landscape/scripts/analyze_public_frog_water_proximity_season_partition_v73.py
      - uses: actions/upload-artifact@v4
        with:
          name: public-frog-water-proximity-v73-aggregate
          path: studies/climate_landscape/receipts/HOEFER_2026_REAL_PUBLIC_WATER_PROXIMITY_SEASON_PARTITIONS_V73.json
          if-no-files-found: error
