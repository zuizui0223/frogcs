name: WFTS secondary route-night diagnostics QA

on:
  push:
    branches: [main]
    paths:
      - revision/WFTS_PROSPECTIVE_COMMON_ENVIRONMENT_DIAGNOSTIC_V0_2.json
      - scripts/wfts/run_wfts_secondary_route_night_diagnostics_v0_2.py
      - scripts/wfts/generate_synthetic_common_environment_runs.py
      - scripts/wfts/generate_synthetic_wfts_fixture.py
      - scripts/wfts/preflight_wfts_structure.py
      - scripts/wfts/run_wfts_confirmatory_analysis_v0_5.py
      - .github/workflows/wfts_secondary_route_night_qa.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {contents: read}

concurrency:
  group: wfts-secondary-route-night-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  synthetic-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - name: Generate synthetic WFTS response fixture
        run: python scripts/wfts/generate_synthetic_wfts_fixture.py --outdir build/wfts-secondary
      - name: Run response-blind structural preflight
        run: |
          python scripts/wfts/preflight_wfts_structure.py \
            --runs build/wfts-secondary/runs.csv \
            --matrix build/wfts-secondary/matrix.csv \
            --output build/wfts-secondary/preflight.json
      - name: Run frozen primary WFTS core first
        run: |
          python scripts/wfts/run_wfts_confirmatory_analysis_v0_5.py \
            --runs build/wfts-secondary/runs.csv \
            --matrix build/wfts-secondary/matrix.csv \
            --preflight-receipt build/wfts-secondary/preflight.json \
            --output build/wfts-secondary/primary.json
      - name: Generate response-free synthetic common-environment covariates
        run: |
          python scripts/wfts/generate_synthetic_common_environment_runs.py \
            --runs build/wfts-secondary/runs.csv \
            --output-runs build/wfts-secondary/common_env_runs.csv \
            --receipt build/wfts-secondary/common_env_receipt.json
      - name: Run prospective secondary diagnostics
        run: |
          python scripts/wfts/run_wfts_secondary_route_night_diagnostics_v0_2.py \
            --runs build/wfts-secondary/runs.csv \
            --matrix build/wfts-secondary/matrix.csv \
            --preflight-receipt build/wfts-secondary/preflight.json \
            --primary-result build/wfts-secondary/primary.json \
            --common-env-runs build/wfts-secondary/common_env_runs.csv \
            --common-env-receipt build/wfts-secondary/common_env_receipt.json \
            --output build/wfts-secondary/secondary.json
      - name: Audit secondary code path without asserting ecological direction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("build/wfts-secondary/secondary.json").read_text())
          assert x["analysis"]=="wfts_prospective_common_environment_and_route_night_diagnostic_v0_2"
          assert x["status"]=="prospective_secondary_executed_after_primary"
          assert x["primary_replication_classification_unchanged"] is True
          assert x["coverage"]["pairs"]==540
          assert x["coverage"]["routes"]==30
          ce=x["common_environment"]
          for key in ("primary_3day","sensitivity_1day","sensitivity_7day"):
              t=ce[key]["test"]
              for k in ("predicted_concentration_beta","observed_conditional_residual","null_residual_ci95","upper_tail_p","pass"):
                  assert k in t,(key,k)
          dep=x["bounded_route_night_dependence"]
          for key in ("all","dry_route_silent"):
              assert -1/9-1e-12 <= dep[key]["rho_bounded"] <= 1+1e-12
              assert len(dep[key]["null_ci95"])==2
          lag=x["route_position_lag_profile"]
          assert set(lag["lags"])==set(str(i) for i in range(1,10))
          assert -1 <= lag["near_lags_1_3"]["rho_lag"] <= 1
          assert -1 <= lag["far_lags_7_9"]["rho_lag"] <= 1
          mon=x["monitoring_uncertainty"]
          assert "eligible_taxa" in mon and "estimable_taxa" in mon
          print({
              "status":"PASS",
              "primary_decision_not_QA_gate":x["primary_decision"],
              "pairs":x["coverage"]["pairs"],
              "bounded_all":dep["all"]["rho_bounded"],
              "far_lag":lag["far_lags_7_9"]["rho_lag"],
              "monitoring_estimable_taxa":mon["estimable_taxa"]
          })
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wfts-secondary-route-night-synthetic-qa
          path: |
            build/wfts-secondary/preflight.json
            build/wfts-secondary/primary.json
            build/wfts-secondary/common_env_receipt.json
            build/wfts-secondary/secondary.json
          if-no-files-found: error
