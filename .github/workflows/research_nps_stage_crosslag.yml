name: Research — NPS stage cross-lag (exploratory, frozen)
on:
  push:
    branches: [integration/stage-legacy-unified-2026-10-25]
    paths:
      - research/scripts/nps_stage_crosslag.py
      - research/NPS_GREEN_FROG_WOOD_FROG_ACOUSTIC_CROSSLAG_SPEC_2026-10-26.md
      - .github/workflows/research_nps_stage_crosslag.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acoustic-history-by-species:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy==2.2.6 pandas==2.2.3
      - name: SHA-pinned NPS strict calendar-year cross-lag; no RC6 or Dryad outcome join
        run: python research/scripts/nps_stage_crosslag.py --out /tmp/NPS_STAGE_CROSSLAG_RESULTS.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nps_stage_crosslag_exploratory_result
          path: /tmp/NPS_STAGE_CROSSLAG_RESULTS.json
          if-no-files-found: warn
