name: frogcs RC11 scientific submission bundle
on:
  push:
    branches:
      - revision/rc10-reviewer-defense-v1
      - main
      - release/jae-v1-rc11
      - submission/jae-v1
    paths:
      - ".github/workflows/review_submission_bundle_rc11.yml"
      - "submission/HUMAN_FINALIZATION_RC11.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -q python-docx==1.2.0
      - name: Run RC11 package audits
        run: |
          python scripts/audit_rc11_submission_package.py
          python scripts/audit_jae_initial_submission_rc11_2026.py
      - name: Build anonymous DOCX files
        run: |
          python scripts/build_jae_anonymous_docx.py --source MANUSCRIPT_JAE_V1_3.md --output build/FROG_JAE_ANON_MAIN_V1_3.docx
          python scripts/build_jae_anonymous_docx.py --source SUPPORTING_INFORMATION_JAE_RC11_V0_1.md --output build/FROG_JAE_SUPPORTING_INFORMATION_RC11.docx
      - name: Assemble scientific review bundle
        run: |
          set -eu
          out=build/rc11-scientific-submission-bundle
          mkdir -p "$out"
          cp MANUSCRIPT_JAE_V1_3.md "$out/"
          cp build/FROG_JAE_ANON_MAIN_V1_3.docx "$out/"
          cp SUPPORTING_INFORMATION_JAE_RC11_V0_1.md "$out/"
          cp build/FROG_JAE_SUPPORTING_INFORMATION_RC11.docx "$out/"
          cp figures_ecology_v1_0/FIGURE_1_METACOMMUNITY_EXPANSION_V0_1.svg "$out/"
          cp figures_ecology_v1_2/*.svg "$out/"
          cp submission/COVER_LETTER_JAE_V0_13.md "$out/"
          cp submission/NOVELTY_AUDIT_V0_11.md "$out/"
          cp submission/REVIEWER_ATTACK_MATRIX_V0_11.md "$out/"
          cp submission/JAE_PORTAL_CHECKLIST_V0_10.md "$out/"
          cp submission/SUBMISSION_HANDOFF_RC11.md "$out/"
          cp submission/HUMAN_FINALIZATION_RC11.md "$out/"
          cp submission/RC11_STORY_FREEZE_V0_1.json "$out/"
          cp submission/JAE_INITIAL_SUBMISSION_AUDIT_RC11_2026_09_28.md "$out/"
          cp NAAMP_SAME_OBSERVER_ROBUSTNESS_CONTRACT_V0_1.json "$out/"
          cp NAAMP_SAME_OBSERVER_ROBUSTNESS_SUMMARY_V0_1.json "$out/"
          cp NAAMP_UNIFORM_ACTIVATION_NULL_SUMMARY_V0_1.json "$out/"
          cp NAAMP_SORENSEN_EQUIVALENCE_SUMMARY_V0_1.json "$out/"
          cp NAAMP_PERSISTENCE_PRESERVING_NULL_SUMMARY_V0_1.json "$out/"
          cp CROSSCONTINENTAL_ACTIVE_DEPTH_SUMMARY_V0_1.json "$out/"
          cp JAE_TITLE_PAGE_V0_8.template.md "$out/"
          cp submission/SUBMISSION_METADATA_TEMPLATE_V0_7.yml "$out/"
          cp submission/CITATION_V0_5.cff.template "$out/"
          cat > "$out/BUNDLE_STATUS.txt" <<'TXT'
          RC11 scientific submission bundle: PASS.
          Scientific content and anonymity are machine-validated.
          Private author metadata is intentionally not materialized in this bundle.
          Final human metadata must be completed using submission/HUMAN_FINALIZATION_RC11.md.
          TXT
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib,json,re
          out=Path("build/rc11-scientific-submission-bundle")
          main=out/"FROG_JAE_ANON_MAIN_V1_3.docx"
          si=out/"FROG_JAE_SUPPORTING_INFORMATION_RC11.docx"
          with ZipFile(main) as z:
              doc=z.read("word/document.xml").decode("utf-8")
              core=z.read("docProps/core.xml").decode("utf-8")
          with ZipFile(si) as z:
              sidoc=z.read("word/document.xml").decode("utf-8")
              sicore=z.read("docProps/core.xml").decode("utf-8")
          assert "3,152 wetter" in doc
          assert "each species its own rainfall-response shift remains untested" in doc
          assert "Same-observer sensitivity".lower() in sidoc.lower()
          assert not re.search(r"<dc:creator>[^<]+</dc:creator>",core)
          assert not re.search(r"<dc:creator>[^<]+</dc:creator>",sicore)
          rows={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.iterdir()) if p.is_file()}
          (out/"SHA256SUMS.json").write_text(json.dumps(rows,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print({"status":"PASS","bundle_files_before_manifest":len(rows)})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frogcs-jae-rc11-v1-3-scientific-submission-bundle
          path: build/rc11-scientific-submission-bundle/
          if-no-files-found: error
