name: Public repository author metadata protection QA

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/pulse_template_submission_pipeline.yml"
      - ".github/workflows/jae_public_metadata_protection_qa.yml"
  push:
    branches:
      - security/jae-public-private-artifact-guard-2026-10-16
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private_artifact_fail_closed:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Static public-repository private-asset execution gate
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path(".github/workflows/pulse_template_submission_pipeline.yml").read_text()
          assert "refuse-public-private-bundle:" in text
          public_reject=text.split("  refuse-public-private-bundle:\n",1)[1].split("\n  private-bundle:\n",1)[0]
          assert "!github.event.repository.private" in public_reject
          assert "exit 1" in public_reject
          private=text.split("\n  private-bundle:\n",1)[1]
          job_header=private.split("\n    needs:",1)[0]
          assert "github.event.repository.private" in job_header
          assert private.index("Refuse private processing if repository is public") < private.index("Materialize private metadata")
          assert 'REPO_VISIBILITY: \${{ github.event.repository.visibility }}' in private
          assert "scripts/submission/render_submission_metadata.py" in text
          print("PASS: public workflow rejects identifying JAE submissions BEFORE secret materialization or artifact upload")
          PY
