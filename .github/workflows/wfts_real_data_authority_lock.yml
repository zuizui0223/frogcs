name: WFTS real-data authority lock

on:
  push:
    branches: [main]
    paths:
      - "revision/WFTS_REAL_DATA_EXECUTION_LOCK_V0_1.json"
      - "revision/WFTS_CONFIRMATORY_AUTHORITY_V0_4.md"
      - "revision/WFTS_CONFIRMATORY_AUTHORITY_V0_2.md"
      - "revision/WFTS_CANONICAL_SCHEMA_V0_2.json"
      - "revision/WFTS_WEATHER_AND_ANALYSIS_SPEC_V0_5.md"
      - "revision/WFTS_DAYMET_WEATHER_SPEC_V0_1.md"
      - "revision/WFTS_PROSPECTIVE_COMMON_ENVIRONMENT_DIAGNOSTIC_V0_2.json"
      - "revision/WFTS_PROSPECTIVE_DEEP_TEMPLATE_ALIGNMENT_V0_1.json"
      - "revision/WFTS_RAW_TO_CANONICAL_RULES_V0_1.md"
      - "revision/WFTS_RAW_TO_CANONICAL_MAPPING_TEMPLATE_V0_1.json"
      - "scripts/wfts/build_daymet_covariates.py"
      - "scripts/wfts/preflight_wfts_structure.py"
      - "scripts/wfts/run_wfts_confirmatory_analysis_v0_5.py"
      - "scripts/wfts/build_common_environment_covariates.py"
      - "scripts/wfts/run_wfts_secondary_route_night_diagnostics_v0_2.py"
      - "scripts/wfts/run_wfts_deep_template_alignment_v0_1.py"
      - "scripts/wfts/receipt_raw_wfts_files.py"
      - "scripts/wfts/inspect_wfts_schema_only.py"
      - "scripts/wfts/audit_wfts_route_master.py"
      - ".github/workflows/wfts_real_data_authority_lock.yml"
  pull_request:
    branches: [main]
    paths:
      - "revision/WFTS_REAL_DATA_EXECUTION_LOCK_V0_1.json"
      - "revision/WFTS_CONFIRMATORY_AUTHORITY_V0_4.md"
      - "revision/WFTS_CONFIRMATORY_AUTHORITY_V0_2.md"
      - "revision/WFTS_CANONICAL_SCHEMA_V0_2.json"
      - "revision/WFTS_WEATHER_AND_ANALYSIS_SPEC_V0_5.md"
      - "revision/WFTS_DAYMET_WEATHER_SPEC_V0_1.md"
      - "revision/WFTS_PROSPECTIVE_COMMON_ENVIRONMENT_DIAGNOSTIC_V0_2.json"
      - "revision/WFTS_PROSPECTIVE_DEEP_TEMPLATE_ALIGNMENT_V0_1.json"
      - "revision/WFTS_RAW_TO_CANONICAL_RULES_V0_1.md"
      - "revision/WFTS_RAW_TO_CANONICAL_MAPPING_TEMPLATE_V0_1.json"
      - "scripts/wfts/**"
      - ".github/workflows/wfts_real_data_authority_lock.yml"
  workflow_dispatch:

permissions: {contents: read}

jobs:
  verify-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify locked Git blobs
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          lock=json.loads(Path("revision/WFTS_REAL_DATA_EXECUTION_LOCK_V0_1.json").read_text())
          bad=[]
          rows=[]
          for path,expected in lock["files"].items():
              p=Path(path)
              if not p.exists():
                  bad.append((path,expected,"MISSING"))
                  continue
              got=subprocess.check_output(["git","hash-object",path],text=True).strip()
              rows.append({"path":path,"expected":expected,"got":got,"match":got==expected})
              if got!=expected:
                  bad.append((path,expected,got))
          print(json.dumps({"lock_id":lock["lock_id"],"files":rows},indent=2))
          if bad:
              raise SystemExit("WFTS authority drift: "+repr(bad))
          print("WFTS_REAL_DATA_AUTHORITY_LOCK=PASS")
          PY
      - name: Verify current execution tuple
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path("revision/WFTS_REAL_DATA_EXECUTION_LOCK_V0_1.json").read_text())
          assert lock["real_data_authority"]=="revision/WFTS_CONFIRMATORY_AUTHORITY_V0_4.md"
          required=[
            "scripts/wfts/preflight_wfts_structure.py",
            "scripts/wfts/run_wfts_confirmatory_analysis_v0_5.py",
            "scripts/wfts/run_wfts_secondary_route_night_diagnostics_v0_2.py",
            "scripts/wfts/run_wfts_deep_template_alignment_v0_1.py",
          ]
          for p in required:
              assert p in lock["files"],p
          print({"status":"PASS","authority":lock["real_data_authority"],"n_locked_files":len(lock["files"])})
          PY
