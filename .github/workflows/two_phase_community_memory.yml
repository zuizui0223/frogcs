name: frogcs two-phase community memory

on:
  push:
    branches:
      - revision/two-phase-community-memory-v1
    paths:
      - "NAAMP_TWO_PHASE_COMMUNITY_MEMORY_CONTRACT_V0_1.json"
      - "scripts/run_naamp_two_phase_community_memory.py"
      - ".github/workflows/two_phase_community_memory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - name: Run frozen dry-dry background test
        run: python scripts/run_naamp_two_phase_community_memory.py
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-two-phase-community-memory-v0-1
          path: NAAMP_TWO_PHASE_COMMUNITY_MEMORY_RECEIPT_V0_1.json
          if-no-files-found: error
