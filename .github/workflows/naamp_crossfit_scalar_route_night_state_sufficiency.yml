name: NAAMP crossfit scalar route-night state sufficiency

on:
  push:
    branches: [main]
    paths:
      - exploration/NAAMP_CROSSFIT_SCALAR_ROUTE_NIGHT_STATE_SUFFICIENCY_CONTRACT_V0_1.json
      - exploration/run_naamp_crossfit_scalar_route_night_state_sufficiency.py
      - .github/workflows/naamp_crossfit_scalar_route_night_state_sufficiency.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naamp-crossfit-scalar-route-night-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q icechunk xarray zarr numpy pandas scipy statsmodels patsy timezonefinder 'numcodecs[pcodec]'
      - name: Run cross-fitted scalar-state sufficiency test
        run: python exploration/run_naamp_crossfit_scalar_route_night_state_sufficiency.py
      - name: Validate receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("exploration/NAAMP_CROSSFIT_SCALAR_ROUTE_NIGHT_STATE_SUFFICIENCY_RECEIPT_V0_1.json").read_text())
          assert x["coverage"]["pairs"]==2835,x["coverage"]
          assert x["coverage"]["dry_route_silent_clusters"]==8343,x["coverage"]
          for f in ("A","B"):
              assert x["crossfit_latent_training"]["fold_"+f]["sigma_hat"]>=0
          print(json.dumps({
              "training":x["crossfit_latent_training"],
              "concentration":x["scalar_state_concentration"],
              "lags":x["scalar_state_lag_profile"],
              "decision":x["decision"]
          },indent=2))
          PY
      - name: Commit receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exploration/NAAMP_CROSSFIT_SCALAR_ROUTE_NIGHT_STATE_SUFFICIENCY_RECEIPT_V0_1.json
          if git diff --cached --quiet; then
            echo "Receipt unchanged"
          else
            git commit -m "Record cross-fitted scalar route-night state sufficiency"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main && exit 0
              sleep 2
            done
            exit 1
          fi
