name: Research prior larvae exploratory replay
on:
  pull_request:
    paths:
      - 'research/scripts/*prior_larvae_exploratory*'
      - 'research/scripts/*stage_annual_bridge*'
      - 'research/results/prior_larvae_exploratory_20261026/**'
      - '.github/workflows/research_prior_larvae_replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prior-larvae-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy==2.2.6 pandas==2.3.3
      - run: python -m unittest discover -s research/scripts -p test_inbo_prior_larvae_exploratory.py
      - run: python -m unittest discover -s research/scripts -p test_stage_annual_bridge.py
      - run: python research/scripts/inbo_prior_larvae_exploratory.py --out /tmp/prior-larvae/observed_results.json
      - run: python research/scripts/stage_annual_bridge_check.py --out /tmp/prior-larvae/annual_bridge.json
      - name: Compare aggregate replay
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          def same(a,b):
              if isinstance(a,dict):
                  assert a.keys()==b.keys()
                  for key in a: same(a[key],b[key])
              elif isinstance(a,list):
                  assert len(a)==len(b)
                  for x,y in zip(a,b): same(x,y)
              elif isinstance(a,float): assert math.isclose(a,b,rel_tol=1e-10,abs_tol=1e-12)
              else: assert a==b
          for name in ('observed_results.json','annual_bridge.json'):
              same(json.loads(Path('research/results/prior_larvae_exploratory_20261026',name).read_text()),
                   json.loads(Path('/tmp/prior-larvae',name).read_text()))
              print('PASS',name)
          PY
      - run: python research/scripts/verify_macro_snapshot.py
