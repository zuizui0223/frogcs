name: NAAMP RS coordinate eligibility

on:
  push:
    branches:
      - remotesensing/naamp-dynamic-hydrology-v1
    paths:
      - ".github/workflows/naamp_rs_coordinate_eligibility.yml"
      - "scripts/remotesensing/audit_naamp_rs_coordinates_v0_1.py"
      - "remotesensing/NAAMP_RS_COORDINATE_ELIGIBILITY_CONTRACT_V0_1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numpy
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run geometry-only coordinate audit
        run: python scripts/remotesensing/audit_naamp_rs_coordinates_v0_1.py
      - name: Upload response-blind receipt
        uses: actions/upload-artifact@v4
        with:
          name: naamp-rs-coordinate-eligibility
          path: remotesensing/NAAMP_RS_COORDINATE_ELIGIBILITY_RECEIPT_V0_1.json
