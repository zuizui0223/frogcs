name: NAAMP 2001 JRC source sharded retry and QC
on:
  push:
    branches: [research/vegetation-hydrology-feasibility-2026-10]
    paths:
      - "studies/vegetation_hydrology/scripts/run_jrc_prior_month_shard.py"
      - "studies/vegetation_hydrology/tests/test_jrc_shard.py"
      - ".github/workflows/vegetation_hydrology_jrc_year2001_shards.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  jrc-tile-shard:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 22
    defaults:
      run:
        working-directory: studies/vegetation_hydrology
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audited geospatial dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify deterministic partition and missing-pixel safety
        run: python -m unittest discover -s tests -p test_jrc_shard.py -v
      - name: Load original checksum-pinned NAAMP coordinates and visit calendar, no outcomes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/qc
          gh run download 39960918335 --repo zuizui0223/frogcs --name public-NAAMP-outcome-blind-site-frame --dir data/qc
      - name: Run source tile-month shard
        run: |
          python scripts/run_jrc_prior_month_shard.py \
            --year 2001 \
            --shard-count 6 \
            --shard-index ${{ matrix.shard }} \
            --accepted-coordinates data/qc/accepted_coordinates.csv \
            --site-calendar data/qc/survey_site_calendar.csv \
            --out-dir data/qc/jrc_2001_shards
      - name: Publish source manifest and all successful/failed station keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naamp-jrc-2001-shard${{ matrix.shard }}-of6-environment-only
          path: studies/vegetation_hydrology/data/qc/jrc_2001_shards/
          if-no-files-found: warn
