name: threshold recruitment taxonomic breadth
on:
  push:
    branches:
      - exploration/taxonomic-breadth-v1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - run: python -m compileall -q exploration scripts
      - run: python exploration/run_naamp_threshold_recruitment_taxonomic_breadth.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-threshold-recruitment-taxonomic-breadth-v0-1
          path: |
            exploration/NAAMP_THRESHOLD_RECRUITMENT_TAXONOMIC_BREADTH_CONTRACT_V0_1.json
            exploration/NAAMP_THRESHOLD_RECRUITMENT_TAXONOMIC_BREADTH_RECEIPT_V0_1.json
          if-no-files-found: error
