name: frogcs metacommunity alpha-beta-gamma

on:
  push:
    branches:
      - revision/metacommunity-alpha-beta-gamma-v1
    paths:
      - "NAAMP_METACOMMUNITY_ALPHA_BETA_GAMMA_CONTRACT_V0_1.json"
      - "scripts/run_naamp_metacommunity_alpha_beta_gamma.py"
      - ".github/workflows/metacommunity_alpha_beta_gamma.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - name: Run frozen alpha-beta-gamma analysis
        run: python scripts/run_naamp_metacommunity_alpha_beta_gamma.py
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-metacommunity-alpha-beta-gamma-v0-1
          path: NAAMP_METACOMMUNITY_ALPHA_BETA_GAMMA_RECEIPT_V0_1.json
          if-no-files-found: error
