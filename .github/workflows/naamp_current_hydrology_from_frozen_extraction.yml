name: NAAMP current-hydrology mechanism from frozen extraction
# rerun after full-rank fold design fix

on:
  push:
    branches:
      - remotesensing/naamp-dynamic-hydrology-v1
    paths:
      - ".github/workflows/naamp_current_hydrology_from_frozen_extraction.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy statsmodels patsy
      - name: Download corrected response-blind extraction artifact
        uses: actions/download-artifact@v4
        with:
          name: naamp-jrc-hydrology-mechanism-v04
          path: frozen_hydrology
          github-token: ${{ github.token }}
          run-id: 37607007300
      - name: Locate frozen hydrology table
        run: find frozen_hydrology -maxdepth 3 -type f -print
      - name: Run latest frozen M1/M3 gate mechanism code
        env:
          NAAMP_HYDRO_VARIABILITY_CSV: frozen_hydrology/NAAMP_JRC_V1_HYDROLOGY_VARIABILITY_V0_2.csv
        run: python scripts/remotesensing/run_naamp_dynamic_hydrology_mechanism.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-current-hydrology-mechanism-final
          path: remotesensing/NAAMP_DYNAMIC_HYDROLOGY_MECHANISM_RECEIPT_V0_1.json
          retention-days: 30
