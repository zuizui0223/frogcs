name: frogcs within-active depth decomposition

on:
  push:
    branches:
      - revision/within-active-depth-decomposition-v1
    paths:
      - "NAAMP_WITHIN_ACTIVE_DEPTH_CONTRACT_V0_1.json"
      - "scripts/run_naamp_within_active_depth_decomposition.py"
      - ".github/workflows/within_active_depth_decomposition.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - name: Run frozen within-active decomposition
        run: python scripts/run_naamp_within_active_depth_decomposition.py
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-within-active-depth-v0-1
          path: NAAMP_WITHIN_ACTIVE_DEPTH_RECEIPT_V0_1.json
          if-no-files-found: error
