name: Frogcs empirical NAAMP nearest-neighbour crosslag and shared-environment null pilot

on:
  push:
    branches:
      - research/spatial-dispersal-identifiability-pilot-20261031
    paths:
      - research/scripts/observed_neighbour_lag_dispersal_identifiability.py
      - research/scripts/test_observed_neighbour_lag_dispersal_identifiability.py
      - .github/workflows/research_neighbour_lag_environment_disperse_pilot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-naamp-observed-crosslag-and-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: c5ad81b1fb29a9bb92d742ee7004ae66a404dca9
    steps:
      - uses: actions/checkout@v4
        with:
          path: editorial
      - uses: actions/checkout@v4
        with:
          ref: c5ad81b1fb29a9bb92d742ee7004ae66a404dca9
          path: source
          sparse-checkout: |
            research/scripts
            research/results/naamp_remote_vegetation_20261026
            research/results/naamp_three_guild_occurrence/full_naamp_history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only source-analysis numerical dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2'
      - name: Verify time separation, geometry and environmental-only null
        run: |
          python -m unittest discover -s editorial/research/scripts -p test_observed_neighbour_lag_dispersal_identifiability.py -v
      - name: Execute TRUE 4248-NAAMP-site/63180-survey annual historical spatial pattern
        run: |
          python editorial/research/scripts/observed_neighbour_lag_dispersal_identifiability.py --source-root source --out editorial/research/results/naamp_spatial_neighbour_lag_20261031 --reps 32 --boot 399
      - name: Archive only aggregate scientific indicators, not raw site-year records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-real-naamp-neighbour-crosslag-and-synthetic-environment-null
          path: editorial/research/results/naamp_spatial_neighbour_lag_20261031/
          if-no-files-found: warn
          retention-days: 30
