name: Frogcs original main 3600 joint ABC-POM verification

on:
  push:
    branches:
      - research/abc-pom-main3600-joint-20261101
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 pandas==2.3.3 scipy==1.15.3
      - name: Joint prior + true kernel tests
        run: python -m unittest discover -s research/scripts -p 'test_abc_pom_main3600.py' -v
      - name: Independently audit immutable 194400 source cells
        run: python research/scripts/audit_main3600_direction.py
      - uses: actions/upload-artifact@v4
        with:
          name: main3600-frozen-factorial-audit
          path: |
            research/results/abc_pom_main3600_20261101/fixed_screen_audit.json
            research/results/abc_pom_main3600_20261101/fixed_screen_stage_rates.csv
            research/results/abc_pom_main3600_20261101/fixed_screen_axes.csv
            research/results/abc_pom_main3600_20261101/fixed_screen_directional_scores.csv.gz
          if-no-files-found: error

  joint-abc:
    needs: frozen-source-audit
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 pandas==2.3.3 scipy==1.15.3
      - name: 2500 prior draw sharded actual seasonal + annual simulations
        run: >-
          python research/scripts/abc_pom_main3600.py
          --draws 20000 --seed 20261101
          --shards 8 --shard ${{ matrix.shard }}
          --years 40 --window 10 --dt 0.5 --chunk 96
      - uses: actions/upload-artifact@v4
        with:
          name: main3600-joint-abc-shard-${{ matrix.shard }}
          path: research/results/abc_pom_main3600_20261101/shard_*.csv.gz
          if-no-files-found: error

  source-verified-summary:
    needs: joint-abc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 pandas==2.3.3 scipy==1.15.3
      - uses: actions/download-artifact@v4
        with:
          pattern: main3600-joint-abc-shard-*
          merge-multiple: true
          path: research/results/abc_pom_main3600_20261101
      - name: Aggregate exact 20000 proposal IDs and report posterior/prior contrasts
        run: >-
          python research/scripts/abc_pom_main3600.py
          --draws 20000 --shards 8 --summarize-only
      - uses: actions/upload-artifact@v4
        with:
          name: main3600-joint-abc-verified-final
          path: |
            research/results/abc_pom_main3600_20261101/summary.json
            research/results/abc_pom_main3600_20261101/axis_acceptance.csv
            research/results/abc_pom_main3600_20261101/model_acceptance.csv
            research/results/abc_pom_main3600_20261101/accepted_draws.csv.gz
          if-no-files-found: error
