name: JRC three-product IO smoke
on:
  push:
    branches: [remotesensing/naamp-dynamic-hydrology-v1]
    paths:
      - ".github/workflows/jrc_three_product_smoke.yml"
      - "scripts/remotesensing/smoke_jrc_three_products.py"
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check numpy rasterio
      - run: python scripts/remotesensing/smoke_jrc_three_products.py
