name: EC JRC previous-month water at nine real NAAMP site-surveys
on:
  push:
    branches: [research/vegetation-hydrology-feasibility-2026-10]
    paths:
      - "studies/vegetation_hydrology/scripts/pilot_jrc_prior_month.py"
      - "studies/vegetation_hydrology/tests/test_jrc_prior_month.py"
      - ".github/workflows/vegetation_hydrology_jrc_prior_month_pilot.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-prior-month-water:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: studies/vegetation_hydrology
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify JRC grid math before accessing sources
        run: python -m unittest discover -s tests -p test_jrc_prior_month.py -v
      - name: Restore exact SHA256-pinned outcome-blind station metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/qc
          gh run download 39960918335 --repo zuizui0223/frogcs --name public-NAAMP-outcome-blind-site-frame --dir data/qc
          echo '2dbd226a117e5d2c9c10dbd6340fb86a07320b2925aaca3249c8a307a5071afc  data/qc/accepted_coordinates.csv' | sha256sum --check --status
          echo 'e6fc079ace3642a0ed4330dc05a4b8770fdf89cefabfaca0e490dcb3fd8c45cf  data/qc/survey_site_calendar.csv' | sha256sum --check --status
      - name: Install only raster extraction dependencies
        run: python -m pip install numpy rasterio pyproj
      - name: Read strictly preceding month at 9 real NAAMP survey events
        run: |
          python scripts/pilot_jrc_prior_month.py \
            --accepted-coordinates data/qc/accepted_coordinates.csv \
            --site-calendar data/qc/survey_site_calendar.csv \
            --out data/qc/jrc_prior_month_real_naamp_pilot.json
      - name: Publish only environmental pilot receipt (no frog outcomes)
        uses: actions/upload-artifact@v4
        with:
          name: jrc-gsw-previous-month-real-naamp-9events
          path: studies/vegetation_hydrology/data/qc/jrc_prior_month_real_naamp_pilot.json
          if-no-files-found: error
