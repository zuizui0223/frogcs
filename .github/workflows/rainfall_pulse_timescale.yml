name: frogcs rainfall-pulse timescale

on:
  push:
    branches:
      - revision/rainfall-pulse-timescale-v1
    paths:
      - "NAAMP_RAINFALL_PULSE_TIMESCALE_CONTRACT_V0_1.json"
      - "scripts/run_naamp_rainfall_pulse_timescale.py"
      - ".github/workflows/rainfall_pulse_timescale.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timescale:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - name: Run frozen rainfall-pulse timescale analysis
        run: python scripts/run_naamp_rainfall_pulse_timescale.py
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-rainfall-pulse-timescale-v0-1
          path: NAAMP_RAINFALL_PULSE_TIMESCALE_RECEIPT_V0_1.json
          if-no-files-found: error
