# Compatibility alias: canonical RC9/v1.1 anonymous-DOCX workflow.
name: frogcs JAE anonymous DOCX (RC9 alias)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q python-docx==1.2.0
      - name: Audit RC9 scientific package
        run: python scripts/audit_rc9_submission_package.py
      - name: Build anonymous RC9 main DOCX
        run: |
          python scripts/build_jae_anonymous_docx.py             --source MANUSCRIPT_JAE_V1_1.md             --output build/FROG_JAE_ANON_MAIN_V1_1.docx
      - name: Build anonymous RC9 Supporting Information DOCX
        run: |
          python scripts/build_jae_anonymous_docx.py             --source SUPPORTING_INFORMATION_JAE_RC9_V0_1.md             --output build/FROG_JAE_SUPPORTING_INFORMATION_RC9.docx
      - name: Verify RC9 anonymous main DOCX
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import re
          p=Path("build/FROG_JAE_ANON_MAIN_V1_1.docx")
          assert p.is_file() and p.stat().st_size>10000
          with ZipFile(p) as z:
              document=z.read("word/document.xml").decode("utf-8")
              footer=z.read("word/footer1.xml").decode("utf-8")
              core=z.read("docProps/core.xml").decode("utf-8")
          expected="Rainfall-associated expansion of frog active communities crosses spatial and taxonomic boundaries without practical homogenization"
          assert expected in core
          assert "<w:lnNumType" in document
          assert 'w:restart="continuous"' in document
          assert "PAGE" in footer
          assert "80.9% boundary crossing" in document
          assert not re.search(r"<dc:creator>[^<]+</dc:creator>", core)
          print("RC9 anonymous DOCX alias PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frogcs-jae-v1-1-rc9-anonymous-docx-alias
          path: |
            build/FROG_JAE_ANON_MAIN_V1_1.docx
            build/FROG_JAE_SUPPORTING_INFORMATION_RC9.docx
          if-no-files-found: error
