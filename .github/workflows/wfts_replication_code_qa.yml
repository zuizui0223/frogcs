name: WFTS prospective replication code QA

on:
  push:
    branches: [revision/pulse-template-synthesis-v1]
    paths:
      - revision/WFTS_CANONICAL_SCHEMA_V0_1.json
      - revision/WFTS_WEATHER_AND_ANALYSIS_SPEC_V0_3.md
      - scripts/wfts/**
      - .github/workflows/wfts_replication_code_qa.yml
  pull_request:
    branches: [main]

concurrency:
  group: wfts-replication-code-${{ github.ref }}
  cancel-in-progress: true

permissions: {contents: read}

jobs:
  synthetic-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels
      - name: Generate synthetic WFTS-shaped fixture
        run: python scripts/wfts/generate_synthetic_wfts_fixture.py --outdir build/wfts-synthetic
      - name: Run frozen confirmatory analysis code on synthetic data
        run: |
          python scripts/wfts/run_wfts_confirmatory_analysis_v0_3.py             --runs build/wfts-synthetic/runs.csv             --matrix build/wfts-synthetic/matrix.csv             --output build/wfts-synthetic/receipt.json
      - name: Audit synthetic receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("build/wfts-synthetic/receipt.json").read_text())
          assert x["coverage"]["gate_pass"] is True
          assert x["response_endpoints_read"] is True
          assert x["coverage"]["principal_routes"] >= 30
          assert x["coverage"]["principal_history_pairs"] >= 300
          assert x["principal_comparator"]["pass"] in (True,False)
          p=x["principal_comparator"]["upper_tail_p"]
          assert 0 < p <= 1
          assert x["decision"] in ("replication_support","replication_not_supported")
          print({
              "status":"PASS",
              "routes":x["coverage"]["principal_routes"],
              "pairs":x["coverage"]["principal_history_pairs"],
              "p":p,
              "decision":x["decision"],
          })
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wfts-prospective-code-synthetic-qa
          path: build/wfts-synthetic/receipt.json
          if-no-files-found: error
