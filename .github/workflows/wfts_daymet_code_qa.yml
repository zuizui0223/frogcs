name: WFTS Daymet weather adapter QA

on:
  push:
    branches: [revision/pulse-template-synthesis-v1]
    paths:
      - revision/WFTS_DAYMET_WEATHER_SPEC_V0_1.md
      - scripts/wfts/build_daymet_covariates.py
      - scripts/wfts/generate_synthetic_daymet_fixture.py
      - .github/workflows/wfts_daymet_code_qa.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: wfts-daymet-code-qa-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions: {contents: read}

jobs:
  synthetic-weather-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q numpy pandas
      - name: Generate synthetic structural surveys and raw Daymet CSVs
        run: |
          python scripts/wfts/generate_synthetic_daymet_fixture.py --outdir build/daymet-fixture
      - name: Build weather covariates without network access
        run: |
          python scripts/wfts/build_daymet_covariates.py             --station-surveys build/daymet-fixture/station_surveys.csv             --fixture-dir build/daymet-fixture/raw             --cache-dir build/daymet-cache             --output-runs build/daymet-fixture/runs_weather.csv             --output-stations build/daymet-fixture/stations_weather.csv             --receipt build/daymet-fixture/weather_receipt.json
      - name: Audit frozen weather semantics
        run: |
          python - <<'PY'
          import json
          import numpy as np
          import pandas as pd
          from pathlib import Path

          receipt=json.loads(Path("build/daymet-fixture/weather_receipt.json").read_text())
          runs=pd.read_csv("build/daymet-fixture/runs_weather.csv")
          st=pd.read_csv("build/daymet-fixture/stations_weather.csv")

          assert receipt["response_columns_read"] is False
          assert receipt["daymet"]["survey_day_precipitation_used"] is False
          assert receipt["counts"]=={
              "physical_sites":10,
              "route_runs":2,
              "station_surveys":20,
          }

          x12=st[st.survey_year==2012]
          x13=st[st.survey_year==2013]
          assert set(x12.dry_days)=={0}
          assert set(x13.dry_days)=={30}
          assert np.allclose(
              runs.loc[runs.survey_year==2012,"rain_recency"].iloc[0],
              0.0,
          )
          assert np.allclose(
              runs.loc[runs.survey_year==2013,"rain_recency"].iloc[0],
              np.log1p(30),
          )

          # Explicit leap calendar unit: yday 60 = Feb 29 in 2012.
          import importlib.util
          p=Path("scripts/wfts/build_daymet_covariates.py")
          sp=importlib.util.spec_from_file_location("w",p)
          w=importlib.util.module_from_spec(sp); sp.loader.exec_module(w)
          dates=w.daymet_calendar_dates(2012)
          assert dates[59]==pd.Timestamp("2012-02-29")
          assert dates[-1]==pd.Timestamp("2012-12-30")
          assert pd.Timestamp("2012-12-31") not in dates

          print({"status":"PASS","rain_2012":0.0,"rain_2013":float(np.log1p(30))})
          PY
      - name: Confirm forbidden frog-response columns fail closed
        run: |
          cp build/daymet-fixture/station_surveys.csv build/daymet-fixture/bad.csv
          python - <<'PY'
          import pandas as pd
          p="build/daymet-fixture/bad.csv"
          x=pd.read_csv(p); x["call_index"]=0; x.to_csv(p,index=False)
          PY
          set +e
          python scripts/wfts/build_daymet_covariates.py             --station-surveys build/daymet-fixture/bad.csv             --fixture-dir build/daymet-fixture/raw             --cache-dir build/daymet-cache2             --output-runs build/daymet-fixture/bad_runs.csv             --output-stations build/daymet-fixture/bad_stations.csv             --receipt build/daymet-fixture/bad_receipt.json
          status=$?
          set -e
          test "$status" -ne 0
      - uses: actions/upload-artifact@v4
        with:
          name: wfts-daymet-synthetic-qa
          path: |
            build/daymet-fixture/weather_receipt.json
            build/daymet-fixture/runs_weather.csv
            build/daymet-fixture/stations_weather.csv
          if-no-files-found: error
