name: frogcs active-matrix density invariance

on:
  push:
    branches:
      - revision/matrix-density-invariance-v1
    paths:
      - "NAAMP_MATRIX_DENSITY_INVARIANCE_CONTRACT_V0_1.json"
      - "scripts/run_naamp_matrix_density_invariance.py"
      - ".github/workflows/matrix_density_invariance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - name: Run frozen matrix-density equivalence test
        run: python scripts/run_naamp_matrix_density_invariance.py
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-matrix-density-invariance-v0-1
          path: NAAMP_MATRIX_DENSITY_INVARIANCE_RECEIPT_V0_1.json
          if-no-files-found: error
