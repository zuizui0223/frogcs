name: Iowa 360417 Annual NLCD C1V0 entire nominal ten-site pixel crop
on:
  push:
    branches:
      - study/climate-landscape-acoustic-sites-v0
    paths:
      - '.github/workflows/climate_nlcd_arcgis_full_source_360417.yml'
      - 'studies/climate_landscape/scripts/pilot_esri_hosted_nlcd_c1v0_360417.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-C1V0-environment-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install raster source-only processing
        run: python -m pip install -r studies/climate_landscape/requirements.txt
      - name: Query exactly the existing 2004 2009 2014 annual images
        run: |
          python studies/climate_landscape/scripts/pilot_esri_hosted_nlcd_c1v0_360417.py \
            --output-dir "$RUNNER_TEMP/iowa360417_arcgis_c1v0_source"
      - name: Upload only raw source crop and provenance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iowa360417-annual-nlcd-C1V0-categorical-source-v16
          path: ${{ runner.temp }}/iowa360417_arcgis_c1v0_source/
          if-no-files-found: error
          retention-days: 30
