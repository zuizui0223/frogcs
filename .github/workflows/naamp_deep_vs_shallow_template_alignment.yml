name: NAAMP deep vs shallow template alignment

on:
  push:
    branches: [main]
    paths:
      - exploration/NAAMP_DEEP_VS_SHALLOW_TEMPLATE_ALIGNMENT_CONTRAST_CONTRACT_V0_1.json
      - exploration/run_naamp_deep_vs_shallow_template_alignment_contrast.py
      - .github/workflows/naamp_deep_vs_shallow_template_alignment.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naamp-deep-vs-shallow-template-alignment
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q icechunk xarray zarr numpy pandas scipy statsmodels patsy timezonefinder 'numcodecs[pcodec]'
      - name: Run fixed direct contrast
        run: python exploration/run_naamp_deep_vs_shallow_template_alignment_contrast.py
      - name: Validate receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("exploration/NAAMP_DEEP_VS_SHALLOW_TEMPLATE_ALIGNMENT_CONTRAST_RECEIPT_V0_1.json")
          x=json.loads(p.read_text())
          assert x["coverage"]["pairs"]==2835
          assert x["coverage"]["routes"]==428
          assert x["coverage"]["deep_k4plus_clusters"]==409
          assert x["coverage"]["shallow_k1to3_clusters"]==838
          assert x["null"]["exact_observed_k_fixed"] is True
          print(json.dumps({
              "coverage":x["coverage"],
              "rainfall_contrast":x["rainfall_coefficient_contrast"],
              "mean_contrast":x["cluster_mean_contrast"],
              "decision":x["decision"]
          },indent=2))
          PY
      - name: Commit receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exploration/NAAMP_DEEP_VS_SHALLOW_TEMPLATE_ALIGNMENT_CONTRAST_RECEIPT_V0_1.json
          if git diff --cached --quiet; then
            echo "Receipt unchanged"
          else
            git commit -m "Record deep-versus-shallow template-alignment contrast"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main && exit 0
              sleep 2
            done
            exit 1
          fi
