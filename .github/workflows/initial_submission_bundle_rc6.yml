name: frogcs RC6 initial JAE submission bundle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -q python-docx==1.2.0 PyYAML==6.0.2

      - name: Audit RC6 scientific package
        run: python scripts/audit_rc6_submission_package.py

      - name: Materialize private submission metadata
        env:
          JAE_SUBMISSION_METADATA_YAML: ${{ secrets.JAE_SUBMISSION_METADATA_YAML }}
        run: |
          test -n "$JAE_SUBMISSION_METADATA_YAML" || {
            echo "Missing repository secret JAE_SUBMISSION_METADATA_YAML" >&2
            exit 2
          }
          printf '%s' "$JAE_SUBMISSION_METADATA_YAML" > /tmp/metadata-initial.yml

      - name: Validate and render initial metadata
        run: |
          python scripts/render_submission_metadata.py             --metadata /tmp/metadata-initial.yml             --strict --stage initial             --outdir build/submission-metadata

      - name: Guard current title
        run: |
          python - <<'PY'
          from pathlib import Path
          expected="Rainfall-associated expansion of frog active communities has repeatable species-specific spatial geometry"
          x=Path("build/submission-metadata/JAE_TITLE_PAGE_FINAL.md").read_text(encoding="utf-8")
          if expected not in x:
              raise SystemExit("JAE_SUBMISSION_METADATA_YAML contains a superseded title")
          print("metadata title PASS")
          PY

      - name: Build anonymous v0.8 DOCX
        run: |
          python scripts/build_jae_anonymous_docx.py             --source MANUSCRIPT_JAE_V0_8.md             --output build/FROG_JAE_ANON_MAIN_V0_8.docx

      - name: Build anonymous Supporting Information DOCX
        run: |
          python scripts/build_jae_anonymous_docx.py \
            --source SUPPORTING_INFORMATION_JAE_RC6_V0_1.md \
            --output build/FROG_JAE_SUPPORTING_INFORMATION_RC6.docx

      - name: Verify DOCX structure
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          p=Path("build/FROG_JAE_ANON_MAIN_V0_8.docx")
          with ZipFile(p) as z:
              document=z.read("word/document.xml").decode("utf-8")
              footer=z.read("word/footer1.xml").decode("utf-8")
              core=z.read("docProps/core.xml").decode("utf-8")
          expected="Rainfall-associated expansion of frog active communities has repeatable species-specific spatial geometry"
          assert "<w:lnNumType" in document
          assert 'w:restart="continuous"' in document
          assert "PAGE" in footer
          assert expected in core
          print("DOCX structure PASS")
          PY

      - name: Verify frozen figures
        run: python scripts/verify_metacommunity_figure_hashes_v0_3.py

      - name: Assemble RC6 initial bundle
        run: |
          set -eu
          out=build/initial-submission-rc6
          mkdir -p "$out"
          cp MANUSCRIPT_JAE_V0_8.md "$out/"
          cp build/FROG_JAE_ANON_MAIN_V0_8.docx "$out/"
          cp SUPPORTING_INFORMATION_JAE_RC6_V0_1.md "$out/"
          cp build/FROG_JAE_SUPPORTING_INFORMATION_RC6.docx "$out/"
          cp build/submission-metadata/JAE_TITLE_PAGE_FINAL.md "$out/"
          cp build/submission-metadata/JAE_PORTAL_FIELDS.json "$out/"
          cp build/submission-metadata/SUBMISSION_METADATA_VALIDATION.json "$out/"
          cp figures_ecology_v0_8/*.svg "$out/"
          cp submission/COVER_LETTER_JAE_V0_6.md "$out/"
          cp submission/JAE_PORTAL_CHECKLIST_V0_5.md "$out/"
          cp submission/SUBMISSION_HANDOFF_RC6.md "$out/"
          cp ECOLOGICAL_CLAIM_BOUNDARY_V0_3.json "$out/"
          cp COMMUNITY_ECOLOGY_ARGUMENT_SPINE_V0_1.md "$out/"
          cp NAAMP_METACOMMUNITY_ALPHA_BETA_GAMMA_SUMMARY_V0_1.json "$out/"
          cp NAAMP_SPECIES_STOP_QUADRANTS_SUMMARY_V0_1.json "$out/"
          cp NAAMP_WITHIN_ACTIVE_DEPTH_SUMMARY_V0_1.json "$out/"
          cp NAAMP_FUNCTIONAL_COMMUNITY_EXPANSION_SUMMARY_V0_1.json "$out/"
          cp NAAMP_FUNCTIONAL_RESPONSE_DECOUPLING_SUMMARY_V0_1.json "$out/"
          cp NAAMP_DETECTION_QUALITY_ROBUSTNESS_SUMMARY_V0_1.json "$out/"
          cp NAAMP_MATRIX_DENSITY_INVARIANCE_SUMMARY_V0_1.json "$out/"
          cp NAAMP_SPECIES_ACTIVATION_GEOMETRY_REPEATABILITY_SUMMARY_V0_1.json "$out/"
          cp NAAMP_RESPONSE_GEOMETRY_VS_MAGNITUDE_SUMMARY_V0_1.json "$out/"
          cp SPECIES_RESPONSE_TRAIT_FRAMEWORK_V0_1.md "$out/"

          cat > "$out/INITIAL_SUBMISSION_README.txt" <<'TXT'
          Canonical initial JAE submission: RC6 / ecological v0.8 metacommunity synthesis.
          Scientific authority: MANUSCRIPT_JAE_V0_8.md + ECOLOGICAL_CLAIM_BOUNDARY_V0_3.json.
          Main figures: figures_ecology_v0_8/.
          RC5/v0.6 week-scale submission surfaces are superseded and remain audit history only.
          Archive DOI is intentionally deferred during double-anonymized review.
          TXT

          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          out=Path("build/initial-submission-rc6")
          rows={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.iterdir()) if p.is_file()}
          (out/"SHA256SUMS.json").write_text(json.dumps(rows,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print({"bundle_files_before_manifest":len(rows),"status":"PASS"})
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: frogcs-jae-rc6-v0-8-initial-submission-bundle
          path: build/initial-submission-rc6/
          if-no-files-found: error
