name: Iowa NAAMP historical stop wetness schema gate v3.1
on:
  push:
    branches:
      - audit/iowa-station-waterstate-source-gate-v31
    paths:
      - "studies/climate_landscape/scripts/audit_original_naamp_stop_hydrology_header_v31.py"
      - ".github/workflows/iowa_naamp_historical_wetness_schema_v31.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only-header:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit original checksum-pinned Runs and Stops only
        run: python studies/climate_landscape/scripts/audit_original_naamp_stop_hydrology_header_v31.py
      - name: Upload source-only header receipt
        uses: actions/upload-artifact@v4
        with:
          name: iowa-naamp-historical-wetness-header-v31
          path: studies/climate_landscape/receipts/NAAMP_ORIGINAL_STOP_HYDROLOGY_HEADER_ACTUAL_V31.json
          if-no-files-found: error
