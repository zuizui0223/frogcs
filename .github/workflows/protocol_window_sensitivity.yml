name: NAAMP protocol-window sensitivity

on:
  push:
    branches:
      - revision/protocol-window-sensitivity-v1
    paths:
      - "provenance/contracts/NAAMP_PROTOCOL_WINDOW_SENSITIVITY_CONTRACT_V0_1.json"
      - "scripts/naamp/run_naamp_protocol_window_sensitivity.py"
      - ".github/workflows/protocol_window_sensitivity.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas statsmodels
      - name: Run frozen protocol-window sensitivity
        run: python scripts/naamp/run_naamp_protocol_window_sensitivity.py
      - uses: actions/upload-artifact@v4
        with:
          name: protocol-window-sensitivity
          path: provenance/receipts/NAAMP_PROTOCOL_WINDOW_SENSITIVITY_RECEIPT_V0_1.json
          if-no-files-found: error
