name: v6.8 synthetic common-mode water logger acoustic-memory QA
on:
  push:
    branches:
      - audit/iowa-station-waterstate-source-gate-v31
    paths:
      - "studies/climate_landscape/V6_8_COMMON_MODE_DEPTH_LOGGER_ERROR_COUNTEREXAMPLE_CONTRACT.md"
      - "studies/climate_landscape/scripts/test_correlated_depth_loggers_false_chorus_history_v68.py"
      - ".github/workflows/shared_logger_depth_error_synthetic_v68.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-versus-independent-depth-error:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install numeric dependencies
        run: python -m pip install "numpy>=1.26,<3" "scikit-learn>=1.5,<2"
      - name: Simulate zero-direct-lag frog responses and correlated water-depth measurement errors
        run: python studies/climate_landscape/scripts/test_correlated_depth_loggers_false_chorus_history_v68.py
