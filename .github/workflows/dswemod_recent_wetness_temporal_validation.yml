name: DSWEmod recent-wetness temporal validation

concurrency:
  group: dswemod-recent-wetness-temporal-validation
  cancel-in-progress: true

# latest-spec trigger: training-only species pools

on:
  push:
    branches:
      - remotesensing/naamp-dynamic-hydrology-v1
    paths:
      - ".github/workflows/dswemod_recent_wetness_temporal_validation.yml"
      - "scripts/remotesensing/run_naamp_dswemod_recent_wetness_temporal_validation.py"
      - "revision/NAAMP_DSWEMOD_RECENT_WETNESS_TEMPORAL_VALIDATION_V0_1.md"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy pandas scipy statsmodels patsy
      - uses: actions/download-artifact@v4
        with:
          name: naamp-dswemod-v02-reuse-result
          path: frozen_dswemod
          github-token: ${{ github.token }}
          run-id: 37615425574
      - name: Run frozen temporal validation
        env:
          NAAMP_DSWEMOD_CSV: frozen_dswemod/NAAMP_DSWEMOD_RUN_SITE_METRICS_V0_1.csv
        run: python scripts/remotesensing/run_naamp_dswemod_recent_wetness_temporal_validation.py
      - uses: actions/upload-artifact@v4
        with:
          name: dswemod-recent-wetness-temporal-validation
          path: remotesensing/NAAMP_DSWEMOD_RECENT_WETNESS_TEMPORAL_VALIDATION_RECEIPT_V0_1.json
          retention-days: 30
