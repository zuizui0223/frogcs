name: frogcs RC9 scientific package QA
on:
  push:
    branches:
      - main
      - release/jae-v1-rc9
      - submission/jae-v1
    paths:
      - "MANUSCRIPT_JAE_V1_1.md"
      - "SUPPORTING_INFORMATION_JAE_RC9_V0_1.md"
      - "submission/COVER_LETTER_JAE_V0_12.md"
      - "submission/NOVELTY_AUDIT_V0_9.md"
      - "submission/REVIEWER_ATTACK_MATRIX_V0_9.md"
      - "submission/SUBMISSION_HANDOFF_RC9.md"
      - "submission/JAE_PORTAL_CHECKLIST_V0_8.md"
      - "submission/RC9_STORY_FREEZE_V0_1.json"
      - "CROSSCONTINENTAL_ACTIVE_DEPTH_SUMMARY_V0_1.json"
      - "README.md"
      - "submission/SUBMISSION_METADATA_TEMPLATE_V0_6.yml"
      - "submission/HUMAN_FINALIZATION_RC9.md"
      - "JAE_TITLE_PAGE_V0_7.template.md"
      - "submission/CITATION_V0_4.cff.template"
      - "submission/JAE_INITIAL_SUBMISSION_AUDIT_RC9_2026_09_28.md"
      - "scripts/audit_rc9_submission_package.py"
      - ".github/workflows/rc9_submission_package_qa.yml"
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/audit_rc9_submission_package.py
