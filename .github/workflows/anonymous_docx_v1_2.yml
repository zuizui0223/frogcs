name: frogcs JAE v1.2 RC10 anonymous DOCX
on:
  push:
    branches:
      - main
      - release/jae-v1-rc10
      - submission/jae-v1
    paths:
      - "MANUSCRIPT_JAE_V1_2.md"
      - "SUPPORTING_INFORMATION_JAE_RC10_V0_1.md"
      - "scripts/build_jae_anonymous_docx.py"
      - "scripts/audit_rc10_submission_package.py"
      - ".github/workflows/anonymous_docx_v1_2.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q python-docx==1.2.0
      - run: python scripts/audit_rc10_submission_package.py
      - name: Build anonymous RC10 main DOCX
        run: python scripts/build_jae_anonymous_docx.py --source MANUSCRIPT_JAE_V1_2.md --output build/FROG_JAE_ANON_MAIN_V1_2.docx
      - name: Build anonymous RC10 SI DOCX
        run: python scripts/build_jae_anonymous_docx.py --source SUPPORTING_INFORMATION_JAE_RC10_V0_1.md --output build/FROG_JAE_SUPPORTING_INFORMATION_RC10.docx
      - name: Verify RC10 anonymous DOCX
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re
          p=Path("build/FROG_JAE_ANON_MAIN_V1_2.docx")
          assert p.is_file() and p.stat().st_size>10000
          with ZipFile(p) as z:
              doc=z.read("word/document.xml").decode("utf-8")
              core=z.read("docProps/core.xml").decode("utf-8")
          for x in ["more boundary-biased than uniform activation predicts","77.9%","92.0%","persistence-preserving"]:
              assert x in doc,x
          assert not re.search(r"<dc:creator>[^<]+</dc:creator>",core)
          print("RC10 anonymous DOCX QA PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frogcs-jae-v1-2-rc10-anonymous-docx
          path: |
            build/FROG_JAE_ANON_MAIN_V1_2.docx
            build/FROG_JAE_SUPPORTING_INFORMATION_RC10.docx
          if-no-files-found: error
