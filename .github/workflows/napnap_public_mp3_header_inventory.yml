name: Nap Nap public MP3 prefix metadata check
on:
  push:
    branches:
      - audit/iowa-station-waterstate-source-gate-v31
    paths:
      - .github/workflows/napnap_public_mp3_header_inventory.yml
permissions: {}
jobs:
  bounded-public-mp3-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install pinned metadata reader
        run: python3 -m pip install 'mutagen==1.47.0'
      - name: Inspect at most 8192 bytes per source-listed MP3 without decoding audio
        shell: bash
        run: |
          python3 - <<'PY'
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError, URLError
          from io import BytesIO
          from pathlib import Path
          from hashlib import sha256
          from datetime import datetime, timezone
          import json, re, math
          import mutagen
          from mutagen.mp3 import MPEGInfo
          from mutagen.mp3._util import XingHeader, XingHeaderError, VBRIHeader, VBRIHeaderError
          ROOT = 'https://media.flow-mer.org.au/napnap/audio/'
          DATES = ('20200830','20200831','20200901','20200902','20200903','20200904','20200905','20200906','20200907')
          PREFIX_BYTES = 8192
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs): return None
          def parse_prefix(data):
              info = MPEGInfo(BytesIO(data))
              result = {'mpeg_version': info.version, 'layer': info.layer,
                        'sample_rate_hz': info.sample_rate, 'channels': info.channels,
                        'first_frame_offset_bytes': info.frame_offset,
                        'estimated_or_declared_bitrate_bps': info.bitrate,
                        'duration_from_explicit_frame_count_seconds': None,
                        'duration_is_full_playback_verification': False,
                        'frame_count_header': None, 'declared_frame_count': None,
                        'declared_mpeg_bytes': None}
              if info.layer != 3: return result
              stream = BytesIO(data)
              stream.seek(info.frame_offset + XingHeader.get_offset(info))
              try:
                  header = XingHeader(stream)
                  result.update(frame_count_header='Info' if header.is_info else 'Xing',
                      declared_frame_count=header.frames if header.frames >= 0 else None,
                      declared_mpeg_bytes=header.bytes if header.bytes >= 0 else None)
                  if header.frames > 0:
                      result['duration_from_explicit_frame_count_seconds'] = info.length
                      result['encoder_delay_padding_accounted_by_parser'] = header.lame_header is not None
              except XingHeaderError:
                  stream.seek(info.frame_offset + VBRIHeader.get_offset(info))
                  try:
                      header = VBRIHeader(stream)
                      result.update(frame_count_header='VBRI', declared_frame_count=header.frames,
                                    declared_mpeg_bytes=header.bytes)
                      if header.frames > 0:
                          result['duration_from_explicit_frame_count_seconds'] = info.length
                  except VBRIHeaderError: pass
              return result
          def tests():
              frame = bytearray(417)
              frame[:4] = bytes.fromhex('fffb9000')
              plain = parse_prefix(bytes(frame)*4)
              assert plain['duration_from_explicit_frame_count_seconds'] is None
              frame[36:40] = b'Xing'
              frame[40:44] = (3).to_bytes(4, 'big')
              frame[44:48] = (100).to_bytes(4, 'big')
              frame[48:52] = (41700).to_bytes(4, 'big')
              explicit = parse_prefix(bytes(frame)*4)
              assert explicit['declared_frame_count'] == 100
              assert math.isclose(explicit['duration_from_explicit_frame_count_seconds'], 100*1152/44100)
              assert explicit['declared_mpeg_bytes'] == 41700
              print('PASS: binary parser tests distinguish frame-declared duration from partial-file estimate')
          tests()
          report = {'record_kind':'public_mp3_prefix_metadata_not_frog_outcome',
                    'checked_utc':datetime.now(timezone.utc).isoformat(),
                    'mutagen_version':mutagen.version_string,
                    'max_prefix_bytes_per_asset':PREFIX_BYTES,
                    'full_audio_files_downloaded':0, 'audio_decoded_or_played':False,
                    'original_recording_quality_verified':False,
                    'reuse_license_or_source_rights_verified':False, 'assets':[]}
          opener = build_opener(NoRedirect)
          for date in DATES:
              row = {'display_date':date, 'status':'NOT_FETCHED', 'prefix_bytes_read':0}
              url = ROOT + date + '-stereo.mp3'
              request = Request(url, headers={'Range':f'bytes=0-{PREFIX_BYTES-1}',
                  'Accept-Encoding':'identity', 'User-Agent':'frogcs-public-mp3-header-inventory/1.0'})
              try:
                  with opener.open(request, timeout=20) as response:
                      row['http_status'] = response.status
                      row['content_type'] = response.headers.get('Content-Type')
                      cr = response.headers.get('Content-Range','')
                      match = re.fullmatch(r'bytes 0-8191/(\d+)', cr)
                      if response.status != 206 or not match:
                          row['status'] = 'STOP_NO_BODY_READ_RANGE_NOT_HONOURED'
                      elif response.headers.get('Content-Encoding','identity') != 'identity':
                          row['status'] = 'STOP_NO_BODY_READ_UNEXPECTED_ENCODING'
                      else:
                          data = response.read(PREFIX_BYTES+1)
                          row['prefix_bytes_read'] = len(data)
                          if len(data) != PREFIX_BYTES: raise ValueError('PREFIX_LENGTH_MISMATCH')
                          row['http_full_resource_bytes'] = int(match[1])
                          row['prefix_sha256'] = sha256(data).hexdigest()
                          row['mp3_metadata'] = parse_prefix(data)
                          row['status'] = 'PUBLIC_PREFIX_PARSED_NO_AUDIO_DECODE'
              except HTTPError as exc: row.update(status='HTTP_STOP', http_status=exc.code)
              except (URLError, TimeoutError) as exc: row.update(status='NETWORK_STOP', error_type=type(exc).__name__)
              except Exception as exc: row.update(status='METADATA_PARSE_STOP', error_type=type(exc).__name__)
              report['assets'].append(row)
          report['total_prefix_bytes_read'] = sum(x['prefix_bytes_read'] for x in report['assets'])
          assert report['total_prefix_bytes_read'] <= len(DATES)*PREFIX_BYTES
          Path('napnap_mp3_header_inventory.json').write_text(json.dumps(report, indent=2)+'\n')
          print(json.dumps(report, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: napnap-public-mp3-header-metadata
          path: napnap_mp3_header_inventory.json
          if-no-files-found: error
