name: NAAMP atmospheric schema audit
on:
  push:
    branches:
      - exploration/naamp-atmospheric-schema-v1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - run: python exploration/audit_naamp_atmospheric_schema.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-atmospheric-schema-v0-1
          path: exploration/NAAMP_ATMOSPHERIC_SCHEMA_AUDIT_V0_1.json
          if-no-files-found: error
