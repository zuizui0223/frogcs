name: NAAMP history-context and checkerboard exploratory analyses

on:
  push:
    branches:
      - exploration/local-history-checkerboard-2026-10-20
    paths:
      - "exploration/run_naamp_history_local_context_v1.py"
      - "exploration/run_naamp_checkerboard_v1.py"
      - "exploration/NAAMP_LOCAL_HISTORY_CHECKERBOARD_CONTRACT_2026_10_20.json"
      - ".github/workflows/naamp_local_history_checkerboard_exploratory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history_context:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q numpy pandas scipy statsmodels
      - name: Compile and run post-hoc measured local context test
        run: |
          python -m py_compile exploration/run_naamp_history_local_context_v1.py
          python exploration/run_naamp_history_local_context_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: frogcs-exploratory-site-history-context-20261020
          path: build/exploratory/history_context_v1.json
          if-no-files-found: error

  checkerboard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q numpy pandas scipy statsmodels
      - name: Compile and run fixed-marginal checkerboard tests
        run: |
          python -m py_compile exploration/run_naamp_checkerboard_v1.py
          python exploration/run_naamp_checkerboard_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: frogcs-exploratory-checkerboard-20261020
          path: build/exploratory/checkerboard_v1.json
          if-no-files-found: error
