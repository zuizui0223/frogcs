name: Flow-MER frog public zero-row schema v5.0
on:
  push:
    branches:
      - audit/iowa-station-waterstate-source-gate-v31
    paths:
      - "studies/climate_landscape/scripts/audit_flowmer_public_schema_zero_rows_v50.py"
      - ".github/workflows/flowmer_frog_zero_row_schema_v50.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-zero-row-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Zero-row CKAN schema contract tests, fake values only
        run: python studies/climate_landscape/scripts/audit_flowmer_public_schema_zero_rows_v50.py --self-test
      - name: Request government frog dataset field definitions without observation records
        run: python studies/climate_landscape/scripts/audit_flowmer_public_schema_zero_rows_v50.py
      - name: Upload source status and field metadata receipt
        uses: actions/upload-artifact@v4
        with:
          name: flowmer-frog-ckan-zero-row-schema-v50
          path: studies/climate_landscape/receipts/FLOW_MER_FROG_PUBLIC_CKAN_ZERO_ROW_SCHEMA_V50.json
          if-no-files-found: error
