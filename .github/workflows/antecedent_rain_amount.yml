name: antecedent rain amount test
on:
  push:
    branches: [exploration/rain-amount-v1]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: rain-amount-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q icechunk xarray zarr numpy pandas scipy statsmodels patsy timezonefinder 'numcodecs[pcodec]'
      - run: python -m compileall -q exploration scripts
      - run: python exploration/run_naamp_antecedent_rain_amount.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-antecedent-rain-amount-v0-1
          path: |
            exploration/NAAMP_ANTECEDENT_RAIN_AMOUNT_CONTRACT_V0_1.json
            exploration/NAAMP_ANTECEDENT_RAIN_AMOUNT_RECEIPT_V0_1.json
          if-no-files-found: error
