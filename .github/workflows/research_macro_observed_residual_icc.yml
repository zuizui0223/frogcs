name: Frogcs NAAMP observed spatial residual ICC

on:
  push:
    branches:
      - research/multigeneration-reversal-abm-pde-20261031
    paths:
      - research/MACRO_OBSERVED_RESIDUAL_SPATIAL_NOISE_PROTOCOL_2026-10-31.md
      - research/scripts/estimate_naamp_residual_spatial_icc.py
      - research/scripts/test_estimate_naamp_residual_spatial_icc.py
      - .github/workflows/research_macro_observed_residual_icc.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observed-residual-spatial-moments:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pin original POM numeric environment
        run: python -m pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.3
      - name: Test unequal 2-degree block ICC, clone-safe bootstrap and spatial noise
        run: python -m unittest discover -s research/scripts -p 'test_estimate_naamp_residual_spatial_icc.py' -v
      - name: Audit actual 4248-site regression residual spatial structure
        run: python -u research/scripts/estimate_naamp_residual_spatial_icc.py --run
      - name: Verify archived site grain and ICC interval uncertainty
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import numpy as np
          import pandas as pd
          p=Path('research/results/macro_observed_residual_icc_20261031')
          s=pd.read_csv(p/'observed_residual_spatial_icc.csv')
          b=pd.read_csv(p/'conditional_block_bootstrap_icc.csv')
          r=json.loads((p/'receipt.json').read_text())
          assert len(s)==2 and len(b)==2*999
          assert set(s.background)=={'uniform','target_group'}
          assert s.n_spatial_blocks.eq(56).all()
          assert s.sites.eq(4248).all()
          assert s.completed_surveys.eq(63180).all()
          assert s.icc.between(0,1,inclusive='left').all()
          assert s.route_icc.between(0,1,inclusive='left').all()
          assert s.spatial_icc_ci_low.le(s.icc).all() or s.spatial_icc_ci_low.ge(0).all()
          assert np.isfinite(s[['observed_8term_rank_r2','alpha_block_to_site']]).all().all()
          assert r['sample_sites']==4248
          print('OBSERVED_RESIDUAL_SPATIAL_ICC_AUDIT_OK')
          PY
      - name: Print compact exact source-backed residual ICC
        run: |
          echo '===== observed_residual_spatial_icc.csv ====='
          cat research/results/macro_observed_residual_icc_20261031/observed_residual_spatial_icc.csv
      - name: Retain source-linked residual ICC and all 999-cluster bootstrap samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-observed-residual-spatial-icc-20261031
          path: research/results/macro_observed_residual_icc_20261031/
          if-no-files-found: warn
          retention-days: 30
