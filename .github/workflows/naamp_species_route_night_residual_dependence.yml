name: NAAMP species-route-night residual dependence

on:
  push:
    branches: [main]
    paths:
      - exploration/NAAMP_SPECIES_ROUTE_NIGHT_RESIDUAL_DEPENDENCE_CONTRACT_V0_1.json
      - exploration/run_naamp_species_route_night_residual_dependence.py
      - exploration/NAAMP_RAIN_AMOUNT_COMMON_ENVIRONMENT_NULL_RECEIPT_V0_1.json
      - .github/workflows/naamp_species_route_night_residual_dependence.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naamp-species-route-night-residual-dependence
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q icechunk xarray zarr numpy pandas scipy statsmodels patsy timezonefinder 'numcodecs[pcodec]'
      - name: Run fixed residual-dependence diagnostic
        run: python exploration/run_naamp_species_route_night_residual_dependence.py
      - name: Validate receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("exploration/NAAMP_SPECIES_ROUTE_NIGHT_RESIDUAL_DEPENDENCE_RECEIPT_V0_1.json")
          x=json.loads(p.read_text())
          assert x["status"] in {"posthoc_exploratory_triggered","not_run_trigger_not_met"}
          if x["status"]=="posthoc_exploratory_triggered":
              assert x["coverage"]["pairs"]==2835, x["coverage"]
              r=x["residual_dependence"]
              assert -1 <= r["rho_resid"] <= 1
              print(json.dumps({
                  "coverage":x["coverage"],
                  "rho":r,
                  "monitoring_translation":x["monitoring_translation"]
              },indent=2))
          else:
              print(json.dumps(x,indent=2))
          PY
      - name: Commit receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exploration/NAAMP_SPECIES_ROUTE_NIGHT_RESIDUAL_DEPENDENCE_RECEIPT_V0_1.json
          if git diff --cached --quiet; then
            echo "Receipt unchanged"
          else
            git commit -m "Record species-route-night residual dependence"
            git push origin HEAD:main
          fi
