name: new full chorus activation
on:
  push:
    branches: [exploration/full-chorus-activation-v1]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - run: python exploration/run_naamp_new_full_chorus_activation.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-new-full-chorus-activation-v0-1
          path: |
            exploration/NAAMP_NEW_FULL_CHORUS_ACTIVATION_CONTRACT_V0_1.json
            exploration/NAAMP_NEW_FULL_CHORUS_ACTIVATION_RECEIPT_V0_1.json
          if-no-files-found: error
