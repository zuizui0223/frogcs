name: NWI context fast execution

on:
  push:
    branches:
      - exploration/nwi-context-fast-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nwi-context-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy shapely pyproj
      - run: python -m compileall -q exploration scripts
      - name: Audit NWI context coverage
        run: python exploration/audit_naamp_nwi_context_eligibility.py
      - name: Test NWI hydroperiod recruitment if eligible
        run: python exploration/run_naamp_nwi_hydroperiod_recruitment.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-nwi-context-fast-v0-1
          path: |
            exploration/NAAMP_NWI_CONTEXT_ELIGIBILITY_CONTRACT_V0_1.json
            exploration/NAAMP_NWI_CONTEXT_ELIGIBILITY_RECEIPT_V0_1.json
            exploration/NAAMP_NWI_HYDROPERIOD_RECRUITMENT_CONTRACT_V0_1.json
            exploration/NAAMP_NWI_HYDROPERIOD_RECRUITMENT_RECEIPT_V0_1.json
          if-no-files-found: error
