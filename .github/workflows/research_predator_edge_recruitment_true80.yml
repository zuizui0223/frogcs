name: Frogcs genuine 80y four active predator-edge ablations across local recruitment

on:
  push:
    branches:
      - research/predator-edge-recruitment-gate-20261031
    paths:
      - .github/workflows/research_predator_edge_recruitment_true80.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  intact-seasonal-hazards-with-one-edge-removed:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        regime: ["rate12_base","rate12_rho0"]
        edge: ["SF","DF","DS","SD"]
        seed_start: [101,105,109]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2'
      - name: Prove original four hazards active, F-to-D emergence structurally null and existing integer source unchanged
        run: |
          python -m unittest discover -s research/scripts -p test_predator_edge_recruitment_source.py -v
          python -m unittest discover -s research/scripts -p test_finite_n_source_cohort_bridge.py -v
      - name: Execute genuine original 120day trophic + 80y maturation source in finite N with exactly one edge removed
        run: python research/scripts/run_predator_edge_recruitment_80y.py --run --regime ${{ matrix.regime }} --edge-off ${{ matrix.edge }} --seed-start ${{ matrix.seed_start }}
      - name: Preserve exact 80year source 0-to-positive return events and unmodified conditional recruitment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-predator-edge-80y-regime${{ matrix.regime }}-edge${{ matrix.edge }}-seed${{ matrix.seed_start }}
          path: research/results/predator_edge_recruitment_80y_20261031/
          if-no-files-found: warn
          retention-days: 30
