name: naamp source context exploration

on:
  push:
    branches:
      - exploration/naamp-source-context-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect ScienceBase source package
        run: |
          mkdir -p exploration
          python - <<'PY'
          import csv, io, json, urllib.request
          from pathlib import Path
          item_url="https://www.sciencebase.gov/catalog/item/583dc314e4b0d1899f9dea8d?format=json"
          req=urllib.request.Request(item_url,headers={"User-Agent":"frogcs-naamp-source-context/0.1","Accept":"application/json"})
          with urllib.request.urlopen(req,timeout=60) as r:
              obj=json.loads(r.read().decode("utf-8"))
          files=[]
          for f in obj.get("files") or []:
              files.append({
                  "name":f.get("name"),
                  "contentType":f.get("contentType"),
                  "size":f.get("size"),
                  "downloadUri":f.get("downloadUri"),
              })
          out={
              "analysis":"naamp_source_context_manifest_v0_1",
              "item_id":"583dc314e4b0d1899f9dea8d",
              "title":obj.get("title"),
              "n_files":len(files),
              "files":files,
          }
          Path("exploration/NAAMP_SOURCE_CONTEXT_MANIFEST_V0_1.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY
      - name: Inspect Coordinates schema and coverage
        run: |
          python - <<'PY'
          import csv, hashlib, io, json, urllib.request
          from collections import Counter
          from pathlib import Path
          item="https://www.sciencebase.gov/catalog/item/583dc314e4b0d1899f9dea8d?format=json"
          req=urllib.request.Request(item,headers={"User-Agent":"frogcs-coordinate-audit/0.1","Accept":"application/json"})
          with urllib.request.urlopen(req,timeout=60) as r:
              obj=json.loads(r.read().decode("utf-8"))
          f=next(x for x in obj["files"] if x.get("name")=="Coordinates.csv")
          url=f.get("downloadUri")
          req=urllib.request.Request(url,headers={"User-Agent":"frogcs-coordinate-audit/0.1"})
          with urllib.request.urlopen(req,timeout=120) as r:
              raw=r.read()
          rows=list(csv.DictReader(io.StringIO(raw.decode("utf-8-sig"))))
          cols=list(rows[0]) if rows else []
          candidates=[x for x in cols if any(k in x.lower() for k in ("lat","lon","state","route","stop","site","coord","elev"))]
          cardinality={x:len({(r.get(x) or "").strip() for r in rows if (r.get(x) or "").strip()}) for x in cols}
          examples=[{k:r.get(k) for k in cols} for r in rows[:10]]
          out={
            "analysis":"naamp_coordinates_schema_v0_1",
            "sha256":hashlib.sha256(raw).hexdigest(),
            "bytes":len(raw),
            "n_rows":len(rows),
            "columns":cols,
            "context_candidates":candidates,
            "cardinality":cardinality,
            "examples":examples,
          }
          Path("exploration/NAAMP_COORDINATES_SCHEMA_V0_1.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-source-context-manifest-v0-1
          path: |
            exploration/NAAMP_SOURCE_CONTEXT_MANIFEST_V0_1.json
            exploration/NAAMP_COORDINATES_SCHEMA_V0_1.json
          if-no-files-found: error
