name: WFTS common-environment weather QA

on:
  push:
    branches: [main]
    paths:
      - revision/WFTS_PROSPECTIVE_COMMON_ENVIRONMENT_DIAGNOSTIC_V0_2.json
      - scripts/wfts/build_common_environment_covariates.py
      - scripts/wfts/generate_synthetic_daymet_fixture.py
      - .github/workflows/wfts_common_environment_weather_qa.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {contents: read}

concurrency:
  group: wfts-common-environment-weather-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  synthetic-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q numpy pandas
      - name: Generate response-free Daymet fixture
        run: python scripts/wfts/generate_synthetic_daymet_fixture.py --outdir build/common-env-fixture
      - name: Build fixed 1/3/7-day covariates
        run: |
          python scripts/wfts/build_common_environment_covariates.py \
            --station-surveys build/common-env-fixture/station_surveys.csv \
            --fixture-dir build/common-env-fixture/raw \
            --cache-dir build/common-env-cache \
            --output-runs build/common-env-fixture/common_env_runs.csv \
            --output-stations build/common-env-fixture/common_env_stations.csv \
            --receipt build/common-env-fixture/common_env_receipt.json
      - name: Audit semantics
        run: |
          python - <<'PY'
          import json, numpy as np, pandas as pd
          from pathlib import Path
          receipt=json.loads(Path("build/common-env-fixture/common_env_receipt.json").read_text())
          runs=pd.read_csv("build/common-env-fixture/common_env_runs.csv")
          st=pd.read_csv("build/common-env-fixture/common_env_stations.csv")
          assert receipt["response_columns_read"] is False
          assert receipt["daymet"]["survey_day_precipitation_used"] is False
          assert receipt["daymet"]["primary_window_days"]==3
          assert receipt["counts"]=={"physical_sites":10,"route_runs":2,"station_surveys":20}
          wet=runs[runs.survey_year==2012].iloc[0]
          dry=runs[runs.survey_year==2013].iloc[0]
          for col in ("prcp_1d_exposure","prcp_3d_exposure","prcp_7d_exposure"):
              assert np.isclose(wet[col],np.log1p(5.0)), (col,wet[col])
              assert np.isclose(dry[col],0.0), (col,dry[col])
          s12=st[st.survey_year==2012]
          assert set(s12.prcp_1d_mm)=={5.0}
          assert set(s12.prcp_3d_mm)=={5.0}
          assert set(s12.prcp_7d_mm)=={5.0}
          print({"status":"PASS","wet_log1p":float(np.log1p(5.0))})
          PY
      - name: Confirm response columns fail closed
        run: |
          cp build/common-env-fixture/station_surveys.csv build/common-env-fixture/bad.csv
          python - <<'PY'
          import pandas as pd
          p="build/common-env-fixture/bad.csv"
          x=pd.read_csv(p); x["call_index"]=0; x.to_csv(p,index=False)
          PY
          set +e
          python scripts/wfts/build_common_environment_covariates.py \
            --station-surveys build/common-env-fixture/bad.csv \
            --fixture-dir build/common-env-fixture/raw \
            --cache-dir build/common-env-cache-bad \
            --output-runs build/common-env-fixture/bad_runs.csv \
            --output-stations build/common-env-fixture/bad_stations.csv \
            --receipt build/common-env-fixture/bad_receipt.json
          status=$?
          set -e
          test "$status" -ne 0
