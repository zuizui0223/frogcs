name: frogcs cross-period episodic recruitment

on:
  push:
    branches:
      - revision/episodic-breeder-filter-v1
    paths:
      - "NAAMP_CROSSPERIOD_EPISODIC_RECRUITMENT_CONTRACT_V0_1.json"
      - "scripts/run_naamp_crossperiod_episodic_recruitment.py"
      - ".github/workflows/crossperiod_episodic_recruitment.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  episodicity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - name: Run frozen cross-period episodic recruitment test
        run: python scripts/run_naamp_crossperiod_episodic_recruitment.py
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-crossperiod-episodic-recruitment-v0-1
          path: NAAMP_CROSSPERIOD_EPISODIC_RECRUITMENT_RECEIPT_V0_1.json
          if-no-files-found: error
