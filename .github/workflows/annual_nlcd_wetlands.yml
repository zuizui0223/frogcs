name: Annual NLCD surveyed wetland classes
on:
  push:
    branches: [research/annual-nlcd-wetland-classes-20261111]
    paths: [research/scripts/annual_nlcd_wetland_extract.py, .github/workflows/annual_nlcd_wetlands.yml]
permissions:
  contents: read
jobs:
  extract:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        year: [2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/scripts
            research/results/naamp_remote_vegetation_20261026
            research/results/naamp_three_guild_occurrence/full_naamp_history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests pyproj rasterio
      - run: python research/scripts/annual_nlcd_wetland_extract.py ${{ matrix.year }} extracted
      - uses: actions/upload-artifact@v4
        with:
          name: nlcd-${{ matrix.year }}
          path: extracted/
