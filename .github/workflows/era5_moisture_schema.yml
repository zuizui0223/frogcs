name: ERA5 moisture schema audit
on:
  push:
    branches: [exploration/era5-moisture-schema-v1]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q icechunk xarray zarr numpy pandas 'numcodecs[pcodec]'
      - run: python exploration/audit_era5_moisture_schema.py
      - uses: actions/upload-artifact@v4
        with:
          name: era5-moisture-schema-v0-1
          path: exploration/ERA5_MOISTURE_SCHEMA_AUDIT_V0_1.json
          if-no-files-found: error
