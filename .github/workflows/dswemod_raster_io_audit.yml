name: DSWEmod raster IO audit
on:
  push:
    branches: [remotesensing/naamp-dynamic-hydrology-v1]
    paths:
      - ".github/workflows/dswemod_raster_io_audit.yml"
      - "scripts/remotesensing/audit_dswemod_raster_io.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check rasterio
      - run: python scripts/remotesensing/audit_dswemod_raster_io.py
