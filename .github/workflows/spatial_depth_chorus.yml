name: spatial depth chorus decomposition
on:
  push:
    branches: [exploration/spatial-depth-chorus-v1]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - run: python exploration/run_naamp_spatial_depth_chorus_decomposition.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-spatial-depth-chorus-v0-1
          path: |
            exploration/NAAMP_SPATIAL_DEPTH_CHORUS_DECOMPOSITION_CONTRACT_V0_1.json
            exploration/NAAMP_SPATIAL_DEPTH_CHORUS_DECOMPOSITION_RECEIPT_V0_1.json
          if-no-files-found: error
