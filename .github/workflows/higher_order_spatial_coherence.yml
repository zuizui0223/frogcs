name: higher-order spatial coherence
on:
  push:
    branches: [exploration/higher-order-spatial-coherence-v1]
    paths-ignore:
      - exploration/NAAMP_HIGHER_ORDER_SPATIAL_COHERENCE_RECEIPT_V0_1.json
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - run: python exploration/run_naamp_higher_order_spatial_coherence.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-higher-order-spatial-coherence-v0-1
          path: |
            exploration/NAAMP_HIGHER_ORDER_SPATIAL_COHERENCE_CONTRACT_V0_1.json
            exploration/NAAMP_HIGHER_ORDER_SPATIAL_COHERENCE_RECEIPT_V0_1.json
          if-no-files-found: error
      - name: Commit receipt to analysis branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exploration/NAAMP_HIGHER_ORDER_SPATIAL_COHERENCE_RECEIPT_V0_1.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record higher-order spatial coherence receipt"
          git push
