name: Frogcs source-locked 80y spatial annual cohort full pilot

on:
  push:
    branches:
      - research/common-kernel-spatial-cohort-20261031
    paths:
      - .github/workflows/research_spatial_annual_cohort_80year.yml
      - research/scripts/spatial_cohort_80y_bridge.py
      - research/scripts/test_spatial_cohort_80y_bridge.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-80year-ontogeny-vegetation-movement:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact cohort and predator source
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install biology source requirements
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2'
      - name: Require source replay and movement-conservation tests
        run: python -m unittest discover -s research/scripts -p test_spatial_cohort_80y_bridge.py -v
      - name: Execute actual 80-year matched four-rate pilot
        run: python research/scripts/spatial_cohort_80y_bridge.py --run --draws 4 --years 80 --window 20 --transfer 0.15
      - name: Upload original 80-year source outcome and comparison tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-80year-spatial-cohort-4rate-3plant-3order-4movement
          path: research/results/common_kernel_spatial_cohort_20261031/
          if-no-files-found: warn
          retention-days: 30
