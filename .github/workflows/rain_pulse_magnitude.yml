name: rain pulse magnitude mechanism test

on:
  push:
    branches:
      - exploration/rain-pulse-magnitude-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rain-pulse-magnitude-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - run: python -m compileall -q exploration scripts
      - name: Run prefixed rain-pulse magnitude test
        run: python exploration/run_naamp_rain_pulse_magnitude.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-rain-pulse-magnitude-v0-1
          path: |
            exploration/NAAMP_RAIN_PULSE_MAGNITUDE_CONTRACT_V0_1.json
            exploration/NAAMP_RAIN_PULSE_MAGNITUDE_RECEIPT_V0_1.json
          if-no-files-found: error
