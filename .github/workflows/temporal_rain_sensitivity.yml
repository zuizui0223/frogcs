name: frogcs temporally disjoint rain-sensitivity test

on:
  push:
    branches:
      - revision/rain-response-persistence-v1
    paths:
      - "MECHANISM_SCREEN_LEDGER_V0_1.md"
      - "NAAMP_TEMPORAL_RAIN_SENSITIVITY_CONTRACT_V0_1.json"
      - "scripts/run_naamp_temporal_rain_sensitivity.py"
      - ".github/workflows/temporal_rain_sensitivity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  temporal-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - name: Recompute fixed 29-species response family
        run: python scripts/run_naamp_species_pulse_heterogeneity.py

      - name: Run final frozen mechanism test
        run: python scripts/run_naamp_temporal_rain_sensitivity.py
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-temporal-rain-sensitivity-v0-1
          path: NAAMP_TEMPORAL_RAIN_SENSITIVITY_RECEIPT_V0_1.json
          if-no-files-found: error
