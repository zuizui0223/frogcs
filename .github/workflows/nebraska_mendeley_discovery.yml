name: Nebraska Mendeley public-file discovery
on:
  push:
    branches: [exploration/nebraska-external-v1]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: nebraska-mendeley-discovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q requests
      - run: python exploration/discover_nebraska_mendeley_html.py
      - uses: actions/upload-artifact@v4
        with:
          name: nebraska-mendeley-html-discovery-v0-1
          path: exploration/NEBRASKA_MENDELEY_HTML_DISCOVERY_V0_1.json
          if-no-files-found: error
