name: Landsat DSWE STAC preflight
on:
  push:
    branches: [remotesensing/naamp-dynamic-hydrology-v1]
    paths:
      - ".github/workflows/landsat_dswe_stac_preflight.yml"
      - "scripts/remotesensing/preflight_landsat_dswe_stac.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/remotesensing/preflight_landsat_dswe_stac.py
