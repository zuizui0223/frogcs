name: NAAMP logistic-normal route-night latent state

on:
  push:
    branches: [main]
    paths:
      - exploration/NAAMP_LOGISTIC_NORMAL_ROUTE_NIGHT_STATE_CONTRACT_V0_1.json
      - exploration/run_naamp_logistic_normal_route_night_state.py
      - .github/workflows/naamp_logistic_normal_route_night_state.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: naamp-logistic-normal-route-night-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -q icechunk xarray zarr numpy pandas scipy statsmodels patsy timezonefinder 'numcodecs[pcodec]'
      - name: Run frozen latent-state magnitude model
        run: python exploration/run_naamp_logistic_normal_route_night_state.py
      - name: Validate receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("exploration/NAAMP_LOGISTIC_NORMAL_ROUTE_NIGHT_STATE_RECEIPT_V0_1.json")
          x=json.loads(p.read_text())
          assert x["coverage"]["pairs"]==2835, x["coverage"]
          assert x["coverage"]["all_clusters"]==18769
          assert x["coverage"]["dry_route_silent_clusters"]==8343
          for k in ("all_clusters","dry_route_silent"):
              r=x[k]
              assert 0 <= r["sigma_hat"] <= 5
              assert 0 <= r["latent_logistic_icc"] <= 1
              assert r["one_sd_common_state_odds_multiplier"] >= 1
              assert r["likelihood_ratio_statistic"] >= 0
          print(json.dumps({
              "all":x["all_clusters"],
              "dry_route_silent":x["dry_route_silent"]
          },indent=2))
          PY
      - name: Commit receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exploration/NAAMP_LOGISTIC_NORMAL_ROUTE_NIGHT_STATE_RECEIPT_V0_1.json
          if git diff --cached --quiet; then
            echo "Receipt unchanged"
          else
            git commit -m "Record logistic-normal route-night latent state"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main && exit 0
              sleep 2
            done
            exit 1
          fi
