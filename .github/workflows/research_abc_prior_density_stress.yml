name: Frogcs genuine 80-year ABC biological prior-density stress

on:
  push:
    branches:
      - research/multigeneration-reversal-abm-pde-20261031
    paths:
      - research/MODEL_NATIVE_ABC_PRIOR_DENSITY_SENSITIVITY_PROTOCOL_2026-10-31.md
      - research/scripts/abc_prior_density_stress.py
      - research/scripts/test_abc_prior_density_stress.py
      - .github/workflows/research_abc_prior_density_stress.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  matched-prior-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned numeric and original two-stage RF dependencies
        run: python -m pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.3 scikit-learn==1.7.2
      - name: Unit tests of analytical density ratios and matched 256 prior IDs
        run: python -m unittest discover -s research/scripts -p 'test_abc_prior_density_stress.py' -v
      - name: Download genuine 80-year simulator source priors from independently completed Actions
        uses: actions/download-artifact@v4
        with:
          run-id: 41178134567
          pattern: frogcs-native-abc-prior-*-20261031
          merge-multiple: true
          github-token: ${{ github.token }}
          path: research/results/model_native_abc_rf_20261031
      - name: Rerun exact conditional ABC on 9 changed biological rate densities without new model fitting
        run: python -u research/scripts/abc_prior_density_stress.py --run --bootstrap 999
      - name: Verify source-complete weighted ABC posteriors, paired CIs and ESS
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import numpy as np
          import pandas as pd
          root=Path('research/results/model_native_abc_rf_20261031')
          s=pd.read_csv(root/'prior_density_stress_class_shares.csv')
          m=pd.read_csv(root/'prior_density_stress_structural_axis_marginals.csv')
          w=pd.read_csv(root/'prior_density_stress_source_weights.csv')
          top=pd.read_csv(root/'prior_density_stress_winner_sensitivity.csv')
          per=pd.read_csv(root/'prior_density_stress_source_paired_draw_acceptance.csv')
          r=json.loads((root/'prior_density_stress_receipt.json').read_text())
          assert len(s)==9*2*12 and len(m)==9*2*7
          assert len(top)==9*2 and len(w)==9*256
          assert len(per)==12*256*2
          assert s.groupby(['scale','prior_sensitivity']).conditional_abc_share.sum().between(.999999,1.000001).all()
          assert m.groupby(['scale','prior_sensitivity','dimension']).conditional_abc_share.sum().between(.999999,1.000001).all()
          assert w.groupby('scenario').weight.sum().between(255.99999,256.00001).all()
          assert s.effective_prior_draws.gt(0).all()
          assert s.weighted_acceptance_rate.between(0,1).all()
          assert s.acceptance_rate_ci_low.le(s.acceptance_rate_ci_high).all()
          assert r['source_runs_80year']==6144 and r['n_matched_prior_draws']==256
          assert r['original_model_replay_success']
          print('GENUINE_80Y_RATE_PRIOR_STRESS_SUCCESS',len(s),'class/prior/scale estimates and 999 paired blocks')
          PY
      - name: Print all conditional prior sensitivity outcomes and original-context effects
        run: |
          for f in prior_density_stress_winner_sensitivity.csv prior_density_stress_structural_axis_marginals.csv; do
            echo "===== $f ====="
            cat "research/results/model_native_abc_rf_20261031/$f"
          done
          echo '===== log class shares only ====='
          python - <<'PY'
          import pandas as pd
          x=pd.read_csv('research/results/model_native_abc_rf_20261031/prior_density_stress_class_shares.csv')
          print(x[x.scale=='log'][['prior_sensitivity','structure_id','weighted_acceptance_rate',
                                  'conditional_abc_share','effective_prior_draws',
                                  'effective_accepted_draws']].to_csv(index=False))
          PY
      - name: Preserve complete source-weight ledger, class and axis bootstrap, source SHA receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frogcs-genuine-80year-abc-prior-density-sensitivity-20261031
          path: |
            research/results/model_native_abc_rf_20261031/prior_density_stress_*.csv
            research/results/model_native_abc_rf_20261031/prior_density_stress_receipt.json
          retention-days: 30
          if-no-files-found: warn
