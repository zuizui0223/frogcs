name: Iowa 360417 historic aerial orthophoto source validation
on:
  push:
    branches:
      - study/climate-landscape-acoustic-sites-v0
    paths:
      - '.github/workflows/climate_iowa_360417_historical_ortho_v18.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  orthophoto-public-service:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-projection and image-validation dependencies
        run: python -m pip install pyproj pillow
      - name: Retrieve fixed original 2004 and 2014 Iowa NAIP orthophotos without amphibian data
        run: |
          python - <<'PY'
          import hashlib,json,urllib.request,urllib.parse,xml.etree.ElementTree as ET,io
          from pathlib import Path
          from PIL import Image,ImageStat
          from pyproj import Transformer
          root=Path('studies/climate_landscape/reference_routes/iowa_dnr_360417_source_only_stops_v16.csv')
          expected='8b7be934dc32aa71791b4e6c38295d25cbcebb66f2f6ab39714d41ce7b65f227'
          if hashlib.sha256(root.read_bytes()).hexdigest()!=expected:
              raise ValueError('Published nominal site coords changed')
          import csv
          pts={int(r['stop_number']):r for r in csv.DictReader(root.open())}
          if set(pts)!=set(range(1,11)):
              raise ValueError('Frozen site key set changed')
          services={
              2004:'https://ortho.gis.iastate.edu/arcgis/services/ortho/naip_2004_nc/ImageServer/WMSServer',
              2014:'https://ortho.gis.iastate.edu/arcgis/services/ortho/naip_2014_nc/ImageServer/WMSServer'
          }
          outdir=Path('iowa_360417_ortho_v18');outdir.mkdir(exist_ok=True)
          outinfo={'analysis':'Iowa_360417_independent_2004_2014_ortho_source_pilot',
               'no_NAAMP_frog_counts_read':True,'site_selection':'3 vs 10 chosen after older NLCD readout: DESCRIPTIVE ONLY',
               'zero_independently_verified_2001_2015_physical_station_continuity':True,'photos':[],'source_services':[]}
          for year,url in services.items():
              record={'year':year,'url':url}
              try:
                  def retrieve(parameters):
                      target=url+'?'+urllib.parse.urlencode(parameters)
                      request=urllib.request.Request(target,headers={'User-Agent':'frogcs-iowa-site-landcover-external-validation/1.8'})
                      with urllib.request.urlopen(request,timeout=65) as r:
                          raw=r.read(2_000_001)
                          mime=r.headers.get('Content-Type','')
                      if len(raw)>2_000_000:
                          raise ValueError('Excessive small source WMS image')
                      return raw,mime
                  doc,mime=retrieve({'SERVICE':'WMS','VERSION':'1.3.0','REQUEST':'GetCapabilities'})
                  cap=ET.fromstring(doc)
                  ns=lambda s:s.split('}')[-1]
                  names=[(e.text or '').strip() for e in cap.iter() if ns(e.tag)=='Name' and e.text]
                  matching=[v for v in names if f'naip_{year}_nc' in v.lower()]
                  if len(set(matching))!=1:
                      raise ValueError(f'WMS published layer identity unavailable/ambiguous: {matching[:10]}')
                  layer=matching[0]
                  record.update({'wms_layer':layer,'capabilities_sha256':hashlib.sha256(doc).hexdigest()})
                  trans=Transformer.from_crs('EPSG:4326','EPSG:3857',always_xy=True)
                  for site in (3,10):
                      row=pts[site];lon=float(row['longitude']);lat=float(row['latitude'])
                      x,y=trans.transform(lon,lat)
                      # Explicit 700m WebMercator frame for comparison; 2014 and 2004 identical.
                      half=350
                      bbox=','.join(f'{v:.3f}' for v in (x-half,y-half,x+half,y+half))
                      params={'SERVICE':'WMS','VERSION':'1.3.0','REQUEST':'GetMap','LAYERS':layer,
                              'STYLES':'','CRS':'EPSG:3857','BBOX':bbox,
                              'WIDTH':600,'HEIGHT':600,'FORMAT':'image/png','TRANSPARENT':'FALSE'}
                      raw,mime=retrieve(params)
                      rec={'year':year,'site':site,'geometry_bbox_3857':bbox,'wms_layer':layer,
                           'file_bytes':len(raw),'content_type':mime}
                      if not raw.startswith(b'\x89PNG\r\n\x1a\n'):
                          rec.update({'status':'not_png','response':raw[:450].decode('utf8','replace')})
                      else:
                          im=Image.open(io.BytesIO(raw)).convert('RGB')
                          ext=[z[1]-z[0] for z in im.getextrema()]
                          if im.size!=(600,600) or max(ext)<3:
                              rec.update({'status':'blank_or_unexpected'})
                          else:
                              out=outdir/f'iowa_360417_site{site}_{year}_NAIP_nc.png'
                              out.write_bytes(raw)
                              rec.update({'status':'image_retrieved','sha256':hashlib.sha256(raw).hexdigest(),
                                          'size':list(im.size),'RGB_channel_ranges':ext,
                                          'saved_file':out.name})
                      print(json.dumps(rec,sort_keys=True),flush=True)
                      outinfo['photos'].append(rec)
                  record['status']='source_layer_resolved'
              except Exception as exc:
                  record['status']='source_unavailable_or_bad_schema'
                  record['error_type']=type(exc).__name__
                  record['error_message']=str(exc)[:300]
              outinfo['source_services'].append(record)
          (outdir/'source_metadata.json').write_text(json.dumps(outinfo,indent=2,sort_keys=True))
          if not any(p['status']=='image_retrieved' for p in outinfo['photos']):
              print('All source image retrieval failed; no visual ecological claim')
          PY
      - name: Save original small source images and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iowa360417-historic-naip-source-check-v18
          path: iowa_360417_ortho_v18/
          if-no-files-found: warn
          retention-days: 30
