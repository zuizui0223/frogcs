name: species-specific site template
on:
  push:
    branches: [exploration/species-specific-site-template-v1]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - run: python -m compileall -q exploration scripts
      - run: python exploration/run_naamp_species_specific_site_template.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-species-specific-site-template-v0-1
          path: |
            exploration/NAAMP_SPECIES_SPECIFIC_SITE_TEMPLATE_CONTRACT_V0_1.json
            exploration/NAAMP_SPECIES_SPECIFIC_SITE_TEMPLATE_RECEIPT_V0_1.json
          if-no-files-found: error
