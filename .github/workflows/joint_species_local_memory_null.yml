name: joint crossfit species local-memory null
on:
  push:
    branches: [exploration/joint-species-memory-null-v1]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: joint-species-memory-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q numpy pandas scipy statsmodels patsy
      - run: python -m compileall -q exploration scripts
      - run: python exploration/run_naamp_joint_species_local_memory_null.py
      - uses: actions/upload-artifact@v4
        with:
          name: naamp-joint-species-local-memory-null-v0-1
          path: |
            exploration/NAAMP_JOINT_SPECIES_LOCAL_MEMORY_NULL_CONTRACT_V0_1.json
            exploration/NAAMP_JOINT_SPECIES_LOCAL_MEMORY_NULL_RECEIPT_V0_1.json
          if-no-files-found: error
