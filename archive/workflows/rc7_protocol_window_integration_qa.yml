name: RC7 protocol-window integration QA

on:
  push:
    branches:
      - revision/rc7-protocol-window-sensitivity-v1
    paths:
      - "MANUSCRIPT_JAE_V0_9.md"
      - "SUPPORTING_INFORMATION_JAE_RC7_V0_1.md"
      - "submission/COVER_LETTER_JAE_V0_7.md"
      - "NAAMP_PROTOCOL_WINDOW_SENSITIVITY_SUMMARY_V0_1.json"
      - "scripts/audit_rc7_protocol_window_integration.py"
      - ".github/workflows/rc7_protocol_window_integration_qa.yml"
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/audit_rc7_protocol_window_integration.py
