name: migrate root JSON provenance

on:
  push:
    branches:
      - cleanup/root-json-provenance-v1
    paths:
      - "scripts/migrate_root_json_provenance.py"
      - ".github/workflows/migrate_root_json_provenance.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Migrate root JSON files and rewrite active references
        run: python scripts/migrate_root_json_provenance.py
      - name: Commit deterministic migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git commit -m "organize root JSON provenance"
          git push origin HEAD:cleanup/root-json-provenance-v1
