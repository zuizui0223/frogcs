name: deep cleanup final validation
on:
  push:
    branches: [cleanup/deep-structure-v1]
    paths:
      - ".github/workflows/deep_final_validation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --disable-pip-version-check -q python-docx==1.2.0 PyYAML==6.0.2
      - name: Compile active scripts
        run: python -m compileall -q scripts
      - name: Parse active workflows
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for p in Path(".github/workflows").glob("*.yml"):
              yaml.safe_load(p.read_text(encoding="utf-8"))
          print({"status":"PASS","workflows":len(list(Path(".github/workflows").glob("*.yml")))})
          PY
      - name: Scientific package QA
        run: python scripts/qa/audit_rc11_submission_package.py
      - name: JAE compliance
        run: python scripts/qa/audit_jae_initial_submission_rc11_2026.py
      - name: Anonymous DOCX build
        run: |
          python scripts/submission/build_jae_anonymous_docx.py --source MANUSCRIPT_JAE_V1_3.md --output /tmp/Manuscript.docx
          python scripts/submission/build_jae_anonymous_docx.py --source SUPPORTING_INFORMATION_JAE_RC11_V0_1.md --output /tmp/Supporting_Information.docx
