name: RC7 geographic generality scientific QA

on:
  workflow_dispatch:
  push:
    branches:
      - revision/rc6-geographic-generality-audit-v1
    paths:
      - "MANUSCRIPT_JAE_V0_9.md"
      - "SUPPORTING_INFORMATION_JAE_RC7_V0_1.md"
      - "NAAMP_GEOGRAPHIC_GENERALITY_AUDIT_SUMMARY_V0_1.json"
      - "submission/COVER_LETTER_JAE_V0_7.md"
      - "scripts/audit_rc7_generality_package.py"
      - ".github/workflows/rc7_generality_qa.yml"

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/audit_rc7_generality_package.py
