name: RC8 hypothesis spine QA

on:
  push:
    branches:
      - revision/rc8-hypothesis-spine-v1
    paths:
      - "MANUSCRIPT_JAE_V1_0.md"
      - "submission/RC8_POSTFREEZE_HYPOTHESIS_SPINE_RECEIPT_V0_1.json"
      - "scripts/audit_rc8_hypothesis_spine.py"
      - ".github/workflows/rc8_hypothesis_spine_qa.yml"
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/audit_rc8_hypothesis_spine.py
