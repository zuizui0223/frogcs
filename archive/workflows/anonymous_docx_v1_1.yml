name: frogcs JAE v1.1 RC9 anonymous DOCX
on:
  push:
    branches:
      - revision/rc8-crosscontinental-depth-v1
    paths:
      - "MANUSCRIPT_JAE_V1_1.md"
      - "SUPPORTING_INFORMATION_JAE_RC9_V0_1.md"
      - "scripts/build_jae_anonymous_docx.py"
      - "scripts/audit_rc9_submission_package.py"
      - "CROSSCONTINENTAL_ACTIVE_DEPTH_SUMMARY_V0_1.json"
      - ".github/workflows/anonymous_docx_v1_1.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -q python-docx==1.2.0
      - run: python scripts/audit_rc9_submission_package.py
      - name: Build anonymous RC9 main DOCX
        run: python scripts/build_jae_anonymous_docx.py --source MANUSCRIPT_JAE_V1_1.md --output build/FROG_JAE_ANON_MAIN_V1_1.docx
      - name: Build anonymous RC9 SI DOCX
        run: python scripts/build_jae_anonymous_docx.py --source SUPPORTING_INFORMATION_JAE_RC9_V0_1.md --output build/FROG_JAE_SUPPORTING_INFORMATION_RC9.docx
      - name: Verify RC9 anonymous DOCX
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re
          p=Path("build/FROG_JAE_ANON_MAIN_V1_1.docx")
          assert p.is_file() and p.stat().st_size>10000
          with ZipFile(p) as z:
              doc=z.read("word/document.xml").decode("utf-8")
              core=z.read("docProps/core.xml").decode("utf-8")
          assert "40,754" in doc
          assert "0.0818" in doc
          assert "80.9% boundary crossing" in doc
          assert not re.search(r"<dc:creator>[^<]+</dc:creator>",core)
          print("RC9 anonymous DOCX QA PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frogcs-jae-v1-1-rc9-anonymous-docx
          path: |
            build/FROG_JAE_ANON_MAIN_V1_1.docx
            build/FROG_JAE_SUPPORTING_INFORMATION_RC9.docx
          if-no-files-found: error
