<svg xmlns="http://www.w3.org/2000/svg" width="180mm" height="118mm" viewBox="0 0 1200 790">
<rect width="1200" height="790" fill="white"/>
<text x="60" y="55" text-anchor="start" style="font-family:Arial,Helvetica,sans-serif;font-size:30px;font-weight:bold;">Figure 3. NAAMP rain signal is concentrated in participation breadth</text>
<rect x="430" y="95" width="340" height="82" rx="20" fill="#f7f7f7" stroke="#111" stroke-width="3"/>
<text x="600" y="130" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:28px;font-weight:bold;">More recent rainfall</text>
<text x="600" y="158" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:normal;">lower dryness exposure</text>
<line x1="520" y1="177" x2="335" y2="245" stroke="#111" stroke-width="3"/>
<rect x="70" y="235" width="500" height="405" rx="24" fill="#f7f7f7" stroke="#111" stroke-width="3"/>
<text x="320" y="278" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:27px;font-weight:bold;">Participation across stops and run</text>
<text x="320" y="315" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:bold;">Any calling at a stop</text>
<text x="320" y="346" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:normal;">OR dryness = 0.904</text>
<text x="320" y="374" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:19px;font-weight:normal;">P = 4.63e-08</text>
<line x1="150" y1="405" x2="490" y2="405" stroke="#111" stroke-width="2" stroke-dasharray="7 7"/>
<text x="320" y="447" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:21px;font-weight:bold;">Run-level active species pool</text>
<text x="320" y="478" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:normal;">β dryness = -0.0187</text>
<text x="320" y="506" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:normal;">95% CI -0.0286 to -0.0089</text>
<text x="320" y="534" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:19px;font-weight:normal;">P = 1.92e-04</text>
<text x="320" y="595" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:bold;">Supported: recent rain increases</text>
<text x="320" y="622" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:bold;">active-stop coverage and pool breadth</text>
<line x1="680" y1="177" x2="865" y2="245" stroke="#111" stroke-width="3"/>
<rect x="630" y="235" width="500" height="405" rx="24" fill="#fff" stroke="#111" stroke-width="3"/>
<text x="880" y="278" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:27px;font-weight:bold;">Residual association</text>
<text x="880" y="315" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:bold;">P(≥2 species | ≥1 active)</text>
<text x="880" y="345" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:normal;">OR dryness = 0.988 · P = 0.402</text>
<text x="880" y="390" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:bold;">Observed − independence expectation</text>
<text x="880" y="420" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:normal;">β = 0.00088 · P = 0.389</text>
<text x="880" y="465" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:bold;">Mean pairwise excess covariance</text>
<text x="880" y="495" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:normal;">β = 0.00062 · P = 0.205</text>
<text x="880" y="530" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:19px;font-weight:bold;">Fixed-marginal shuffle residual</text>
<text x="880" y="558" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:normal;">β = 0.00093 · P = 0.368</text>
<text x="880" y="592" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:19px;font-weight:bold;">Pairwise network density</text>
<text x="880" y="620" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:normal;">OR dryness = 0.994 · P = 0.724</text>
<rect x="220" y="685" width="760" height="66" rx="18" fill="#efefef" stroke="#111" stroke-width="2"/>
<text x="600" y="715" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:23px;font-weight:bold;">Interpretation: broader stop-level participation</text>
<text x="600" y="740" text-anchor="middle" style="font-family:Arial,Helvetica,sans-serif;font-size:18px;font-weight:normal;">without detectable strengthening of within-active-unit or residual association</text>
</svg>
