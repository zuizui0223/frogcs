<text x="55" y="825" class="small">Observed</text><circle cx="700" cy="820" r="10" class="darkfill"/><text x="717" y="826" class="num">1.524</text>

<text x="875" y="685" class="lab">Strictly-prior-history subset (2,916 pairs)</text>
<line x1="1040" y1="865" x2="1510" y2="865" class="axis"/>
<text x="1040" y="890" class="small" text-anchor="middle">1.1</text>
<text x="1197" y="890" class="small" text-anchor="middle">1.3</text>
<text x="1353" y="890" class="small" text-anchor="middle">1.5</text>
<text x="1510" y="890" class="small" text-anchor="middle">1.7</text>
<text x="875" y="735" class="small">Species + prior SiteID + dry persistence</text>
<circle cx="1239" cy="730" r="8" class="midfill"/><text x="1255" y="736" class="small">1.353</text>
<text x="875" y="780" class="small">+ held-out rain × history gate</text>
<circle cx="1223" cy="775" r="8" class="lightfill" stroke="#555"/><text x="1239" y="781" class="small">1.332</text>
<text x="875" y="825" class="small">Observed</text>
<circle cx="1471" cy="820" r="10" class="darkfill"/><text x="1488" y="826" class="num">1.650</text>
<text x="875" y="920" class="small">All conditional residual tests: P = 0.000999</text>

<!-- Panel D -->
<text x="55" y="965" class="panel">D  The deep response is a strong-chorus signal</text>
<rect x="520" y="940" width="760" height="32" fill="#eeeeee" stroke="#333"/>
<rect x="520" y="940" width="739" height="32" class="darkfill"/>
<text x="900" y="963" fill="white" font-family="Arial" font-size="18" font-weight="700" text-anchor="middle">97.3% of third+ coefficient carried by CI2/3</text>
<text x="1300" y="963" class="small">CI1-only 2.7%</text>
<text x="55" y="1010" class="sub">Adjacent-stop links: β = 0.419; conditional P = 0.000999 under both primary nulls · same-observer + same-SiteID CI2/3 share = 95.4%</text>

<text x="55" y="1038" class="small">Interpretation: higher-order route-scale spatial dependence in expressed acoustic activity; not literal simultaneity, movement, or a causal rainfall mechanism.</text>
</svg>