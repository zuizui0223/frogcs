<line x1="1147" y1="495" x2="1465" y2="495" stroke="#777" stroke-width="5"/>
<circle cx="1306" cy="495" r="10" class="midfill"/>
<text x="1440" y="501" class="small">β = 0.254 (0.138–0.371)</text>

<!-- Panel C -->
<text x="55" y="615" class="panel">C  Stronger first-order models still underpredict within-taxon concentration</text>
<text x="55" y="643" class="sub">Observed higher-order β versus prediction at the observed recruited-taxon and extra-stop coefficients</text>
<line x1="250" y1="865" x2="835" y2="865" class="axis"/>
<text x="250" y="890" class="small" text-anchor="middle">0.6</text>
<text x="396" y="890" class="small" text-anchor="middle">0.9</text>
<text x="542" y="890" class="small" text-anchor="middle">1.2</text>
<text x="688" y="890" class="small" text-anchor="middle">1.5</text>
<text x="835" y="890" class="small" text-anchor="middle">1.8</text>

<text x="55" y="685" class="lab">Full 4,236 pairs</text>
<text x="55" y="720" class="small">Persistence</text><circle cx="340" cy="715" r="8" class="lightfill" stroke="#555"/><text x="355" y="721" class="small">0.784</text>
<text x="55" y="755" class="small">Uniform</text><circle cx="512" cy="750" r="8" class="midfill"/><text x="527" y="756" class="small">1.138</text>
