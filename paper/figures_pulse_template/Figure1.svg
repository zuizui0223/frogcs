<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="860" viewBox="0 0 1500 860">
<rect width="1500" height="860" fill="white"/>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:29px;font-weight:700}.panel{font-size:23px;font-weight:700}.sub{font-size:16px}.lab{font-size:17px;font-weight:600}.small{font-size:14px}.num{font-size:20px;font-weight:700}.axis{stroke:#222;stroke-width:2}.dark{fill:#333}.mid{fill:#888}.light{fill:#ddd}.box{fill:#f7f7f7;stroke:#999;stroke-width:1.5}
</style>
<text x="50" y="50" class="title">Figure 1. Rain-associated change enters from silence and often as strong chorus</text>
<text x="50" y="80" class="sub">CallingIndex 3 is a continuous overlapping chorus in which individual callers cannot be distinguished.</text>

<text x="55" y="125" class="panel">A  The behaviourally active community expands</text>
<line x1="250" y1="320" x2="700" y2="320" class="axis"/>
<line x1="250" y1="155" x2="250" y2="330" stroke="#aaa"/>
<text x="250" y="345" class="small" text-anchor="middle">0</text>
<text x="400" y="345" class="small" text-anchor="middle">0.15</text>
<text x="550" y="345" class="small" text-anchor="middle">0.30</text>
<text x="700" y="345" class="small" text-anchor="middle">0.45</text>
<text x="55" y="190" class="lab">Active stops</text><line x1="490" y1="184" x2="646" y2="184" stroke="#222" stroke-width="5"/><circle cx="634" cy="184" r="9" class="dark"/><text x="670" y="190" class="small">β 0.384 (0.240–0.528)</text>
<text x="55" y="240" class="lab">Richness / active stop</text><line x1="273" y1="234" x2="386" y2="234" stroke="#777" stroke-width="5"/><circle cx="329" cy="234" r="9" class="mid"/><text x="405" y="240" class="small">β 0.079 (0.023–0.136)</text>
<text x="55" y="290" class="lab">Route richness</text><line x1="415" y1="284" x2="657" y2="284" stroke="#444" stroke-width="5"/><circle cx="536" cy="284" r="9" class="dark"/><text x="680" y="290" class="small">β 0.286 (0.165–0.407)</text>

<text x="790" y="125" class="panel">B  Most CallingIndex change comes from silent cells switching on</text>
<rect x="820" y="180" width="560" height="60" class="light" stroke="#333"/>
<rect x="820" y="180" width="366" height="60" class="dark"/>
<text x="1003" y="217" fill="white" font-family="Arial" font-size="20" font-weight="700" text-anchor="middle">0→positive activation 65.3%</text>
<text x="1280" y="217" class="small" text-anchor="middle">other CallingIndex change</text>
<text x="820" y="270" class="sub">Total CallingIndex rainfall coefficient = 2.841 · activation component = 1.855</text>

<text x="790" y="330" class="panel">C  New activation is usually already overlapping/full chorus</text>
<rect x="820" y="380" width="560" height="60" class="light" stroke="#333"/>
<rect x="820" y="380" width="488" height="60" class="dark"/>
<text x="1064" y="417" fill="white" font-family="Arial" font-size="20" font-weight="700" text-anchor="middle">0→CI2/3 = 87.1% of activation</text>
<text x="1342" y="417" class="small" text-anchor="middle">CI1 remainder</text>
<text x="820" y="470" class="sub">Strong activation coefficient = 1.615</text>

<text x="55" y="430" class="panel">D  Direct silence → full-chorus transitions increase with rain contrast</text>
<line x1="230" y1="650" x2="720" y2="650" class="axis"/>
<line x1="230" y1="515" x2="230" y2="665" stroke="#aaa"/>
<text x="230" y="680" class="small" text-anchor="middle">0</text>
<text x="393" y="680" class="small" text-anchor="middle">0.25</text>
<text x="557" y="680" class="small" text-anchor="middle">0.50</text>
<text x="720" y="680" class="small" text-anchor="middle">0.75</text>
<text x="55" y="555" class="lab">Full sample</text>
<line x1="304" y1="548" x2="732" y2="548" stroke="#222" stroke-width="5"/><circle cx="518" cy="548" r="10" class="dark"/>
<text x="750" y="554" class="small">β = 0.441 (0.114–0.768)</text>
<text x="55" y="610" class="lab">Same observer + same SiteID</text>
<line x1="296" y1="603" x2="836" y2="603" stroke="#777" stroke-width="5"/><circle cx="566" cy="603" r="10" class="mid"/>
<text x="750" y="609" class="small">β = 0.514 (0.101–0.927)</text>

<rect x="790" y="540" width="610" height="150" rx="8" class="box"/>
<text x="815" y="575" class="lab">Interpretation boundary</text>
<text x="815" y="608" class="sub">A dry acoustic zero is not confirmed physical absence.</text>
<text x="815" y="638" class="sub">The result concerns reproductive acoustic state, not abundance,</text>
<text x="815" y="668" class="sub">occupancy, spawning or reproductive success.</text>

<text x="50" y="820" class="sub" font-weight="700">Biological message: recent-rain conditions are associated with rapid transitions from acoustic silence into substantial chorus states, not merely small intensity increases among already-active cells.</text>
</svg>