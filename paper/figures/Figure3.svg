<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820">
<rect width="1500" height="820" fill="white"/>
<text x="50" y="50" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="bold">Figure 3. Active-unit taxonomic depth has the same recent-rain direction in NAAMP and FrogID</text>
<text x="50" y="82" font-family="Arial" font-size="16">Cross-dataset consistency only: rainfall exposures and observation designs differ, so effect sizes are not pooled or directly compared.</text>

<text x="55" y="130" font-family="Arial" font-size="23" font-weight="bold">A  Shared response meaning</text>
<rect x="70" y="165" width="300" height="145" rx="10" fill="#f2f2f2" stroke="#333"/>
<text x="220" y="198" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">NAAMP</text>
<text x="220" y="232" text-anchor="middle" font-family="Arial" font-size="17">standardized active route stop</text>
<text x="220" y="268" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold">depth = richness − 1</text>
<rect x="420" y="165" width="300" height="145" rx="10" fill="#f2f2f2" stroke="#333"/>
<text x="570" y="198" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">FrogID</text>
<text x="570" y="232" text-anchor="middle" font-family="Arial" font-size="17">expert-validated active recording</text>
<text x="570" y="268" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold">depth = richness − 1</text>

<text x="55" y="370" font-family="Arial" font-size="23" font-weight="bold">B  NAAMP wetter–drier matched routes</text>
<text x="55" y="402" font-family="Arial" font-size="16">Positive β = greater depth with larger wetter–drier rainfall contrast</text>
<line x1="120" y1="500" x2="650" y2="500" stroke="#222" stroke-width="2"/>
<line x1="190" y1="468" x2="190" y2="530" stroke="#999" stroke-width="2"/>
<line x1="270" y1="485" x2="598" y2="485" stroke="#111" stroke-width="5"/><circle cx="434" cy="485" r="10" fill="#111"/>
<text x="120" y="565" font-family="Arial" font-size="18">β = +0.0794 · 95% CI +0.0231 to +0.1357 · P = 0.00569</text>
<text x="120" y="600" font-family="Arial" font-size="16">4,236 matched pairs · 585 routes · 21 states</text>

<text x="780" y="130" font-family="Arial" font-size="23" font-weight="bold">C  FrogID antecedent dry-spell exposure</text>
<text x="780" y="162" font-family="Arial" font-size="16">Negative β = lower depth with dryness → greater depth nearer recent rain</text>
<line x1="850" y1="350" x2="1400" y2="350" stroke="#222" stroke-width="2"/>
<line x1="1360" y1="205" x2="1360" y2="380" stroke="#999" stroke-width="2"/>
<text x="780" y="225" font-family="Arial" font-size="16">Primary · ERA5-cell cluster</text><line x1="950" y1="220" x2="1090" y2="220" stroke="#111" stroke-width="5"/><circle cx="1020" cy="220" r="9" fill="#111"/>
<text x="780" y="275" font-family="Arial" font-size="16">Recorder-clustered</text><line x1="965" y1="270" x2="1075" y2="270" stroke="#444" stroke-width="5"/><circle cx="1020" cy="270" r="9" fill="#444"/>
<text x="780" y="325" font-family="Arial" font-size="16">Within ERA5 cell</text><line x1="870" y1="320" x2="1025" y2="320" stroke="#777" stroke-width="5"/><circle cx="942" cy="320" r="9" fill="#777"/>
<text x="780" y="420" font-family="Arial" font-size="17">Primary β = −0.0818 · 95% CI −0.0982 to −0.0654</text>
<text x="780" y="452" font-family="Arial" font-size="16">Recorder CI = −0.0949 to −0.0686</text>
<text x="780" y="484" font-family="Arial" font-size="16">Within-cell β = −0.0998 · 95% CI −0.1182 to −0.0815</text>
<text x="780" y="516" font-family="Arial" font-size="16">40,754 recordings · 1,623 ERA5 cells · 13,148 recorders</text>
<rect x="780" y="555" width="620" height="145" rx="10" fill="#f5f5f5" stroke="#aaa"/>
<text x="800" y="590" font-family="Arial" font-size="19" font-weight="bold">Deeper multiplicity points the same way</text>
<text x="800" y="625" font-family="Arial" font-size="16">≥3 species: OR per 1 SD dryness = 0.846 · 95% CI 0.811–0.881</text>
<text x="800" y="658" font-family="Arial" font-size="16">Excess beyond two: β = −0.0483 · 95% CI −0.0600 to −0.0367</text>

<text x="55" y="760" font-family="Arial" font-size="17" font-weight="bold">Interpretation: directional cross-dataset consistency, not independent replication or a shared-effect-size estimate.</text>
</svg>